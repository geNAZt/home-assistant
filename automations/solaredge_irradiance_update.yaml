- id: solaredge_irradiance_update
  alias: "SolarEdge: Update Solar Irradiance"
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/15"
  condition:
    - condition: state
      entity_id: sun.sun
      state: "above_horizon"
  action:
    - action: shell_command.solaredge_update_irradiance
      response_variable: irradiance_result
    - if:
        - condition: template
          value_template: "{{ irradiance_result is defined and irradiance_result.stdout is defined and (irradiance_result.stdout | trim | length) > 0 }}"
      then:
        - action: input_number.set_value
          target:
            entity_id: input_number.solar_irradiance
          data:
            value: "{{ (irradiance_result.stdout | from_json).irradiance | float(0) }}"
