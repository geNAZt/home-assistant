- alias: speisekammer licht automatisch AN
  id: auto_light_speisekammer_on
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.presence_speisekammer
      to: "on"
    - platform: numeric_state
      entity_id: sensor.lux_speisekammer
      below: 140           # waterLowLux
      for: "00:00:05"
    - platform: state
      entity_id: input_boolean.auto_light_speisekammer
      to: "on"

  condition:
    # Automatik muss an sein
    - condition: state
      entity_id: input_boolean.auto_light_speisekammer
      state: "on"

    # Präsenz notwendig
    - condition: state
      entity_id: binary_sensor.presence_speisekammer
      state: "on"

    # Lux muss UNTER waterLow / Threshold sein
    - condition: numeric_state
      entity_id: sensor.lux_speisekammer
      below: 140

    # Licht nur einschalten, wenn es wirklich aus ist
    - condition: state
      entity_id: light.speisekammer_lights
      state: "off"

    # ForceOn darf nicht aktiv sein
    - condition: state
      entity_id: input_boolean.force_on_speisekammer
      state: "off"

  action:
    - variables:
        saved_brightness: "{{ states('input_number.speisekammer_brightness') | int(0) }}"
        brightness: >
          {{ 255 if saved_brightness == 0 else ([saved_brightness, 255] | min) }}
        color_temp: "{{ states('input_number.speisekammer_color_temp') | int(370) }}"
    - service: light.turn_on
      target:
        entity_id: light.speisekammer_lights
      data:
        brightness: "{{ brightness }}"
        color_temp_kelvin: "{{ color_temp }}"