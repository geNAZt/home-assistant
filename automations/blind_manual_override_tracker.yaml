- id: 'cover_manual_override_tracker'
  alias: "Rolladen: Manuelle Steuerung durch Mensch erkennen"
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - cover.rollade_bad
        - cover.rollade_buero_fabian
        - cover.rollade_buero_merja
        - cover.rollade_hwr
        - cover.rollade_kueche_links
        - cover.rollade_kueche_rechts
        - cover.rollade_schlafzimmer
        - cover.rollade_speisekammer
        - cover.rollade_wohnzimmer_links
        - cover.rollade_wohnzimmer_rechts
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.context.parent_id is none }}"
  actions:
    - variables:
        suffix: "{{ trigger.entity_id.split('.')[1] }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: "{{ 'input_datetime.cover_manual_change_' ~ suffix }}"
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: system_log.write
      data:
        logger: automatic_cover_control
        level: info
        message: "[Cover Manual Override] Human manual operation detected on {{ trigger.entity_id }}. Initiating 1-hour manual cooldown."
