- id: 'cover_manual_override_tracker'
  alias: "Rolladen: Manuelle Steuerung durch Mensch erkennen"
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - cover.rollade_bad
        - cover.rollade_buero_fabian
        - cover.rollade_buero_merja
        - cover.rollade_hwr
        - cover.rollade_kueche_links
        - cover.rollade_kueche_rechts
        - cover.rollade_schlafzimmer
        - cover.rollade_speisekammer
        - cover.rollade_wohnzimmer_links
        - cover.rollade_wohnzimmer_rechts
      not_from:
        - unavailable
        - unknown
      not_to:
        - unavailable
        - unknown
  conditions:
    - condition: template
      value_template: >-
        {% set fs = trigger.from_state %}
        {% set ts = trigger.to_state %}
        {% if fs is none or ts is none %}
          false
        {% else %}
          {% set from_pos = fs.attributes.get('current_position') %}
          {% set to_pos = ts.attributes.get('current_position') %}
          {% set pos_changed = (from_pos is not none and to_pos is not none and ((from_pos | int - to_pos | int) | abs >= 2)) %}
          {% set state_changed = (fs.state != ts.state) %}
          {% set meaningful_change = state_changed or pos_changed %}
          {% set by_ha_user = (ts.context.user_id is not none) %}
          {% set global_dt = states('input_datetime.cover_last_global_move') %}
          {% set last_global_ts = as_timestamp(global_dt, 0) | float(0) if global_dt not in ['unknown', 'unavailable', 'none', ''] else 0 %}
          {% set not_auto_feedback = (ts.context.parent_id is none) and ((as_timestamp(now()) - last_global_ts) > 45) %}
          {{ meaningful_change and (by_ha_user or not_auto_feedback) }}
        {% endif %}
  actions:
    - variables:
        suffix: "{{ trigger.entity_id.split('.')[1] }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: "{{ 'input_datetime.cover_manual_change_' ~ suffix }}"
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: system_log.write
      data:
        logger: automatic_cover_control
        level: info
        message: "[Cover Manual Override] Human manual operation detected on {{ trigger.entity_id }}. Initiating 1-hour manual cooldown."
