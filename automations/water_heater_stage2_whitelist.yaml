- id: water_heater_stage2_whitelist
  alias: Water Heater Stage2 Whitelist
  description: Whitelists stage 2 when stage 1 is enabled for at least 3 minutes and power stays below 300W (60°C reached).
  mode: restart
  trigger:
    - platform: numeric_state
      entity_id: sensor.water_heating_pump_power
      below: 300
      for: "00:01:00"
    - platform: time_pattern
      minutes: "/1"
    - platform: state
      entity_id: switch.water_heater_pv_switch_powerr_usage_stage_1
      to: "off"
    - platform: time
      at: "00:00:05"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform in ['numeric_state', 'time_pattern'] }}"
            - condition: state
              entity_id: switch.water_heater_pv_switch_powerr_usage_stage_1
              state: "on"
              for: "00:03:00"
            - condition: numeric_state
              entity_id: sensor.water_heating_pump_power
              below: 300
            - condition: state
              entity_id: input_boolean.water_heater_stage2_whitelist
              state: "off"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.water_heater_stage2_whitelist
            - service: logbook.log
              data:
                name: Water Heater Stage2 Whitelist
                message: >-
                  Stage 2 whitelisted (60°C reached): stage1=on for >=3m and pump power below 300W
        - conditions:
            - condition: template
              value_template: >-
                {{
                  trigger.platform == 'time'
                  or (
                    trigger.platform == 'state'
                    and (states('sensor.water_heating_pump_power') | float(0) >= 300)
                  )
                }}
            - condition: state
              entity_id: input_boolean.water_heater_stage2_whitelist
              state: "on"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.water_heater_stage2_whitelist
      default: []
