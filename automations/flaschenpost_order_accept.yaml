- id: flaschenpost_order_accept
  alias: "Flaschenpost: Bestellung per Benachrichtigung bestätigen"
  description: "Bestellt den Warenkorb sofort im nächsten Lieferfenster, wenn in der Benachrichtigung 'Bestellen' geklickt wird."
  triggers:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: FLASCHENPOST_ORDER_ACCEPT
  actions:
    - action: flaschenpost.place_order
      data:
        confirm: true
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.flaschenpost_order_pending
    - action: notify.mobile_app_poco_x7_pro_fabian
      data:
        title: "✅ Flaschenpost: Bestellung aufgegeben"
        message: "Die Flaschenpost-Bestellung wurde erfolgreich im nächsten verfügbaren Zeitfenster aufgegeben."
        data:
          tag: "flaschenpost_cart_weekly"
  mode: single
