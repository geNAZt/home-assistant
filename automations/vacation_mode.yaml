- id: 'vacation_mode_keep_lights_off'
  alias: "Vacation Mode: Keep Lights Off"
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - light.licht_bad_virtuell
        - light.licht_buero_fabian_virtuell
        - light.licht_buero_merja_virtuell
        - light.licht_flur_virtuell
        - light.licht_kueche_virtuell
        - light.licht_schlafzimmer_virtuell
        - light.licht_speisekammer_virtuell
        - light.licht_wohnzimmer_virtuell
    - trigger: state
      entity_id: binary_sensor.vacation_mode
      to: "on"
    - trigger: time
      at: "00:00:05"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "on"
    - condition: template
      value_template: >-
        {{ trigger.platform != 'state' or trigger.entity_id == 'binary_sensor.vacation_mode' or not is_state(trigger.entity_id, 'off') }}
  actions:
    - action: light.turn_off
      target:
        entity_id:
          - light.licht_bad_virtuell
          - light.licht_buero_fabian_virtuell
          - light.licht_buero_merja_virtuell
          - light.licht_flur_virtuell
          - light.licht_kueche_virtuell
          - light.licht_schlafzimmer_virtuell
          - light.licht_speisekammer_virtuell
          - light.licht_wohnzimmer_virtuell

- id: 'vacation_mode_keep_lock_locked'
  alias: "Vacation Mode: Keep Lock Locked"
  mode: single
  triggers:
    - trigger: state
      entity_id: lock.home
    - trigger: state
      entity_id: binary_sensor.vacation_mode
      to: "on"
    - trigger: time
      at: "00:00:05"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "on"
    - condition: template
      value_template: >-
        {{ trigger.platform != 'state' or trigger.entity_id == 'binary_sensor.vacation_mode' or not is_state(trigger.entity_id, 'locked') }}
  actions:
    - action: lock.lock
      target:
        entity_id: lock.home

