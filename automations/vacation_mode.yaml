      event: start
  conditions:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "on"
    - condition: template
      value_template: >-
        {{ trigger.platform != 'state' or trigger.entity_id == 'binary_sensor.vacation_mode' or not is_state(trigger.entity_id, 'off') }}
