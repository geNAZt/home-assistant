- id: 'vacation_mode_keep_lights_off'
  alias: "Vacation Mode: Keep Lights Off"
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - light.bad_lights
        - light.buero_fabian_lights
        - light.buero_merja_lights
        - light.flur_lights
        - light.kueche_lights
        - light.schlafzimmer_lights
        - light.speisekammer_lights
        - light.wohnzimmer_lights
    - trigger: state
      entity_id: binary_sensor.vacation_mode
      to: "on"
    - trigger: time
      at: "00:00:05"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "on"
    - condition: state
      entity_id: lock.home
      state: "locked"
    - condition: template
      value_template: >-
        {{ trigger.platform != 'state' or trigger.entity_id == 'binary_sensor.vacation_mode' or not is_state(trigger.entity_id, 'off') }}
  actions:
    - action: light.turn_off
      target:
        entity_id:
          - light.bad_lights
          - light.buero_fabian_lights
          - light.buero_merja_lights
          - light.flur_lights
          - light.kueche_lights
          - light.schlafzimmer_lights
          - light.speisekammer_lights
          - light.wohnzimmer_lights

- id: 'vacation_mode_keep_lock_locked'
  alias: "Vacation Mode: Keep Lock Locked"
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.vacation_mode
      to: "on"
    - trigger: time
      at: "00:00:05"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "on"
    - condition: template
      value_template: >-
        {% set lights = [
          'light.bad_lights',
          'light.buero_fabian_lights',
          'light.buero_merja_lights',
          'light.flur_lights',
          'light.kueche_lights',
          'light.schlafzimmer_lights',
          'light.speisekammer_lights',
          'light.wohnzimmer_lights'
        ] %}
        {{ not is_state('lock.home', 'locked') and (lights | select('is_state', 'on') | list | count == 0) }}
  actions:
    - action: lock.lock
      target:
        entity_id: lock.home

- id: 'vacation_mode_relock_10am_unlock'
  alias: "Vacation Mode: Re-lock 10:00 Automated Unlock"
  mode: single
  triggers:
    - trigger: state
      entity_id: lock.home
      to: unlocked
    - trigger: time
      at: "10:00:00"
    - trigger: time
      at: "10:00:05"
    - trigger: time
      at: "10:00:10"
  conditions:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "on"
    - condition: time
      after: "09:59:45"
      before: "10:00:30"
    - condition: state
      entity_id: lock.home
      state: "unlocked"
  actions:
    - action: lock.lock
      target:
        entity_id: lock.home
    - action: system_log.write
      data:
        logger: vacation_mode
        level: info
        message: "[Vacation Mode] Blocked 10:00 automated lock unlock: Re-locked lock.home"

- id: 'vacation_mode_lock_when_lights_out'
  alias: "Vacation Mode: Lock When Lights Out"
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - light.bad_lights
        - light.buero_fabian_lights
        - light.buero_merja_lights
        - light.flur_lights
        - light.kueche_lights
        - light.schlafzimmer_lights
        - light.speisekammer_lights
        - light.wohnzimmer_lights
      to: "off"
  conditions:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "on"
    - condition: state
      entity_id: lock.home
      state: "unlocked"
    - condition: template
      value_template: >-
        {% set lights = [
          'light.bad_lights',
          'light.buero_fabian_lights',
          'light.buero_merja_lights',
          'light.flur_lights',
          'light.kueche_lights',
          'light.schlafzimmer_lights',
          'light.speisekammer_lights',
          'light.wohnzimmer_lights'
        ] %}
        {{ (lights | select('is_state', 'on') | list | count) == 0 }}
  actions:
    - action: lock.lock
      target:
        entity_id: lock.home

- id: 'vacation_mode_presence_notification'
  alias: "Vacation Mode: Presence Notification"
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.presence_bad
        - binary_sensor.presence_buero_fabian
        - binary_sensor.presence_buero_merja
        - binary_sensor.presence_flur
        - binary_sensor.presence_kueche
        - binary_sensor.presence_schlafzimmer
        - binary_sensor.presence_speisekammer
        - binary_sensor.presence_wohnzimmer
      to: "on"
  conditions:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "on"
  actions:
    - action: notify.mobile_app_poco_x7_pro_fabian
      data:
        title: "Vacation Mode: Presence Detected"
        message: "Presence detected: {{ trigger.to_state.name }}"

- id: 'vacation_mode_covers'
  alias: "Vacation Mode: Cover Automatic Day Mode"
  mode: single
  triggers:
    - trigger: sun
      event: sunrise
      offset: "00:15:00"
      id: sunrise_15m
    - trigger: state
      entity_id: binary_sensor.vacation_mode
      to: "on"
      id: vacation_on
  conditions:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "on"
  actions:
    - action: input_select.select_option
      target:
        entity_id: input_select.cover_mode
      data:
        option: "Automatic"
    - if:
        - condition: or
          conditions:
            - condition: trigger
              id: sunrise_15m
            - condition: state
              entity_id: sun.sun
              state: "above_horizon"
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.cover_night_mode
        - action: input_datetime.set_datetime
          target:
            entity_id:
              - input_datetime.cover_manual_change_rollade_bad
              - input_datetime.cover_manual_change_rollade_buero_fabian
              - input_datetime.cover_manual_change_rollade_buero_merja
              - input_datetime.cover_manual_change_rollade_hwr
              - input_datetime.cover_manual_change_rollade_kueche_links
              - input_datetime.cover_manual_change_rollade_kueche_rechts
              - input_datetime.cover_manual_change_rollade_schlafzimmer
              - input_datetime.cover_manual_change_rollade_speisekammer
              - input_datetime.cover_manual_change_rollade_wohnzimmer_links
              - input_datetime.cover_manual_change_rollade_wohnzimmer_rechts
          data:
            datetime: "1970-01-01 00:00:00"
        - action: system_log.write
          data:
            logger: automatic_cover_control
            level: info
            message: "[Cover Vacation Mode] Sunrise + 15m reached: Night mode deactivated, cooldowns reset, cover mode set to Automatic."

- id: 'vacation_mode_keep_poe_off'
