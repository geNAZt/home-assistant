- id: 'turn_on_poe_8'
  alias: Turn on PoE at 08:00
  mode: single
  triggers:
    - trigger: time
      at: "08:00:00"
  conditions:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "off"
  actions:
    - action: script.turn_on_poe
      metadata: {}
      data: {}
- id: 'turn_on_poe_when_door_unlocks'
  alias: Turn on PoE when door unlocks
  mode: single
  triggers:
  - trigger: state
    entity_id:
    - lock.home
    to: unlocked
  conditions:
  - condition: state
    entity_id: binary_sensor.vacation_mode
    state: "off"
  actions:
    - action: script.turn_on_poe
      metadata: {}
      data: {}