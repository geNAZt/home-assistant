- id: heating_reset_debt_on_setpoint_crossing
  alias: "Heizung: Reset debt on setpoint crossing"
  description: >
    Kalibriert den 2R2C-Masseknoten auf den gewichteten mittleren Sollwert, sobald die Raumtemperatur den Sollwert erreicht.
  mode: single

  trigger:
    - platform: state
      entity_id: sensor.inside_temp_mean_now
    - platform: time_pattern
      minutes: "/5"

  condition:
    - condition: state
      entity_id: input_boolean.debt_reset_on_setpoint_hit
      state: "on"

  action:
    - variables:
        mean_setpoint: >-
          {% set weights = {
            'wohnzimmer': 11.9,
            'kueche': 19.5,
            'flur': 29.0,
            'schlafzimmer': 9.1,
            'buero_fabian': 6.6,
            'buero_merja': 13.9,
            'bad': 4.9,
            'speisekammer': 5.1
          } %}
          {% set ns = namespace(w_sum=0.0, w_total=0.0) %}
          {% for room, w in weights.items() %}
            {% set val = states('input_number.heating_base_' ~ room) | float(none) %}
            {% if val is not none %}
              {% set ns.w_sum = ns.w_sum + (val * w) %}
              {% set ns.w_total = ns.w_total + w %}
            {% endif %}
          {% endfor %}
          {{ (ns.w_sum / ns.w_total) | round(2) if ns.w_total > 0 else 0 }}

        current_temp: "{{ states('sensor.inside_temp_mean_now') | float(0) }}"
        is_at_setpoint: "{{ (current_temp - mean_setpoint) | abs <= 0.05 }}"

    - if:
        - condition: template
          value_template: "{{ is_at_setpoint }}"
      then:
        - event: thermal_2r2c_calibrate
          event_data:
            target_temp: "{{ mean_setpoint }}"

        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.debt_reset_on_setpoint_hit

        - service: persistent_notification.create
          data:
            notification_id: heating_2r2c_calibrated
            title: "2R2C-Heizungskonto kalibriert"
            message: "Der 2R2C-Speicher wurde auf {{ mean_setpoint }}°C kalibriert (Ist-Luft: {{ current_temp | round(2) }}°C)."
