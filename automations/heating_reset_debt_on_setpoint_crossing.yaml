- id: heating_reset_debt_on_setpoint_crossing
  alias: "Heizung: Reset debt on setpoint crossing"
  description: >
    Berechnet den gewichteten mittleren Sollwert aller Räume und nullt das Konto bei Übereinstimmung nach Sollwert-Änderung.
  mode: single

  trigger:
    - platform: state
      entity_id: sensor.inside_temp_mean_now
    - platform: time_pattern
      minutes: "/5"

  condition:
    - condition: state
      entity_id: input_boolean.debt_reset_on_setpoint_hit
      state: "on"

  action:
    - variables:
        # Gewichteter Schnitt der Raum-Sollwerte passend zu sensor.inside_temp_mean_now
        mean_setpoint: >-
          {% set weights = {
            'wohnzimmer': 11.9,
            'kueche': 19.5,
            'flur': 29.0,
            'schlafzimmer': 9.1,
            'buero_fabian': 6.6,
            'buero_merja': 13.9,
            'bad': 4.9,
            'speisekammer': 5.1
          } %}
          {% set ns = namespace(w_sum=0.0, w_total=0.0) %}
          {% for room, w in weights.items() %}
            {% set val = states('input_number.heating_base_' ~ room) | float(none) %}
            {% if val is not none %}
              {% set ns.w_sum = ns.w_sum + (val * w) %}
              {% set ns.w_total = ns.w_total + w %}
            {% endif %}
          {% endfor %}
          {{ (ns.w_sum / ns.w_total) | round(2) if ns.w_total > 0 else 0 }}

        current_temp: "{{ states('sensor.inside_temp_mean_now') | float(0) }}"

        # Prüfung auf Übereinstimmung mit 0.05K Toleranz
        is_at_setpoint: "{{ (current_temp - mean_setpoint) | abs <= 0.05 }}"

    - if:
        - condition: template
          value_template: "{{ is_at_setpoint }}"
      then:
        # 1. Das Konto mit dem Python-Script nullen
        - service: python_script.set_state
          data:
            entity_id: sensor.heating_energy_debt_tracker
            state: 0

        # 2. Den Reset-Schalter wieder auf aus stellen
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.debt_reset_on_setpoint_hit

        - service: notify.persistent_notification
          data:
            title: "Heizungskonto kalibriert"
            message: "Das Konto wurde auf 0 Wh gesetzt (Soll: {{ mean_setpoint }}°C / Ist: {{ current_temp }}°C)."
