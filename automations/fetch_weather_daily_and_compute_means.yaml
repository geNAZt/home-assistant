- id: fetch_weather_daily_and_compute_means
  alias: "Weather: hourly forecast → 24h Außen-Ø & ΔT"
  mode: single
  trigger:
    - platform: time_pattern
      hours: "/1"
      minutes: 7
    - platform: homeassistant
      event: start
  variables:
    # Gewichtetes Innenziel-Mittel (Basis-Sollwerte ohne temporäre Preheat/PV-Offsets)
    inside_target_mean_c: >-
      {% set weights = {'wohnzimmer': 11.9, 'kueche': 19.5, 'flur': 29.0, 'schlafzimmer': 9.1, 'buero_fabian': 6.6, 'buero_merja': 13.9, 'bad': 4.9, 'speisekammer': 5.1} %}
      {% set wns = namespace(w_sum=0.0, w_total=0.0) %}
      {% for room, w in weights.items() %}
        {% set t = states('input_number.heating_base_' ~ room) | float(none) %}
        {% if t is not none and t > 0 %}
          {% set wns.w_sum = wns.w_sum + (t * w) %}
          {% set wns.w_total = wns.w_total + w %}
        {% endif %}
      {% endfor %}
      {{ ((wns.w_sum / wns.w_total) if wns.w_total > 0 else 21.0) | round(2) }}
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.barsinghausen_hohenb
      data:
        type: hourly
      response_variable: fc
    - variables:
        # Stündliche Forecast-Temperaturen für die nächsten 24h
        outside_vals: >-
          {% set now_ts = as_timestamp(now()) %}
          {% set ahead = now_ts + 24 * 3600 %}
          {% set arr = fc['weather.barsinghausen_hohenb']['forecast'] if ('weather.barsinghausen_hohenb' in fc and 'forecast' in fc['weather.barsinghausen_hohenb']) else [] %}
          {% set ns = namespace(vals=[]) %}
          {% for e in arr %}
            {% set ts = as_timestamp(e.datetime if e.datetime is defined else e['datetime']) %}
            {% if ts is number and now_ts <= ts <= ahead %}
              {% set th = e.temperature if e.temperature is defined else e.get('temperature') %}
              {% if th is number %}
                {% set ns.vals = ns.vals + [ th | float ] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.vals | tojson }}
        outside_temp_forecast_24h_c: >-
          {% set vals = outside_vals | from_json(default=[]) if outside_vals is string else outside_vals %}
          {% if vals is iterable and vals | length > 0 %}
            {{ (vals | sum / (vals | length)) | round(2) }}
          {% else %}
            {{ states('sensor.outside_temperature') | float(8) }}
          {% endif %}
        delta_t_forecast_k: >-
          {% set outside_avg = outside_temp_forecast_24h_c | float(states('sensor.outside_temperature') | float(8)) %}
          {% set inside_avg = inside_target_mean_c | float(21) %}
          {{ (inside_avg - outside_avg) | round(2) }}
    - service: input_number.set_value
      data:
        entity_id: input_number.outside_temp_forecast_24h_c
        value: "{{ outside_temp_forecast_24h_c }}"
    - service: input_number.set_value
      data:
        entity_id: input_number.delta_t_forecast_k
        value: "{{ delta_t_forecast_k }}"
    - service: logbook.log
      data:
        name: "Forecast→Set"
        message: >-
          {% set vals = outside_vals | from_json(default=[]) if outside_vals is string else outside_vals %}
          hours={{ vals | length }},
          min={{ (vals | min | round(1)) if (vals | length > 0) else 'n/a' }},
          max={{ (vals | max | round(1)) if (vals | length > 0) else 'n/a' }},
          outside_avg={{ outside_temp_forecast_24h_c }},
          inside_target_avg={{ inside_target_mean_c }},
          dT={{ delta_t_forecast_k }}
        entity_id: weather.barsinghausen_hohenb
