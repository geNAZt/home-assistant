- alias: bad licht automatisch AN
  id: auto_light_bad_on
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.presence_bad
      not_from:
        - unavailable
        - unknown
      to: "on"
    - platform: numeric_state
      entity_id: sensor.lux_bad_daylight
      below: 60           # waterLowLux
      for: "00:00:05"
    - platform: state
      entity_id: input_boolean.auto_light_bad
      not_from:
        - unavailable
        - unknown
      to: "on"
    - platform: state
      entity_id: input_boolean.force_on_bad
      not_from:
        - unavailable
        - unknown
      to: "on"

  condition:
    # Licht nur einschalten, wenn es wirklich aus ist
    - condition: state
      entity_id: light.bad_lights
      state: "off"

    # Entweder ForceOn (Dauer-Ein) ist aktiv ODER normale Automatik-Bedingungen sind erfüllt
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.force_on_bad
          state: "on"
        - condition: and
          conditions:
            # Automatik muss an sein
            - condition: state
              entity_id: input_boolean.auto_light_bad
              state: "on"

            # Präsenz notwendig
            - condition: state
              entity_id: binary_sensor.presence_bad
              state: "on"

            # Lux muss UNTER effektivem waterLow Threshold sein (250 Lux wenn Cover Daylight Protection aktiv ist, sonst normal waterLow)
            - condition: template
              value_template: >-
                {% set base_water_low = 60 %}
                {% set prot_entities = states.input_boolean | selectattr('entity_id', 'search', 'cover_daylight_protection_.*' ~ 'bad') | selectattr('state', 'eq', 'on') | list %}
                {% set is_daylight_prot = prot_entities | length > 0 %}
                {% set effective_water_low = 250 if is_daylight_prot else base_water_low %}
                {{ (states('sensor.lux_bad_daylight') | float(0)) < effective_water_low }}

  action:
    - variables:
        saved_brightness: "{{ states('input_number.bad_brightness') | int(0) }}"
        brightness: >
          {{ 255 if saved_brightness == 0 else ([saved_brightness, 255] | min) }}
        color_temp: "{{ states('input_number.bad_color_temp') | int(2700) }}"
    - service: light.turn_on
      target:
        entity_id: light.bad_lights
      data:
        brightness: "{{ brightness }}"
        color_temp_kelvin: "{{ color_temp }}"