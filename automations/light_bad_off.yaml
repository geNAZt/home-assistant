- alias: bad licht automatisch AUS
  id: auto_light_bad_off
  mode: restart
  trigger:
    # Präsenz weg
    - platform: state
      entity_id: binary_sensor.presence_bad
      to: "off"
      id: presence_off
  
    # Zu hell geworden (reines Tageslicht reicht wieder aus)
    - platform: numeric_state
      entity_id: sensor.lux_bad_daylight
      above: 85       # waterHighLux
      for: "00:00:10"
      id: too_bright

    # Regelmäßige Prüfung, falls der Schwellenwert ohne Flankenübergang überschritten bleibt
    - platform: time_pattern
      minutes: "/2"
      id: too_bright
  
  condition:
    # Automatik muss an sein
    - condition: state
      entity_id: input_boolean.auto_light_bad
      state: "on"
  
    # ForceOn darf nicht aktiv sein
    - condition: state
      entity_id: input_boolean.force_on_bad
      state: "off"
  
  action:
    - choose:
        # Fall 1: Präsenz weg -> immer aus
        - conditions:
            - condition: trigger
              id: presence_off
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.bad_lights
  
        # Fall 2: Zu hell, aber nur wenn jemand da und Licht wirklich an
        - conditions:
            - condition: trigger
              id: too_bright
            - condition: state
              entity_id: binary_sensor.presence_bad
              state: "on"
            - condition: state
              entity_id: light.bad_lights
              state: "on"
            - condition: template
              value_template: >-
                {% set base_water_high = 85 %}
                {% set prot_entities = states.input_boolean | selectattr('entity_id', 'search', 'cover_daylight_protection_.*' ~ 'bad') | selectattr('state', 'eq', 'on') | list %}
                {% set is_daylight_prot = prot_entities | length > 0 %}
                {% set effective_water_high = 275 if is_daylight_prot else base_water_high %}
                {{ (states('sensor.lux_bad_daylight') | float(0)) >= effective_water_high }}
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.bad_lights