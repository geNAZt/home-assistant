- id: car_battery_charger_pgrid
  alias: Car Battery Charger PGrid Update
  description: Updates car charger pgrid value every 4 seconds based on PV excess power availability
  mode: restart
  trigger:
    - platform: time_pattern
      seconds: "/4" # go-e PV watchdog is 5-10s; /4s halves load while staying safely within timeout
  condition:
    - condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.goe_288025_car_0
          state: "on"
        - condition: state
          entity_id: select.goe_288025_frc
          state: "0"
        - condition: template
          value_template: >-
            {% set ext_soc = state_attr('sensor.car_charger_total_energy', 'extrapolated_battery') %}
            {% set soc = (ext_soc | float(0)) if (ext_soc is not none and ext_soc | is_number) else (states('sensor.fiat_hexe_hvbattery_charge') | float(0)) %}
            {{ soc < 100 and (states('sensor.pv_m1_ac_power') | is_number) }}
        - condition: or
          conditions:
            - condition: state
              entity_id: sun.sun
              state: "above_horizon"
            - condition: state
              entity_id: binary_sensor.car_charge_from_pv_battery_allowed
              state: "on"
  variables:
    # Current state (will be negative for import, positive for export)
    exported_power: "{{ states('sensor.pv_m1_ac_power') | float(0) }}"
    battery_export_power: "{{ states('sensor.pv_battery1_power') | float(0) }}"
    car_charge_from_pv_battery_allowed: "{{ is_state('binary_sensor.car_charge_from_pv_battery_allowed', 'on') }}"
    car_charge_power: "{{ states('sensor.goe_288025_nrg_11') | float(0) }}"

    # Calculate pgrid value
    pgrid_value: >-
      {% set exp = (exported_power | float(0)) %}
      {% if not car_charge_from_pv_battery_allowed %}
        {# Only use discharge power (negative values) for battery when discharging is not allowed to count it as import #}
        {% if battery_export_power < 0 %}
          {% set exp = exp + battery_export_power %}
        {% endif %}

        {% if exp < 100 %}
          15000
        {% else %}
          {{ exp * -1 }}
        {% endif %}
      {% else %}
        {# When discharging the battery to charge the car is allowed #}
        {% set surplus = exported_power + battery_export_power + 5000 %}
        {{ (surplus * -1) | round(0) }}
      {% endif %}
  action:
    - service: goecharger_api2.set_pv_data
      data:
        pgrid: "{{ pgrid_value }}"
