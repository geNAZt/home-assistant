- id: car_battery_charger_pgrid
  alias: Car Battery Charger PGrid Update
  description: Updates car charger pgrid value every 2 seconds based on PV excess power availability
  mode: restart
  trigger:
    - platform: time_pattern
      seconds: "/2" # The charger forgets after 5 seconds
  condition:
    - condition: and
      conditions:
        - condition: template
          value_template: "{{ states('binary_sensor.goe_288025_car_0') == 'on' }}"
        - condition: template
          value_template: "{{ states('sensor.fiat_hexe_hvbattery_charge') | float(0) < 100 }}"
  variables:
    # Current state (will be negative for import, positive for export)
    exported_power: "{{ states('sensor.pv_m1_ac_power') | float(0) }}"
    battery_export_power: "{{ states('sensor.pv_battery1_power') | float(0) }}"
    car_charge_from_pv_battery_allowed: "{{ is_state('binary_sensor.car_charge_from_pv_battery_allowed', 'on') }}"
    car_charge_power: "{{ states('sensor.goe_288025_nrg_11') | float(0) }}"

    # Calculate pgrid value
    pgrid_value: >-
      {% set exp = (exported_power | float(0)) %}
      {% if not car_charge_from_pv_battery_allowed %}
        {# Only use discharge power (negative values) for battery when discharging is not allowed to count it as import #}
        {% if battery_export_power < 0 %}
          {% set exp = exp + battery_export_power %}
        {% endif %}

        {% if exp < 100 %}
          15000
        {% else %}
          {{ exp * -1 }}
        {% endif %}
      {% else %}
        {# When discharging the battery to charge the car is allowed #}
        {% if exported_power > 0 %}
          {# PV surplus is available, add 5000W to the PV surplus #}
          {% set surplus = exported_power + 5000 %}
        {% else %}
          {# ONLY the battery is over the threshold and NO PV surplus is available #}
          {% set house_usage = (states('sensor.solar_house_consumption_w') | float(0)) - car_charge_power %}
          {% set surplus = 5000 - house_usage %}
        {% endif %}

        {# The charger expects a positive value for import, negative for export #}
        {{ surplus * -1 }}
      {% endif %}
  action:
    - service: goecharger_api2.set_pv_data
      data:
        pgrid: "{{ pgrid_value }}"
