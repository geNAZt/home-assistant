- id: water_heater_pv_switch
  alias: Water Heater PV Switch Control
  description: >-
    Controls aroSTOR VWL BM 270/5 water heater using weather forecast, PV compressor-hour forecast,
    and Octopus Go tariff pricing to guarantee 60°C hot water for a bath + shower by 18:00
    at minimum energy cost.
  mode: restart
  trigger:
    - platform: time_pattern
      minutes: "/5"
  variables:
    # Current PV & battery balance
    exported_power: "{{ states('sensor.filtered_exported_power_w') | float(0) }}"
    imported_power: "{{ states('sensor.filtered_imported_power_w') | float(0) }}"
    battery_import_power: "{{ states('sensor.pv_battery1_power') | float(0) }}"
    battery_soc: "{{ states('sensor.pv_battery1_state_of_charge') | float(0) }}"
    battery_capacity_kwh: "{{ (states('sensor.pv_battery1_size_max') | float(0)) / 1000.0 }}"
    battery_available_kwh: "{{ [battery_capacity_kwh * ([battery_soc - 15.0, 0] | max) / 100.0, 0] | max }}"
    battery_discharge_w: "{{ [(-1 * battery_import_power), 0] | max }}"
    stage2_import_equivalent_w: "{{ (imported_power | float(0)) + (battery_discharge_w | float(0)) }}"

    # Weather & Tariff Pricing (Octopus Go / dynamic provider)
    outside_temp_c: "{{ states('sensor.outside_temperature') | float(12) }}"
    outside_forecast_24h_c: "{{ states('input_number.outside_temp_forecast_24h_c') | float(outside_temp_c) }}"
    price_now: "{{ states('sensor.power_price') | float(0.2820) }}"
    price_nt: "{{ states('sensor.power_price_nt') | float(0.1821) }}"
    price_ht: "{{ states('sensor.power_price_ht') | float(0.2820) }}"
    # Standby heat loss of the 265L tank between 05:00 (end of NT) and 18:00 (13h @ ~35W thermal / COP ~3.2 ≈ 1.04x)
    # Plus any daytime COP advantage if outside/ambient air is significantly warmer during the day (~1% per K)
    temp_swing_cop_factor: "{{ 1.0 + ([outside_forecast_24h_c - outside_temp_c, 0] | max * 0.01) }}"
    nt_storage_loss_factor: "{{ 1.04 * temp_swing_cop_factor }}"
    # Using Octopus Go NT (0.1821 €/kWh) is cheaper than daytime HT (0.2820 €/kWh) whenever HT > NT * loss_factor (~0.19 €/kWh)
    nt_cheaper_than_ht: "{{ (price_nt * nt_storage_loss_factor) < price_ht }}"
    is_cheap_tariff_now: "{{ price_now <= (price_nt * 1.05) }}"

    # Forecast budget (priority model + weather-adjusted Stage 1 target)
    stage1_target_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'water_stage1_target_kwh') | float(4.3) }}"
    stage1_done_today_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'water_stage1_done_today_kwh') | float(0) }}"
    stage1_remaining_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'water_stage1_remaining_kwh') | float(0) }}"
    stage1_forecast_alloc_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'allocated_to_water_stage1_kwh') | float(0) }}"
    pv_until_18h_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'pv_until_18h_kwh') | float(0) }}"
    pv_surplus_until_18h_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'pv_surplus_until_18h_kwh') | float(0) }}"
    pv_compressor_hours_until_18h: "{{ state_attr('sensor.pv_priority_next_day_budget', 'pv_compressor_hours_until_18h') | float(0) }}"
    heating_uncovered_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'heating_uncovered_kwh') | float(0) }}"
    remaining_after_heating_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'remaining_after_heating_kwh') | float(0) }}"
    battery_needed_before_stage2_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'battery_needed_before_stage2_kwh') | float(0) }}"
    allocated_to_battery_before_stage2_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'allocated_to_battery_before_stage2_kwh') | float(0) }}"
    remaining_after_battery_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'remaining_after_battery_kwh') | float(0) }}"

    # Current switch states
    stage_1_state: "{{ is_state('switch.water_heater_pv_switch_powerr_usage_stage_1', 'on') }}"
    stage_2_state: "{{ is_state('switch.water_heater_pv_switch_powerr_usage_stage_2', 'on') }}"
    stage2_whitelist_active: "{{ is_state('input_boolean.water_heater_stage2_whitelist', 'on') }}"

    # Priority & Tariff Windows
    battery_min_soc: 15
    battery_stage2_soc: 90
    is_nt_window: >-
      {% set nowts = as_timestamp(now()) %}
      {% set t0 = as_timestamp(now().replace(hour=0, minute=0, second=0, microsecond=0)) %}
      {% set t1 = as_timestamp(now().replace(hour=5, minute=0, second=0, microsecond=0)) %}
      {{ (t0 <= nowts < t1) or is_cheap_tariff_now }}

    # Measured aroSTOR VWL BM 270/5 compressor power is ~0.38 kW average (ramps from 250W cold to 480W @ 60°C).
    # Because the compressor is rate-limited to ~0.38 kW, a full 4.3 kWh cycle takes ~11.3 hours!
    # In autumn/winter, sunny hours (e.g. 6.5h between 10:30 and 17:00) can only deliver 6.5h * 0.38 kW ≈ 2.47 kWh,
    # even if total PV surplus kWh is 20 kWh.
    bath_guarantee_pump_kw: 0.38
    pv_deliverable_stage1_until_18h_kwh: >-
      {{ [pv_surplus_until_18h_kwh, pv_compressor_hours_until_18h * bath_guarantee_pump_kw] | min }}

    # 1. Night Tariff (Octopus Go 00:00–05:00 @ 18.21 ct/kWh) Smart Pre-Heating:
    # Check if deliverable PV compressor energy before 18:00 can cover the weather-adjusted target.
    # Any deficit that cannot physically be pushed into the tank during sunny hours before 18:00
    # is pre-heated during the cheap 00:00–05:00 Octopus Go window!
    pv_deficit_until_18h_kwh: "{{ [stage1_remaining_kwh - pv_deliverable_stage1_until_18h_kwh, 0] | max }}"
    nt_stage1_fallback_needed: >-
      {{
        is_nt_window
        and (not stage2_whitelist_active)
        and nt_cheaper_than_ht
        and (stage1_remaining_kwh > 0.05)
        and (pv_deficit_until_18h_kwh > 0.10 or stage1_forecast_alloc_kwh < stage1_remaining_kwh)
      }}

    # 2. Daytime / Afternoon 18:00 Bath & Shower Guarantee (265L @ 60°C -> ~362L @ 45°C mixed):
    # Calculate exact hours needed at 0.38 kW average compressor draw (+ 0.5h buffer) to finish before 18:00.
    # Starts as early as 07:00 if night pre-heat was skipped or tank has a large deficit, and runs until 18:00
    # (or slightly past 18:00 if still finishing up) until the compressor shuts off (<50W -> stage2_whitelist_active).
    hours_until_18: >-
      {% set nowts = as_timestamp(now()) %}
      {% set t18 = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
      {{ [(t18 - nowts) / 3600.0, 0] | max }}
    bath_guarantee_hours_needed: >-
      {% set needed_kwh = [stage1_remaining_kwh, 0.75] | max %}
      {{ (needed_kwh / bath_guarantee_pump_kw) + 0.5 }}
    is_bath_guarantee_window: >-
      {% set h = now().hour + (now().minute / 60.0) %}
      {{
        (07.0 <= h < 18.0 and (hours_until_18 <= bath_guarantee_hours_needed or h >= 15.0))
        or (18.0 <= h < 19.5 and stage_1_state and stage1_remaining_kwh > 0.05)
      }}
    bath_guarantee_stage1_needed: >-
      {{ is_bath_guarantee_window and (not stage2_whitelist_active) and (not stage_2_state) }}

    # 3. Daytime PV / Battery Assisted Stage 1:
    # When sunny or mild, allow Stage 1 to run smoothly through brief cloud transients if battery has buffer
    # and PV forecast until 18:00 covers the remaining need.
    pv_assisted_stage1_allowed: >-
      {{
        stage_1_state
        and battery_soc >= 40
        and pv_deliverable_stage1_until_18h_kwh >= stage1_remaining_kwh
        and imported_power <= 100
        and battery_import_power >= -600
      }}

    stage1_needed: "{{ (not stage2_whitelist_active) and (stage1_remaining_kwh > 0.05 or exported_power > 450 or bath_guarantee_stage1_needed) }}"
    heating_priority_open: "{{ heating_uncovered_kwh > 0.10 }}"
    battery_above_min: "{{ battery_soc >= battery_min_soc }}"
    battery_ready_for_stage2: "{{ battery_soc >= battery_stage2_soc }}"
    stage2_allowed_by_forecast: "{{ (remaining_after_battery_kwh > 0.20) and ((not stage1_needed) or stage2_whitelist_active) and (not heating_priority_open) }}"
    level_up_possible: "{{ (exported_power >= 1600) or (stage_1_state and exported_power >= 1200) }}"
    force_all_off: >-
      {{
        (not nt_stage1_fallback_needed)
        and (not bath_guarantee_stage1_needed)
        and (not pv_assisted_stage1_allowed)
        and (
          imported_power > 100
          or battery_import_power < -300
          or (not battery_above_min and not battery_ready_for_stage2)
        )
      }}

    # Determine which stage should be active
    battery_ready_stage1: "{{ battery_above_min }}"
    stage1_candidate: >-
      {{
        nt_stage1_fallback_needed
        or bath_guarantee_stage1_needed
        or (
          stage1_needed
          and stage1_forecast_alloc_kwh > 0
          and battery_ready_stage1
          and (stage_1_state or exported_power >= 450)
        )
      }}
    stage2_candidate: >-
      {{
        stage2_allowed_by_forecast
        and (stage2_import_equivalent_w | float(0) < 100)
        and (
          stage_2_state
          or (
            battery_ready_for_stage2
            and level_up_possible
          )
        )
      }}
    should_stage_1: >-
      {{
        (not force_all_off)
        and (not stage2_candidate)
        and stage1_candidate
      }}
    should_stage_2: >-
      {{
        (not force_all_off)
        and stage2_candidate
      }}
    should_all_off: >-
      {{
        force_all_off
        or (not should_stage_1 and not should_stage_2)
      }}

  condition:
    - condition: state
      entity_id: binary_sensor.vacation_mode_water_heater
      state: "off"
  action:
    - choose:
        # All off has highest priority
        - conditions:
            - condition: template
              value_template: "{{ should_all_off }}"
          sequence:
            - if:
                - condition: or
                  conditions:
                    - condition: template
                      value_template: "{{ stage_1_state }}"
                    - condition: template
                      value_template: "{{ stage_2_state }}"
              then:
                - service: switch.turn_off
                  target:
                    entity_id:
                      - switch.water_heater_pv_switch_powerr_usage_stage_1
                      - switch.water_heater_pv_switch_powerr_usage_stage_2
                - service: logbook.log
                  data:
                    name: Water Heater PV Switch
                    message: >-
                      All OFF:
                      export={{ exported_power | round(0) }}W,
                      stage1_rem={{ stage1_remaining_kwh | round(2) }}/{{ stage1_target_kwh | round(2) }}kWh,
                      pv_deliv_18h={{ pv_deliverable_stage1_until_18h_kwh | round(2) }}kWh ({{ pv_compressor_hours_until_18h | round(1) }}h),
                      whitelist={{ stage2_whitelist_active }},
                      price={{ price_now | round(4) }}€/kWh,
                      heating_uncovered={{ heating_uncovered_kwh | round(2) }}kWh
        # Stage 2: >= 1600W - Turn on stage 2, turn off stage 1
        - conditions:
            - condition: template
              value_template: "{{ should_stage_2 }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ not stage_2_state }}"
              then:
                - service: switch.turn_on
                  target:
                    entity_id: switch.water_heater_pv_switch_powerr_usage_stage_2
                - service: logbook.log
                  data:
                    name: Water Heater PV Switch
                    message: >-
                      Stage 2 ON (PV surplus):
                      export={{ exported_power | round(0) }}W,
                      leftover_after_battery={{ remaining_after_battery_kwh | round(2) }}kWh,
                      battery_soc={{ battery_soc | round(1) }}%,
                      whitelist={{ stage2_whitelist_active }},
                      stage2_import_equiv={{ stage2_import_equivalent_w | round(0) }}W
            - if:
                - condition: template
                  value_template: "{{ stage_1_state }}"
              then:
                - service: switch.turn_off
                  target:
                    entity_id: switch.water_heater_pv_switch_powerr_usage_stage_1
        # Stage 1: >= 450W PV or NT pre-heat or 18:00 bath guarantee - Turn on stage 1, turn off stage 2
        - conditions:
            - condition: template
              value_template: "{{ should_stage_1 }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ not stage_1_state }}"
              then:
                - service: switch.turn_on
                  target:
                    entity_id: switch.water_heater_pv_switch_powerr_usage_stage_1
                - service: logbook.log
                  data:
                    name: Water Heater PV Switch
                    message: >-
                      Stage 1 ON:
                      today={{ stage1_done_today_kwh | round(2) }}/{{ stage1_target_kwh | round(2) }}kWh,
                      rem={{ stage1_remaining_kwh | round(2) }}kWh,
                      pv_deliv_18h={{ pv_deliverable_stage1_until_18h_kwh | round(2) }}kWh ({{ pv_compressor_hours_until_18h | round(1) }}h),
                      export={{ exported_power | round(0) }}W,
                      battery_soc={{ battery_soc | round(1) }}%,
                      price={{ price_now | round(4) }}€/kWh,
                      nt_fallback={{ nt_stage1_fallback_needed }},
                      bath_guarantee={{ bath_guarantee_stage1_needed }}
            - if:
                - condition: template
                  value_template: "{{ stage_2_state }}"
              then:
                - service: switch.turn_off
                  target:
                    entity_id: switch.water_heater_pv_switch_powerr_usage_stage_2
      default: []
