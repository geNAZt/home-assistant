    - trigger: state
      entity_id: cover.rollade_bad
    - trigger: state
      entity_id: cover.rollade_schlafzimmer
    - trigger: state
      entity_id: cover.rollade_buero_merja
    - trigger: state
      entity_id: input_datetime.cover_manual_change_rollade_buero_fabian
    - trigger: state
      entity_id: input_datetime.cover_manual_change_rollade_wohnzimmer_links
    - trigger: state
      entity_id: input_datetime.cover_manual_change_rollade_wohnzimmer_rechts
    - trigger: state
      entity_id: input_datetime.cover_manual_change_rollade_kueche_rechts
    - trigger: state
      entity_id: input_datetime.cover_manual_change_rollade_kueche_links
    - trigger: state
      entity_id: input_datetime.cover_manual_change_rollade_speisekammer
    - trigger: state
      entity_id: input_datetime.cover_manual_change_rollade_hwr
    - trigger: state
      entity_id: input_datetime.cover_manual_change_rollade_bad
    - trigger: state
      entity_id: input_datetime.cover_manual_change_rollade_schlafzimmer
    - trigger: state
      entity_id: input_datetime.cover_manual_change_rollade_buero_merja
    - trigger: time_pattern
      minutes: "/10"
    - trigger: time
      at: "00:00:05"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: "{{ states('input_select.cover_mode') != 'Manual' }}"
  actions:
    - variables:
        cover_mapping:
          cover.rollade_buero_fabian:
            room: buero_fabian
            gain_sensor: rollade_buero_fabian
            watt_limit: 192.0
            light_power_w: 75.6
            water_low_lux: 75
          cover.rollade_wohnzimmer_links:
            room: wohnzimmer
            gain_sensor: rollade_wohnzimmer_links
            watt_limit: 332.64
            light_power_w: 216.0
            water_low_lux: 140
          cover.rollade_wohnzimmer_rechts:
            room: wohnzimmer
            gain_sensor: rollade_wohnzimmer_rechts
            watt_limit: 332.64
            light_power_w: 216.0
            water_low_lux: 140
          cover.rollade_kueche_rechts:
            room: kueche
            gain_sensor: rollade_kueche_rechts
            watt_limit: 349.2
            light_power_w: 351.0
            water_low_lux: 800
          cover.rollade_kueche_links:
            room: kueche
            gain_sensor: rollade_kueche_links
            watt_limit: 386.23
            light_power_w: 351.0
            water_low_lux: 800
          cover.rollade_speisekammer:
            room: speisekammer
            gain_sensor: rollade_speisekammer
            watt_limit: 28.8
            light_power_w: 162.0
            water_low_lux: 140
          cover.rollade_hwr:
            room: flur
            gain_sensor: rollade_hwr
            watt_limit: 28.8
            light_power_w: 0.0
            water_low_lux: 140
          cover.rollade_bad:
            room: bad
            gain_sensor: rollade_bad
            watt_limit: 109.22
            light_power_w: 27.0
            water_low_lux: 800
          cover.rollade_schlafzimmer:
            room: schlafzimmer
            gain_sensor: rollade_schlafzimmer
            watt_limit: 184.8
            light_power_w: 178.2
            water_low_lux: 140
          cover.rollade_buero_merja:
            room: buero_merja
            gain_sensor: rollade_buero_merja
            watt_limit: 386.23
            light_power_w: 270.0
            water_low_lux: 140
        cover_evaluations: >-
          {% set cover_mode = states('input_select.cover_mode') %}
          {% set is_night = is_state('input_boolean.cover_night_mode', 'on') %}
          {% set exempt_text = states('input_text.exempt_covers') | default('') %}
          {% set overheating_thresh_state = states('input_number.cover_overheating_threshold') %}
          {% set overheating_thresh = overheating_thresh_state | float(2.0) if (overheating_thresh_state not in ['unknown', 'unavailable', 'None', ''] and overheating_thresh_state is not none) else 2.0 %}
          {% set solar_rad_state = states('input_number.solar_irradiance') %}
          {% set solar_rad = solar_rad_state | float(0) if (solar_rad_state not in ['unknown', 'unavailable', 'None', ''] and solar_rad_state is not none) else 0 %}
          
          {% set ns = namespace(evals=[]) %}
          {% set now_ts = as_timestamp(now()) %}

          {% set global_dt_state = states('input_datetime.cover_last_global_move') %}
          {% set last_global_ts = as_timestamp(global_dt_state) if (global_dt_state not in ['unknown', 'unavailable', 'None', ''] and global_dt_state is not none) else 0 %}
          {% set last_global_ts = 0 if last_global_ts is none else last_global_ts | float(0) %}
          {% set global_elapsed = (now_ts - last_global_ts) | int %}
          {% set global_cooldown_active = global_elapsed < 1800 %}

          {% for cov, data in cover_mapping.items() %}
            {% set r = data.room %}
            {% set gain_suffix = data.gain_sensor %}
            {% set cov_suffix = cov.split('.')[1] %}
            {% set limit_w = data.watt_limit | default(120) | float %}
            {% set max_light_power = data.light_power_w | default(100.0) | float %}
            {% set raw_water_low = data.water_low_lux | default(140) | float %}
            {% set target_lux = [raw_water_low, 250.0] | min %}

            {# Check minimum open position #}
            {% set min_open_state = states('input_number.cover_min_open_' ~ cov_suffix) %}
            {% set min_open = min_open_state | int(0) if (min_open_state not in ['unknown', 'unavailable', 'None', ''] and min_open_state is not none) else 0 %}

            {# Check runtime exemption #}
            {% set is_exempt_text = cov in exempt_text or cov_suffix in exempt_text %}
            {% set is_exempt_bool = is_state('input_boolean.auto_cover_' ~ cov_suffix, 'off') %}
            {% set is_exempt = is_exempt_text or is_exempt_bool %}

            {% set exempt_reason = "None" %}
            {% if is_exempt_text and is_exempt_bool %}
              {% set exempt_reason = "Exempt via input_text and input_boolean.auto_cover" %}
            {% elif is_exempt_text %}
              {% set exempt_reason = "Exempt via input_text.exempt_covers" %}
            {% elif is_exempt_bool %}
              {% set exempt_reason = "Exempt via input_boolean.auto_cover_" ~ cov_suffix ~ " = off" %}
            {% endif %}

            {% set cur_pos = state_attr(cov, 'current_position') %}
            {% set cur_pos = (0 if is_state(cov, 'closed') else 100) if cur_pos is none or cur_pos == '' else cur_pos | int %}

            {% set manual_dt_state = states('input_datetime.cover_manual_change_' ~ cov_suffix) %}
            {% set last_manual_ts = as_timestamp(manual_dt_state) if (manual_dt_state not in ['unknown', 'unavailable', 'None', ''] and manual_dt_state is not none) else 0 %}
            {% set last_manual_ts = 0 if last_manual_ts is none else last_manual_ts | float(0) %}
            {% set manual_elapsed = (now_ts - last_manual_ts) | int %}
            {% set manual_cooldown_active = manual_elapsed < 3600 %}

            {% set gain_state = states('sensor.solar_expected_gain_' ~ gain_suffix) %}
            {% set cur_temp_state = states('sensor.temperature_' ~ r ~ '_mean') %}
            {% set tgt_temp_state = states('input_number.heating_base_' ~ r) %}
            {% set p_exp = gain_state | float(0) if (gain_state not in ['unknown', 'unavailable', 'None', ''] and gain_state is not none) else 0 %}

            {% set delta_t = 0.0 %}
            {% if cur_temp_state not in ['unknown', 'unavailable', 'None', ''] and tgt_temp_state not in ['unknown', 'unavailable', 'None', ''] and cur_temp_state is not none and tgt_temp_state is not none %}
              {% set delta_t = ((cur_temp_state | float) - (tgt_temp_state | float)) | round(2) %}
            {% endif %}

            {# Calculate Daylight Floor and Dynamic Light Heat Load #}
            {% set saved_bright_state = states('input_number.' ~ r ~ '_brightness') %}
            {% set saved_bright = saved_bright_state | int(0) if (saved_bright_state not in ['unknown', 'unavailable', 'None', ''] and saved_bright_state is not none) else 0 %}
            {% set actual_bright = 255 if saved_bright == 0 else ([saved_bright, 255] | min) %}
            {% set active_light_power = max_light_power * (actual_bright / 255.0) %}

            {% set cur_lux_state = states('sensor.lux_' ~ r) %}
            {% set cur_lux = cur_lux_state | float(0) if (cur_lux_state not in ['unknown', 'unavailable', 'None', ''] and cur_lux_state is not none) else 0 %}
            {% set cur_pos_clamp = [cur_pos, 10] | max %}
            {% set est_lux_100 = (cur_lux * 100.0 / cur_pos_clamp) if cur_pos > 5 else cur_lux %}

            {% if est_lux_100 > (target_lux + 20.0) %}
              {% set daylight_min_pos = (((target_lux + 20.0) * 100.0) / est_lux_100) | round(0) | int %}
              {% set daylight_min_pos = [ [daylight_min_pos, 100] | min, 20 ] | max %}
            {% else %}
              {% set daylight_min_pos = 20 %}
            {% endif %}

            {# Calculate target position and reason #}
            {% if is_night %}
              {% set target_pos = 0 %}
              {% set calc_reason = "Night mode active (sunset + 30m reached)" %}
            {% elif is_exempt %}
              {% set target_pos = cur_pos %}
              {% set calc_reason = "Exempt cover (" ~ exempt_reason ~ ")" %}
            {% elif cover_mode == 'Manual (sunset)' %}
              {% set target_pos = cur_pos %}
              {% set calc_reason = "Manual (sunset) mode active during daytime" %}
            {% elif manual_cooldown_active %}
              {% set target_pos = cur_pos %}
              {% set calc_reason = "Manual override cooldown active (" ~ manual_elapsed ~ "s < 3600s 1h manual cooldown)" %}
            {% else %}
              {% set hysteresis_clear = overheating_thresh - 0.5 %}
              {% set is_overheating = (delta_t >= overheating_thresh) or (cur_pos < 100 and delta_t >= hysteresis_clear) %}
              
              {% if is_overheating and solar_rad >= 200.0 %}
                {% if p_exp <= limit_w %}
                  {% set raw_target_pos = 100 %}
                  {% set calc_reason = "Overheating (delta_t " ~ delta_t ~ "°C >= " ~ overheating_thresh ~ "°C), expected gain " ~ p_exp ~ "W <= " ~ limit_w ~ "W -> open 100%" %}
                {% else %}
                  {% set raw_target_pos = [ [ ((limit_w / p_exp) * 100) | round(0) | int, 100 ] | min, 0 ] | max %}
                  {% set calc_reason = "Overheating (delta_t " ~ delta_t ~ "°C >= " ~ overheating_thresh ~ "°C), expected gain " ~ p_exp ~ "W > " ~ limit_w ~ "W -> target " ~ raw_target_pos ~ "% (limit to " ~ limit_w ~ "W)" %}
                {% endif %}
              {% else %}
                {% set raw_target_pos = 100 %}
                {% if solar_rad < 200.0 %}
                  {% set calc_reason = "Low solar irradiance (" ~ solar_rad ~ " W/m² < 200 W/m²) -> default open 100%" %}
                {% else %}
                  {% set calc_reason = "Normal temperature (delta_t " ~ delta_t ~ "°C < " ~ hysteresis_clear ~ "°C) -> default open 100%" %}
                {% endif %}
              {% endif %}

              {# Daylight & Light Heat-Balance Check #}
              {% set solar_gain_at_raw = p_exp * (raw_target_pos / 100.0) %}
              {% set solar_gain_at_daylight = p_exp * (daylight_min_pos / 100.0) %}
              {% set solar_heat_saved = solar_gain_at_daylight - solar_gain_at_raw %}

              {% if raw_target_pos < daylight_min_pos and active_light_power > solar_heat_saved %}
                {% set target_pos_before_min = daylight_min_pos %}
                {% set calc_reason = calc_reason ~ " -> clamped to daylight floor " ~ daylight_min_pos ~ "% (active LED heat " ~ (active_light_power | round(1)) ~ "W @ " ~ ((actual_bright * 100 // 255) | int) ~ "% brightness > solar heat saved " ~ (solar_heat_saved | round(1)) ~ "W)" %}
              {% else %}
                {% set target_pos_before_min = raw_target_pos %}
              {% endif %}

              {% if min_open > 0 and target_pos_before_min < min_open %}
                {% set target_pos = min_open %}
                {% set calc_reason = calc_reason ~ " -> enforced minimum open position " ~ min_open ~ "%" %}
              {% else %}
                {% set target_pos = target_pos_before_min %}
              {% endif %}
            {% endif %}

            {% set pos_diff = (target_pos - cur_pos) | abs %}

            {# Status & Summary Determination #}
            {% if is_exempt and not is_night %}
              {% set status = "SKIPPED_EXEMPT" %}
              {% set summary = "Skipped: " ~ exempt_reason %}
            {% elif cover_mode == 'Manual (sunset)' and not is_night %}
              {% set status = "SKIPPED_MANUAL_SUNSET" %}
              {% set summary = "Skipped: Manual (sunset) mode active during daytime" %}
            {% elif manual_cooldown_active and not is_night %}
              {% set status = "SKIPPED_MANUAL_COOLDOWN" %}
              {% set summary = "Skipped: Manual override cooldown active (" ~ manual_elapsed ~ "s < 3600s 1h manual cooldown)" %}
            {% elif pos_diff <= 5 %}
              {% set status = "SKIPPED_DIFF_TOO_SMALL" if cur_pos != target_pos else "SKIPPED_ALREADY_AT_TARGET" %}
              {% set summary = "Skipped: Position difference (" ~ pos_diff ~ "%) <= 5% (Current: " ~ cur_pos ~ "%, Target: " ~ target_pos ~ "%). Reason: " ~ calc_reason if cur_pos != target_pos else "Skipped: Already at target position (" ~ cur_pos ~ "%). Reason: " ~ calc_reason %}
            {% elif global_cooldown_active and not (is_night and cur_pos != 0) %}
              {% set status = "SKIPPED_GLOBAL_COOLDOWN" %}
              {% set summary = "Skipped: Global cooldown active (" ~ global_elapsed ~ "s < 1800s 30m global cooldown). Target: " ~ target_pos ~ "%, Current: " ~ cur_pos ~ "%" %}
            {% else %}
              {% set status = "UPDATING_POSITION" %}
              {% set summary = "Updating position from " ~ cur_pos ~ "% to " ~ target_pos ~ "%. Reason: " ~ calc_reason %}
            {% endif %}

            {% set item = {
              'entity_id': cov,
              'target_position': target_pos,
              'current_position': cur_pos,
              'status': status,
              'summary': summary,
              'should_update': (status == 'UPDATING_POSITION')
            } %}
            {% set ns.evals = ns.evals + [item] %}
          {% endfor %}
          {{ ns.evals }}
        cover_updates: >-
          {{ cover_evaluations | selectattr('should_update', 'eq', true) | list }}
    - repeat:
        for_each: "{{ cover_evaluations }}"
        sequence:
          - action: system_log.write
            data:
              logger: automatic_cover_control
              level: info
              message: "[Cover Auto Log] {{ repeat.item.entity_id }}: {{ repeat.item.summary }}"
    - choose:
        - conditions: "{{ cover_updates | length > 0 }}"
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.cover_last_global_move
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            - repeat:
                for_each: "{{ cover_updates }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: "{{ repeat.item.entity_id }}"
                    data:
                      position: "{{ repeat.item.target_position }}"