- id: 'light_on_when_unlocked'
  alias: Light on when door unlocks
  mode: single
  triggers:
  - trigger: state
    entity_id:
    - lock.home
    to: unlocked
  conditions:
  - or:
    - condition: state
      entity_id: binary_sensor.vacation_mode
      state: "on"
    - condition: time
      after: "10:00:10"
      before: "21:59:50"
  actions:
  - action: light.turn_on
    metadata: {}
    data: {}
    target:
      entity_id:
      - light.bad_lights
      - light.buero_fabian_lights
      - light.buero_merja_lights
      - light.flur_lights
      - light.kueche_lights
      - light.schlafzimmer_lights
      - light.speisekammer_lights
      - light.wohnzimmer_lights
