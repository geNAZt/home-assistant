- id: heating_plan_every_5min
  alias: "Heizung: Planung alle 5 Minuten (PV/Preheat/Phasen)"
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/5"
    - platform: time
      at: "00:00:00"
  variables:
    # ===================================================================
    # SECTION 1: CONFIGURATION & GLOBAL PARAMETERS
    # ===================================================================
    rooms_json: '["bad","kueche","schlafzimmer","flur","speisekammer","wohnzimmer","buero_merja","buero_fabian"]'
    phase_max_amps: 16.0
    hysteresis_k: 0.05
    stop_margin_k: 0.1 # früher ausmachen, um Overshoot zu reduzieren

    # --- SOAK CHARGING (Laminat-Schutz) ---
    # Verhindert Hitzestau unter dem Belag. Erzwingt Pausen, damit Wärme
    # in den Estrich ziehen kann (Pulsing).
    soak_delta_stop: 4.0 # STOPP, wenn Boden > 4.0K wärmer als Luft
    soak_delta_start: 3.0 # START erlaubt, wenn Delta < 3.0K gesunken ist

    # PV and preheat parameters (with SoC hysteresis + smooth SoC-scaled battery support to prevent 15% sawtooth & HT grid spikes)
    pv_forecast_w: "{{ states('sensor.filtered_exported_power_w') | float(0) }}"
    pv_generation_w: "{{ states('sensor.solar_panel_production_w') | float(0) }}"
    battery_soc: "{{ states('sensor.pv_battery1_state_of_charge') | float(0) }}"
    battery_min_soc: 15
    battery_resume_soc: 18
    battery_support_until_hour: 18
    battery_support_from_hour: 6
    any_room_heating_now: >-
      {% set rooms = rooms_json | from_json(default=[]) if rooms_json is string else rooms_json %}
      {% set ns = namespace(active=false) %}
      {% for r in rooms %}
        {% if is_state('climate.climate_room_' ~ r, 'heat') %}
          {% set ns.active = true %}
        {% endif %}
      {% endfor %}
      {{ ns.active }}
    battery_above_min: >-
      {% set soc = battery_soc | float(0) %}
      {% if any_room_heating_now %}
        {{ soc >= (battery_min_soc | float(15)) }}
      {% else %}
        {{ soc >= (battery_resume_soc | float(18)) }}
      {% endif %}
    battery_support_allowed_now: "{{ now().hour < (battery_support_until_hour | int(18)) and now().hour >= (battery_support_from_hour | int(6)) }}"
    # Smoothly ramp battery discharge support from 0 W at 15% SoC up to 4500 W at >=30% SoC
    # (prevents slamming 5-6 kW onto an almost-empty battery whose BMS tapers discharge near 15%, avoiding 3-5 kW HT grid spikes)
    battery_support_w: >-
      {% set soc = battery_soc | float(0) %}
      {% set min_s = battery_min_soc | float(15) %}
      {% if battery_above_min and battery_support_allowed_now and soc > min_s %}
        {% set ramp_w = ((soc - min_s) / 15.0) * 4500.0 %}
        {{ [[ramp_w | round(0), 0] | max, 4500] | min }}
      {% else %}
        0
      {% endif %}
    pv_thr_w: "{{ states('input_number.pv_excess_threshold_w') | float(0) }}"
    water_stage1_remaining_kwh: "{{ state_attr('sensor.pv_priority_next_day_budget', 'water_stage1_remaining_kwh') | float(0) }}"
    water_stage1_target_kwh: >-
      {% if is_state('input_boolean.water_heater_stage2_whitelist', 'on') %}
        0.0
      {% else %}
        {{ state_attr('sensor.pv_priority_next_day_budget', 'water_stage1_target_kwh') | float(water_stage1_remaining_kwh | float(0)) }}
      {% endif %}
    water_pump_running_w: "{{ states('sensor.water_heating_pump_power') | float(0) }}"
    water_stage1_reserve_w: "{{ 450 if ((water_stage1_remaining_kwh | float(0)) > 0.05 and (water_pump_running_w | float(0)) < 100) else 0 }}"
    non_heating_house_w: >-
      {% set house_w = states('sensor.solar_house_consumption_w') | float(0) %}
      {% set heat_w = states('sensor.heating_power') | float(0) %}
      {{ [house_w - heat_w, 350.0] | max }}
    pv_available_for_heating_w: "{{ [(pv_generation_w | float(0)) - (non_heating_house_w | float(350)) - (water_stage1_reserve_w | float(0)), 0.0] | max }}"
    has_pv_excess: "{{ pv_forecast_w > (pv_thr_w + water_stage1_reserve_w) }}"
    max_total_heating_w: "{{ (pv_available_for_heating_w | float(0)) + (battery_support_w | float(0)) }}"
    pv_surplus_w: "{{ [pv_forecast_w - pv_thr_w - water_stage1_reserve_w, 0] | max }}"

    # PV-/Top-Up-Fenster: nur mittags 12–14 Uhr & nur wenn PV-Überschuss
    is_midday_topup_window: >-
      {% set nowts = as_timestamp(now()) %}
      {% set t0 = as_timestamp(now().replace(hour=12, minute=0, second=0, microsecond=0)) %}
      {% set t1 = as_timestamp(now().replace(hour=14, minute=0, second=0, microsecond=0)) %}
      {{ t0 <= nowts < t1 }}
    pv_offset_k: >-
      {% if has_pv_excess and is_midday_topup_window %}
        0.8
      {% elif has_pv_excess %}
        0.5
      {% else %}
        0.0
      {% endif %}
    pv_predictions: "{{ state_attr('sensor.solar_prediction_kwh', 'predictions') }}"
    pv_today_stats: >-
      {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
      {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
      {% set t_now = as_timestamp(now()) %}
      {% set t_today_05 = as_timestamp(today_at('05:00')) %}
      {% set tomorrow_noon = today_at('12:00') + timedelta(days=1) %}
      {% set t_tomorrow_00 = as_timestamp(tomorrow_noon.replace(hour=0, minute=0, second=0, microsecond=0)) %}
      {% set ns = namespace(pv_05_24_kwh=0.0, pv_rem_kwh=0.0) %}
      {% if pv_predictions is mapping %}
        {% for ts_str, val in pv_predictions.items() %}
          {% set b_start = as_timestamp(ts_str) %}
          {% if b_start is number %}
            {% set b_end = b_start + 3600.0 %}
            {% set v = [val | float(0), 0.0] | max %}
            {% set frac_day = [([b_end, t_tomorrow_00] | min - [b_start, t_today_05] | max) / 3600.0, 0.0] | max %}
            {% if frac_day > 0 %}
              {% set ns.pv_05_24_kwh = ns.pv_05_24_kwh + (v * frac_day) %}
            {% endif %}
            {% set frac_rem = [([b_end, t_tomorrow_00] | min - [b_start, t_now] | max) / 3600.0, 0.0] | max %}
            {% if frac_rem > 0 %}
              {% set ns.pv_rem_kwh = ns.pv_rem_kwh + (v * frac_rem) %}
            {% endif %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ {'pv_05_24_kwh': ns.pv_05_24_kwh, 'pv_rem_kwh': ns.pv_rem_kwh} }}
    pv_plan_day_kwh: "{{ pv_today_stats.pv_05_24_kwh | float(0) }}"
    pv_remaining_today_kwh: "{{ pv_today_stats.pv_rem_kwh | float(0) }}"
    pv_remaining_after_water_kwh: "{{ [(pv_remaining_today_kwh | float(0)) - (water_stage1_remaining_kwh | float(0)), 0.0] | max }}"
    setpoint_mean: >-
      {% set weights = {'wohnzimmer': 11.9, 'kueche': 19.5, 'flur': 29.0, 'schlafzimmer': 9.1, 'buero_fabian': 6.6, 'buero_merja': 13.9, 'bad': 4.9, 'speisekammer': 5.1} %}
      {% set wns = namespace(w_sum=0.0, w_total=0.0) %}
      {% for room, w in weights.items() %}
        {% set val = states('input_number.heating_base_' ~ room) | float(none) %}
        {% if val is not none and val > 0 %}
          {% set wns.w_sum = wns.w_sum + (val * w) %}
          {% set wns.w_total = wns.w_total + w %}
        {% endif %}
      {% endfor %}
      {{ (wns.w_sum / wns.w_total) if wns.w_total > 0 else 0 }}
    preheat_full_day_today_k: "{{ state_attr('sensor.heating_preheat_offset_dynamic_uncapped', 'full_day_today_offset_k') | float(states('sensor.heating_preheat_offset_dynamic') | float(0)) }}"
    heating_need_next_day_kwh: >-
      {% set c = states('input_number.building_heat_capacity') | float(7.1) %}
      {% set eff_c = [c * 1.12, 1.0] | max %}
      {% set off = preheat_full_day_today_k | float(0) %}
      {% set def_2r2c = states('sensor.thermal_2r2c_deficit_kwh') | float(none) %}
      {% if def_2r2c is not none %}
        {{ [def_2r2c + (eff_c * off), 0.0] | max }}
      {% else %}
        {% set sp_m = setpoint_mean | float(0) %}
        {% set inside_now = states('sensor.inside_temp_mean_now') | float(0) %}
        {% set missing_delta_k = [sp_m - inside_now, 0.0] | max %}
        {{ [(eff_c * off) + (c * missing_delta_k), 0.0] | max }}
      {% endif %}
    # Verbleibender Netto-Heizbedarf bis 24:00 Uhr relativ zu t_sp (konsistent mit sensor.heating_energy_debt_tracker)
    heating_need_remaining_today_kwh: >-
      {% set c_tot = states('input_number.building_heat_capacity') | float(7.1) %}
      {% set eff_c = [c_tot * 1.12, 1.0] | max %}
      {% set dyn_off = [states('sensor.heating_preheat_offset_dynamic') | float(0), 0.0] | max %}
      {% set e_target_rem = state_attr('sensor.heating_preheat_offset_dynamic_uncapped', 'bridge_net_energy_kwh') | float(eff_c * dyn_off) %}
      {% set t_sp = setpoint_mean | float(21.5) %}
      {% set t_air = states('sensor.inside_temp_mean_now') | float(t_sp) %}
      {% set t_mass = states('sensor.thermal_2r2c_mass_temperature') | float(none) %}
      {% if t_mass is not none %}
        {% set c_air = c_tot * 0.10 %}
        {% set c_mass = c_tot * 0.90 %}
        {% set e_signed_2r2c = (c_air * (t_air - t_sp)) + (c_mass * (t_mass - t_sp)) %}
        {{ [[e_target_rem, 0.0] | max - e_signed_2r2c, 0.0] | max | round(3) }}
      {% else %}
        {{ [[e_target_rem, 0.0] | max - (c_tot * (t_air - t_sp)), 0.0] | max | round(3) }}
      {% endif %}

    # Preheat-Fenster 00–05 Uhr (Preis egal)
    is_preheat_window: >-
      {% set nowts = as_timestamp(now()) %}
      {% set t0 = as_timestamp(now().replace(hour=0, minute=0, second=0, microsecond=0)) %}
      {% set t1 = as_timestamp(now().replace(hour=5, minute=0, second=0, microsecond=0)) %}
      {{ t0 <= nowts < t1 }}

    # Nachts gegen verbleibendes Stage-1-Ziel prüfen; tagsüber gegen volles Tages-Stage-1-Ziel (damit erledigte WW-kWh die Ganztagsbilanz nicht künstlich drehen)
    # sowie gegen night_preheat_ran_today verriegeln, falls 00–05 Uhr bereits NT-Preheat lief.
    night_preheat_ran_today: "{{ state_attr('sensor.heating_preheat_offset_dynamic_uncapped', 'night_preheat_ran_today') == true }}"
    pv_enough_next_day: >-
      {% set w_deduct = (water_stage1_remaining_kwh | float(0)) if is_preheat_window else (water_stage1_target_kwh | float(0)) %}
      {{ ((pv_plan_day_kwh | float(0)) - w_deduct) >= (heating_need_next_day_kwh | float(0)) and (heating_need_next_day_kwh | float(0)) > 0 }}
    shift_heating_start_to_pv: "{{ is_state('binary_sensor.preheat_erlaubt_demand_weighted', 'on') and pv_enough_next_day and (is_preheat_window or (not night_preheat_ran_today)) }}"

    # Heating blocking: When enabled, only allow heating during preheat window (00:00-05:00)
    # Turn this switch ON to block heating outside preheat window
    preheat_enabled: "{{ is_state('binary_sensor.preheat_erlaubt_demand_weighted', 'on') }}"
    heating_block_enabled: "{{ is_state('input_boolean.heating_block_daytime', 'on') and preheat_enabled }}"
    # Tagsüber PV-Shifting NUR an echten PV-Shift-Tagen (wenn Nacht-Preheat übersprungen wurde und im Estrich tatsächlich noch Wärme bis 24:00 fehlt)
    # UND erst starten, wenn echte Netto-PV (pv_available_for_heating_w >= 300 W) über der aktuellen Hauslast anliegt!
    pv_shift_active_now: >-
      {% set dyn_off = states('sensor.heating_preheat_offset_dynamic') | float(0) %}
      {% set is_pv_day_window = is_state('sun.sun', 'above_horizon')
         and now().hour >= (battery_support_from_hour | int(6))
         and now().hour < (battery_support_until_hour | int(18)) %}
      {% set pv_rem = pv_remaining_after_water_kwh | float(0) %}
      {% set need_rem = heating_need_remaining_today_kwh | float(0) %}
      {% set pv_gen = pv_generation_w | float(0) %}
      {% set pv_net = pv_available_for_heating_w | float(0) %}
      {% set soc = battery_soc | float(0) %}
      {% set need_gate = any_room_heating_now or (need_rem > 0.4) %}
      {% set rem_covers_need = (pv_rem >= need_rem) or has_pv_excess %}
      {% set min_rem_kwh = 0.4 if any_room_heating_now else 0.8 %}
      {% set min_pv_w = 450.0 if any_room_heating_now else 700.0 %}
      {% set min_net_w = 0.0 if any_room_heating_now else 300.0 %}
      {% set min_late_soc = 28.0 if any_room_heating_now else 33.0 %}
      {% set battery_buffer_ok = battery_above_min and (pv_rem >= 2.0 or soc >= min_late_soc) %}
      {% set live_pv_and_rem_ok = (pv_rem >= min_rem_kwh) and (pv_gen >= min_pv_w) and (pv_net >= min_net_w) and (battery_buffer_ok or pv_net >= 900.0) %}
      {{ shift_heating_start_to_pv and preheat_enabled and (not is_preheat_window) and (dyn_off > 0) and is_pv_day_window and need_gate and rem_covers_need and (has_pv_excess or live_pv_and_rem_ok) }}
    offset_allowed_now: "{{ has_pv_excess or pv_shift_active_now or (is_preheat_window and preheat_enabled and not shift_heating_start_to_pv) }}"

    # --- Preheat goal (room-specific) ---
    max_total_offset_k: 5.0 # <= 5K above each room's base (includes PV + preheat)
    room_balance_max_diff_k: 1.5 # Max K below weighted preheat target mean before room pulls along

    # ===================================================================
    # SECTION 2: COMPREHENSIVE ROOM DATA (Single Pass)
    # ===================================================================
    # Build all room data in one pass - no JSON parsing needed!
    room_data: >-
      {% set rooms = rooms_json | from_json(default=[]) if rooms_json is string else rooms_json %}
      {% set hyst = hysteresis_k | float(0.05) %}
      {% set sp_mean = setpoint_mean | float(0) %}
      {% set balance_max_diff = room_balance_max_diff_k | float(1.5) %}

      {# Soak Parameters import #}
      {% set d_stop = soak_delta_stop | float(4.0) %}
      {% set d_start = soak_delta_start | float(3.0) %}

      {% set invalid_states = ['unknown', 'unavailable', 'None', ''] %}
      {% set ns = namespace(rooms = {}) %}

      {% for room in rooms %}
        {% set climate_entity = 'climate.climate_room_' ~ room %}
        {% set sensor_l1 = 'sensor.current_l1_' ~ room ~ '_current' %}
        {% set sensor_l2 = 'sensor.current_l2_' ~ room ~ '_current' %}
        {% set sensor_l3 = 'sensor.current_l3_' ~ room ~ '_current' %}

        {# Read temperatures #}
        {% set current_temp = state_attr(climate_entity, 'current_temperature') %}
        {% set current_setpoint = state_attr(climate_entity, 'temperature') %}

        {# Get base temperature from helper #}
        {% set base_helper = 'input_number.heating_base_' ~ room %}
        {% set stored_base = states(base_helper) | float(0) %}
        {% if stored_base > 0 %}
          {% set base_target = stored_base %}
        {% elif current_setpoint is number %}
          {% set base_target = current_setpoint | float %}
        {% else %}
          {% set base_target = 22.0 %}
        {% endif %}

        {# Vacation mode setback: 2.5K reduction (min 16.0°C) #}
        {% set is_vacation = is_state('binary_sensor.vacation_mode_heating', 'on') %}
        {% if is_vacation %}
          {% set base_target = [base_target - 2.5, 16.0] | max %}
        {% endif %}

        {% if current_temp is number %}
          {% set current = current_temp | float %}
        {% else %}
          {% set current = 22.0 %}
        {% endif %}

        {# All rooms heat the same: full preheat for all rooms (both in night preheat and in PV-shifted preheat!) #}
        {% set preheat_eligible_rooms = rooms_json | from_json(default=[]) if rooms_json is string else rooms_json %}
        {% set pv_eligible_rooms = ['wohnzimmer', 'kueche', 'buero_fabian'] %}

        {% set pv_off = (pv_offset_k | float(0)) if ((not pv_shift_active_now) and has_pv_excess and room in pv_eligible_rooms and not is_vacation) else 0.0 %}
        {% set cap = max_total_offset_k | float(1.0) %}

        {% set preheat_off = 0.0 %}
        {% if not is_vacation and room in preheat_eligible_rooms %}
          {% if (is_preheat_window and preheat_enabled and not shift_heating_start_to_pv) or pv_shift_active_now %}
            {% set preheat_off = states('sensor.heating_preheat_offset_dynamic') | float(0) %}
          {% endif %}
        {% endif %}

        {% if offset_allowed_now and not is_vacation %}
          {% set room_offset = preheat_off + pv_off %}
        {% else %}
          {% set room_offset = 0.0 %}
        {% endif %}

        {# Room balance floor during preheat / PV-shifted preheat: pull room up if its target is >1.5K below weighted target mean #}
        {% if ((is_preheat_window and preheat_enabled) or pv_shift_active_now) and offset_allowed_now and not is_vacation and preheat_off > 0 and sp_mean > 10.0 %}
          {% set preheat_target_mean = sp_mean + preheat_off %}
          {% set min_balanced_target = preheat_target_mean - balance_max_diff %}
          {% if (base_target + room_offset) < min_balanced_target %}
            {% set room_offset = (min_balanced_target - base_target) | round(1) %}
          {% endif %}
        {% endif %}

        {% if room_offset > cap %}{% set room_offset = cap %}{% endif %}
        {% if room_offset < 0 %}{% set room_offset = 0 %}{% endif %}

        {% set effective_target = (base_target + room_offset) | round(1) %}
        {% set error = effective_target - current %}

        {# Determine phase #}
        {% set phase = 0 %}
        {% if states(sensor_l1) not in invalid_states %}
          {% set phase = 1 %}
        {% elif states(sensor_l2) not in invalid_states %}
          {% set phase = 2 %}
        {% elif states(sensor_l3) not in invalid_states %}
          {% set phase = 3 %}
        {% endif %}

        {% set amps = states('input_number.heater_' ~ room ~ '_rated_a') | float(0) %}

        {# Determine if heating is needed #}
        {# --- is_heating (robust) & durations for FIFO queue --- #}
        {% set st = states(climate_entity) %}
        {% set is_heating = (st == 'heat') %}
        {% set ent_obj = states[climate_entity] %}
        {% set last_ch_ts = as_timestamp(ent_obj.last_changed) if (ent_obj is defined and ent_obj is not none) else as_timestamp(now()) %}
        {% set state_duration_min = [((as_timestamp(now()) - last_ch_ts) / 60) | round(1), 0.0] | max %}
        {% set on_duration_min = state_duration_min if is_heating else 0.0 %}
        {% set off_duration_min = state_duration_min if not is_heating else 0.0 %}

        {# --- Safety band --- #}
        {% set lower_safety_band_k = 2.0 %}
        {% set sp_now = effective_target %}

        {% set must_heat_start = current <= (sp_now - lower_safety_band_k) %}

        {# --- Security / Floor temperature sensor --- #}
        {% set security_sensor = 'sensor.security_temperature_' ~ room ~ '_max' %}
        {% set floor_temp = states(security_sensor) | float(0) %}
        {# Note: 'bad' uses securitySameAsTemperature (air sensor), not a dedicated floor sensor #}
        {% set has_floor_sensor = (room != 'bad') and (floor_temp > 0) %}

        {# --- Start/Stop thresholds with early cut-off when floor is warm --- #}
        {# Tagsüber 0.2 K Totband (stop -0.1 / start -0.3) verhindert Nachheiz-Takten bei warmem Boden #}
        {% set stop_margin = stop_margin_k | float(0.1) %}
        {% set is_floor_warm = has_floor_sensor and ((floor_temp - current) > 1.2) %}
        {% if preheat_enabled %}
          {% set stop_th  = (sp_now - stop_margin) if is_floor_warm else (sp_now + 0.05) %}
          {% set start_th = (sp_now - 0.2) if is_preheat_window else (sp_now - 0.3) %}
        {% else %}
          {% set stop_th  = (sp_now - stop_margin) if is_floor_warm else (sp_now + 0.1) %}
          {% set start_th = sp_now - 0.4 %}
        {% endif %}

        {# --- Cooldown check --- #}
        {% set cd_ent = 'input_datetime.heating_cooldown_until_' ~ room %}
        {% set cd_state = states(cd_ent) %}
        {% set cd_ts = as_timestamp(cd_state) if cd_state not in invalid_states else 0 %}
        {% set nowts = as_timestamp(now()) %}
        {% set cooldown_ok = (cd_ts == 0) or (nowts >= cd_ts) %}

        {# --- SOAK CHARGING CHECK (Floor vs Air) --- #}

        {% set delta_ok = true %}
        {# Nur prüfen, wenn echter Bodensensor existiert (>0) #}
        {% if has_floor_sensor %}
            {% set delta = floor_temp - current %}
            {% if is_heating %}
                {# Wenn wir heizen: Stoppen wenn Delta zu groß (Hitzestau) #}
                {% if delta > d_stop %}
                    {% set delta_ok = false %}
                {% endif %}
            {% else %}
                {# Wenn wir aus sind: Nur starten wenn Delta abgebaut (Sicherheit) #}
                {% if delta > d_start %}
                    {% set delta_ok = false %}
                {% endif %}
            {% endif %}
        {% endif %}

        {# --- Decision Logic --- #}
        {% if is_heating %}
          {# Bleibe an, solange Temp < Stop UND Delta nicht zu hoch #}
          {% set needs_heating = (current < stop_th) and delta_ok %}
        {% else %}
          {# Gehe an, wenn (Kalt ODER Safety) UND Cooldown OK UND Delta OK (bei amps==0 belegt der Kreis 0A/0W und erholt sich nach Reparatur automatisch!) #}
          {% set needs_heating = cooldown_ok and ((current < start_th) or must_heat_start) and delta_ok %}
        {% endif %}

        {# --- Absolute Security temperature check (floor cut-off >= 24.5C) --- #}
        {% if has_floor_sensor and floor_temp >= 24.5 %}
          {% set needs_heating = false %}
        {% endif %}

        {# Build room data structure #}
        {% set ns.rooms = ns.rooms | combine({
          room: ns.rooms.get(room, {}) | combine({
            'entity': climate_entity,
            'current_temp': current,
            'base_target': base_target,
            'effective_target': effective_target,
            'offset': room_offset,
            'preheat_offset': preheat_off,
            'pv_offset': pv_off,
            'error': error,
            'phase': phase,
            'amps': amps,
            'needs_heating': needs_heating,
            'must_heat': must_heat_start,
            'is_heating': is_heating,
            'on_duration': on_duration_min,
            'off_duration': off_duration_min,
            'delta_ok': delta_ok
          })
        }) %}
      {% endfor %}
      {{ (ns.rooms | tojson) | string }}

    # ===================================================================
    # SECTION 3: ROOM SELECTION BY PHASE (FIFO Queue for full phases)
    # ===================================================================
    # Active rooms running >= 15 min yield to waiting rooms on a full phase
    sel_p1: >-
      {% set rooms_data = room_data | from_json(default={}) if room_data is string else room_data %}
      {% set max_amps = phase_max_amps | float(16.0) %}
      {% set ns = namespace(active=[], waiting=[], selected=[], total=0.0) %}
      {% for room, d in rooms_data.items() %}
        {% if d.phase == 1 and d.needs_heating %}
          {% if d.is_heating %}
            {% set ns.active = ns.active + [{'room': room, 'amps': d.amps, 'on_duration': d.on_duration, 'must_heat': d.must_heat, 'error': d.error}] %}
          {% else %}
            {% set w_score = (1000 if d.must_heat else 0) + (d.off_duration | float(0)) * 2 + (d.error | float(0)) %}
            {% set ns.waiting = ns.waiting + [{'room': room, 'amps': d.amps, 'on_duration': 0.0, 'off_duration': d.off_duration, 'must_heat': d.must_heat, 'score': w_score}] %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% set ns.selected = ns.active %}
      {% set ns.total = 0.0 %}
      {% for r in ns.selected %}
        {% set ns.total = ns.total + (r.amps | float(0)) %}
      {% endfor %}
      {% if ns.total > max_amps %}
        {% set trim_candidates = ns.selected | rejectattr('must_heat') | sort(attribute='on_duration', reverse=True) | list %}
        {% for tc in trim_candidates %}
          {% if ns.total > max_amps %}
            {% set ns.selected = ns.selected | rejectattr('room', 'equalto', tc.room) | list %}
            {% set ns.total = ns.total - (tc.amps | float(0)) %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {% set sorted_waiting = ns.waiting | sort(attribute='score', reverse=True) %}
      {% for w in sorted_waiting %}
        {% if ns.total + (w.amps | float(0)) <= max_amps %}
          {% set ns.selected = ns.selected + [w] %}
          {% set ns.total = ns.total + (w.amps | float(0)) %}
        {% else %}
          {% set y_ns = namespace(yielded=false, new_selected=ns.selected, new_total=ns.total) %}
          {% set candidates = ns.selected | selectattr('on_duration', 'ge', 14.5) | rejectattr('must_heat') | sort(attribute='on_duration', reverse=True) | list %}
          {% for c in candidates %}
            {% if not y_ns.yielded and (ns.total - (c.amps | float(0)) + (w.amps | float(0))) <= max_amps %}
              {% set y_ns.yielded = true %}
              {% set y_ns.new_selected = (ns.selected | rejectattr('room', 'equalto', c.room) | list) + [w] %}
              {% set y_ns.new_total = ns.total - (c.amps | float(0)) + (w.amps | float(0)) %}
            {% endif %}
          {% endfor %}
          {% if not y_ns.yielded and candidates | count > 1 %}
            {% set c_ns = namespace(rem_sel=ns.selected, rem_tot=ns.total, ok=false) %}
            {% for c in candidates %}
              {% if not c_ns.ok %}
                {% set c_ns.rem_sel = c_ns.rem_sel | rejectattr('room', 'equalto', c.room) | list %}
                {% set c_ns.rem_tot = c_ns.rem_tot - (c.amps | float(0)) %}
                {% if c_ns.rem_tot + (w.amps | float(0)) <= max_amps %}
                  {% set c_ns.ok = true %}
                  {% set y_ns.yielded = true %}
                  {% set y_ns.new_selected = c_ns.rem_sel + [w] %}
                  {% set y_ns.new_total = c_ns.rem_tot + (w.amps | float(0)) %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% if y_ns.yielded %}
            {% set ns.selected = y_ns.new_selected %}
            {% set ns.total = y_ns.new_total %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ (ns.selected | map(attribute='room') | list | tojson) | string }}

    sel_p2: >-
      {% set rooms_data = room_data | from_json(default={}) if room_data is string else room_data %}
      {% set max_amps = phase_max_amps | float(16.0) %}
      {% set ns = namespace(active=[], waiting=[], selected=[], total=0.0) %}
      {% for room, d in rooms_data.items() %}
        {% if d.phase == 2 and d.needs_heating %}
          {% if d.is_heating %}
            {% set ns.active = ns.active + [{'room': room, 'amps': d.amps, 'on_duration': d.on_duration, 'must_heat': d.must_heat, 'error': d.error}] %}
          {% else %}
            {% set w_score = (1000 if d.must_heat else 0) + (d.off_duration | float(0)) * 2 + (d.error | float(0)) %}
            {% set ns.waiting = ns.waiting + [{'room': room, 'amps': d.amps, 'on_duration': 0.0, 'off_duration': d.off_duration, 'must_heat': d.must_heat, 'score': w_score}] %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% set ns.selected = ns.active %}
      {% set ns.total = 0.0 %}
      {% for r in ns.selected %}
        {% set ns.total = ns.total + (r.amps | float(0)) %}
      {% endfor %}
      {% if ns.total > max_amps %}
        {% set trim_candidates = ns.selected | rejectattr('must_heat') | sort(attribute='on_duration', reverse=True) | list %}
        {% for tc in trim_candidates %}
          {% if ns.total > max_amps %}
            {% set ns.selected = ns.selected | rejectattr('room', 'equalto', tc.room) | list %}
            {% set ns.total = ns.total - (tc.amps | float(0)) %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {% set sorted_waiting = ns.waiting | sort(attribute='score', reverse=True) %}
      {% for w in sorted_waiting %}
        {% if ns.total + (w.amps | float(0)) <= max_amps %}
          {% set ns.selected = ns.selected + [w] %}
          {% set ns.total = ns.total + (w.amps | float(0)) %}
        {% else %}
          {% set y_ns = namespace(yielded=false, new_selected=ns.selected, new_total=ns.total) %}
          {% set candidates = ns.selected | selectattr('on_duration', 'ge', 14.5) | rejectattr('must_heat') | sort(attribute='on_duration', reverse=True) | list %}
          {% for c in candidates %}
            {% if not y_ns.yielded and (ns.total - (c.amps | float(0)) + (w.amps | float(0))) <= max_amps %}
              {% set y_ns.yielded = true %}
              {% set y_ns.new_selected = (ns.selected | rejectattr('room', 'equalto', c.room) | list) + [w] %}
              {% set y_ns.new_total = ns.total - (c.amps | float(0)) + (w.amps | float(0)) %}
            {% endif %}
          {% endfor %}
          {% if not y_ns.yielded and candidates | count > 1 %}
            {% set c_ns = namespace(rem_sel=ns.selected, rem_tot=ns.total, ok=false) %}
            {% for c in candidates %}
              {% if not c_ns.ok %}
                {% set c_ns.rem_sel = c_ns.rem_sel | rejectattr('room', 'equalto', c.room) | list %}
                {% set c_ns.rem_tot = c_ns.rem_tot - (c.amps | float(0)) %}
                {% if c_ns.rem_tot + (w.amps | float(0)) <= max_amps %}
                  {% set c_ns.ok = true %}
                  {% set y_ns.yielded = true %}
                  {% set y_ns.new_selected = c_ns.rem_sel + [w] %}
                  {% set y_ns.new_total = c_ns.rem_tot + (w.amps | float(0)) %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% if y_ns.yielded %}
            {% set ns.selected = y_ns.new_selected %}
            {% set ns.total = y_ns.new_total %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ (ns.selected | map(attribute='room') | list | tojson) | string }}

    sel_p3: >-
      {% set rooms_data = room_data | from_json(default={}) if room_data is string else room_data %}
      {% set max_amps = phase_max_amps | float(16.0) %}
      {% set ns = namespace(active=[], waiting=[], selected=[], total=0.0) %}
      {% for room, d in rooms_data.items() %}
        {% if d.phase == 3 and d.needs_heating %}
          {% if d.is_heating %}
            {% set ns.active = ns.active + [{'room': room, 'amps': d.amps, 'on_duration': d.on_duration, 'must_heat': d.must_heat, 'error': d.error}] %}
          {% else %}
            {% set w_score = (1000 if d.must_heat else 0) + (d.off_duration | float(0)) * 2 + (d.error | float(0)) %}
            {% set ns.waiting = ns.waiting + [{'room': room, 'amps': d.amps, 'on_duration': 0.0, 'off_duration': d.off_duration, 'must_heat': d.must_heat, 'score': w_score}] %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% set ns.selected = ns.active %}
      {% set ns.total = 0.0 %}
      {% for r in ns.selected %}
        {% set ns.total = ns.total + (r.amps | float(0)) %}
      {% endfor %}
      {% if ns.total > max_amps %}
        {% set trim_candidates = ns.selected | rejectattr('must_heat') | sort(attribute='on_duration', reverse=True) | list %}
        {% for tc in trim_candidates %}
          {% if ns.total > max_amps %}
            {% set ns.selected = ns.selected | rejectattr('room', 'equalto', tc.room) | list %}
            {% set ns.total = ns.total - (tc.amps | float(0)) %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {% set sorted_waiting = ns.waiting | sort(attribute='score', reverse=True) %}
      {% for w in sorted_waiting %}
        {% if ns.total + (w.amps | float(0)) <= max_amps %}
          {% set ns.selected = ns.selected + [w] %}
          {% set ns.total = ns.total + (w.amps | float(0)) %}
        {% else %}
          {% set y_ns = namespace(yielded=false, new_selected=ns.selected, new_total=ns.total) %}
          {% set candidates = ns.selected | selectattr('on_duration', 'ge', 14.5) | rejectattr('must_heat') | sort(attribute='on_duration', reverse=True) | list %}
          {% for c in candidates %}
            {% if not y_ns.yielded and (ns.total - (c.amps | float(0)) + (w.amps | float(0))) <= max_amps %}
              {% set y_ns.yielded = true %}
              {% set y_ns.new_selected = (ns.selected | rejectattr('room', 'equalto', c.room) | list) + [w] %}
              {% set y_ns.new_total = ns.total - (c.amps | float(0)) + (w.amps | float(0)) %}
            {% endif %}
          {% endfor %}
          {% if not y_ns.yielded and candidates | count > 1 %}
            {% set c_ns = namespace(rem_sel=ns.selected, rem_tot=ns.total, ok=false) %}
            {% for c in candidates %}
              {% if not c_ns.ok %}
                {% set c_ns.rem_sel = c_ns.rem_sel | rejectattr('room', 'equalto', c.room) | list %}
                {% set c_ns.rem_tot = c_ns.rem_tot - (c.amps | float(0)) %}
                {% if c_ns.rem_tot + (w.amps | float(0)) <= max_amps %}
                  {% set c_ns.ok = true %}
                  {% set y_ns.yielded = true %}
                  {% set y_ns.new_selected = c_ns.rem_sel + [w] %}
                  {% set y_ns.new_total = c_ns.rem_tot + (w.amps | float(0)) %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% if y_ns.yielded %}
            {% set ns.selected = y_ns.new_selected %}
            {% set ns.total = y_ns.new_total %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ (ns.selected | map(attribute='room') | list | tojson) | string }}

    # ===================================================================
    # SECTION 4: CLIMATE ENTITY MAPPING (reuses sel_p1, sel_p2, sel_p3)
    # ===================================================================
    climates_on: >-
      {% set s1 = sel_p1 | from_json(default=[]) if sel_p1 is string else sel_p1 %}
      {% set s2 = sel_p2 | from_json(default=[]) if sel_p2 is string else sel_p2 %}
      {% set s3 = sel_p3 | from_json(default=[]) if sel_p3 is string else sel_p3 %}
      {% set ns = namespace(climates = []) %}
      {% for room in (s1 + s2 + s3) %}
        {% set ns.climates = ns.climates + ['climate.climate_room_' ~ room] %}
      {% endfor %}
      {{ (ns.climates | tojson) | string }}

    climates_off: >-
      {% set s1 = sel_p1 | from_json(default=[]) if sel_p1 is string else sel_p1 %}
      {% set s2 = sel_p2 | from_json(default=[]) if sel_p2 is string else sel_p2 %}
      {% set s3 = sel_p3 | from_json(default=[]) if sel_p3 is string else sel_p3 %}
      {% set selected_rooms = s1 + s2 + s3 %}
      {% set all_rooms = rooms_json | from_json(default=[]) if rooms_json is string else rooms_json %}
      {% set ns = namespace(climates = []) %}
      {% for room in all_rooms %}
        {% if room not in selected_rooms %}
          {% set ns.climates = ns.climates + ['climate.climate_room_' ~ room] %}
        {% endif %}
      {% endfor %}
      {{ (ns.climates | tojson) | string }}

  condition: []
  action:
    # 3) Endgültiges Heizerlaubnis
    - variables:
        # tagsüber nur, wenn (Preis günstig) ODER (12–14 & PV-Excess)
        allow_daytime_heat: >-
          {% set topup_ok = (is_midday_topup_window and has_pv_excess) %}
          {{ topup_ok }}
        heating_allowed_now: >-
          {% if is_state('binary_sensor.vacation_mode_heating', 'on') %}
            {{ is_preheat_window or has_pv_excess or (battery_above_min and battery_support_allowed_now) }}
          {% elif shift_heating_start_to_pv %}
            {{ pv_shift_active_now or allow_daytime_heat or has_pv_excess }}
          {% elif heating_block_enabled %}
            {{ is_preheat_window or allow_daytime_heat or has_pv_excess or pv_shift_active_now }}
          {% elif not preheat_enabled %}
            true
          {% elif is_preheat_window %}
            true
          {% elif allow_daytime_heat %}
            true
          {% elif battery_above_min and battery_support_allowed_now %}
            true
          {% else %}
            false
          {% endif %}
    # ===================================================================
    # ACTION 1: Apply offsets to thermostats (planner-owned) + persist offset
    # ===================================================================
    - service: input_boolean.turn_on
      target: { entity_id: input_boolean.heating_planner_applying }

    - repeat:
        for_each: "{{ rooms_json | from_json(default=[]) if rooms_json is string else rooms_json }}"
        sequence:
          - variables:
              room: "{{ repeat.item }}"
              rd: "{{ room_data | from_json(default={}) if room_data is string else room_data }}"
              base_ent: "input_number.heating_base_{{ repeat.item }}"
              stored_base: "{{ states(base_ent) | float(0) }}"
              base: "{{ rd[room].base_target | float(22) }}"
              offset_k: "{{ rd[room].offset | float(0) }}"
              target_sp: "{{ (base + offset_k) | round(1) }}"
              current_sp: "{{ state_attr('climate.climate_room_' ~ repeat.item, 'temperature') | float(0) }}"
              current_off: "{{ states('input_number.heating_offset_' ~ repeat.item) | float(0) }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ offset_k > 0 }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ (current_sp - target_sp) | abs > 0.05 }}"
                    then:
                      - service: climate.set_temperature
                        target:
                          entity_id: "climate.climate_room_{{ repeat.item }}"
                        data:
                          temperature: "{{ target_sp }}"
                  - if:
                      - condition: template
                        value_template: "{{ (current_off - offset_k) | abs > 0.01 }}"
                    then:
                      - service: input_number.set_value
                        target:
                          entity_id: "input_number.heating_offset_{{ repeat.item }}"
                        data:
                          value: "{{ offset_k }}"

              - conditions:
                  - condition: template
                    value_template: "{{ offset_k == 0 }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ stored_base > 0 and (current_sp - base) | abs > 0.05 }}"
                        sequence:
                          - service: climate.set_temperature
                            target:
                              entity_id: "climate.climate_room_{{ repeat.item }}"
                            data:
                              temperature: "{{ base }}"
                  - if:
                      - condition: template
                        value_template: "{{ current_off | abs > 0.01 }}"
                    then:
                      - service: input_number.set_value
                        target:
                          entity_id: "input_number.heating_offset_{{ repeat.item }}"
                        data:
                          value: 0

    - service: input_boolean.turn_off
      target: { entity_id: input_boolean.heating_planner_applying }
    # Log offset status
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {% set rd = room_data | from_json(default={}) if room_data is string else room_data %}
                {% set ns = namespace(any=false) %}
                {% for r, d in rd.items() %}
                  {% if (d.offset | float(0)) > 0 %}{% set ns.any = true %}{% endif %}
                {% endfor %}
                {{ ns.any }}
          sequence:
            - service: logbook.log
              data:
                name: "Heiz-Planer"
                message: >-
                  {% set rd = room_data | from_json(default={}) if room_data is string else room_data %}
                  {% set offs = rd.values() | map(attribute='offset') | list %}
                  {% set pre = rd.values() | map(attribute='preheat_offset') | list %}
                  Offset aktiv (room): total_min={{ offs|min }}K total_max={{ offs|max }}K,
                  preheat_min={{ pre|min }}K preheat_max={{ pre|max }}K,
                  PV_shift={{ pv_shift_active_now }}, PV={{ pv_offset_k | float(0) }}K,
                  PV_rem={{ pv_remaining_after_water_kwh | float(0) | round(1) }}kWh,
                  Need_rem={{ heating_need_remaining_today_kwh | float(0) | round(1) }}kWh

    # === 9) Phase-safe HVAC control =================================
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {% set rd = room_data | from_json(default={}) if room_data is string else room_data %}
                {% set safety = rd.values() | selectattr('must_heat') | list | count > 0 %}
                {{ heating_allowed_now or safety }}
          sequence:
            - variables:
                cap: "{{ phase_max_amps | float(16) }}"
                rd: "{{ room_data | from_json(default={}) if room_data is string else room_data }}"
                power_budget_w: >-
                  {% if is_preheat_window %}
                    11000
                  {% elif preheat_enabled %}
                    {{ [max_total_heating_w | float(0), 0] | max }}
                  {% else %}
                    11000
                  {% endif %}

                # Übernimm die bereits berechneten Selektionen & Plans
                sel1: >-
                  {% if sel_p1 is string %}
                    {{ sel_p1 | from_json(default=[]) }}
                  {% else %}
                    {{ sel_p1 }}
                  {% endif %}
                sel2: >-
                  {% if sel_p2 is string %}
                    {{ sel_p2 | from_json(default=[]) }}
                  {% else %}
                    {{ sel_p2 }}
                  {% endif %}
                sel3: >-
                  {% if sel_p3 is string %}
                    {{ sel_p3 | from_json(default=[]) }}
                  {% else %}
                    {{ sel_p3 }}
                  {% endif %}
                planned_on: >-
                  {% if climates_on is string %}
                    {{ climates_on | from_json(default=[]) }}
                  {% else %}
                    {{ climates_on }}
                  {% endif %}
                planned_off: >-
                  {% if climates_off is string %}
                    {{ climates_off | from_json(default=[]) }}
                  {% else %}
                    {{ climates_off }}
                  {% endif %}

                # Greedy-Pack je Phase – Jinja-only (ohne .append(), nur Listen-Konkatenation)
                # Wenn heating_allowed_now false ist (nur Safety-Betrieb), nur Räume mit must_heat zulassen!
                p1_keep: >-
                  {% set ns = namespace(load=0.0, keep=[]) %}
                  {% for r in sel1 %}
                    {% if heating_allowed_now or rd[r]['must_heat'] %}
                      {% set a = rd[r]['amps'] | float(0) %}
                      {% if ns.load + a <= cap %}
                        {% set ns.load = ns.load + a %}
                        {% set ns.keep = ns.keep + [ rd[r]['entity'] ] %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.keep }}

                p2_keep: >-
                  {% set ns = namespace(load=0.0, keep=[]) %}
                  {% for r in sel2 %}
                    {% if heating_allowed_now or rd[r]['must_heat'] %}
                      {% set a = rd[r]['amps'] | float(0) %}
                      {% if ns.load + a <= cap %}
                        {% set ns.load = ns.load + a %}
                        {% set ns.keep = ns.keep + [ rd[r]['entity'] ] %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.keep }}

                p3_keep: >-
                  {% set ns = namespace(load=0.0, keep=[]) %}
                  {% for r in sel3 %}
                    {% if heating_allowed_now or rd[r]['must_heat'] %}
                      {% set a = rd[r]['amps'] | float(0) %}
                      {% if ns.load + a <= cap %}
                        {% set ns.load = ns.load + a %}
                        {% set ns.keep = ns.keep + [ rd[r]['entity'] ] %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.keep }}

                phase_safe_on_raw: "{{ p1_keep + p2_keep + p3_keep }}"
                phase_safe_on: >-
                  {% set ns = namespace(items=[], used=0.0, out=[]) %}
                  {% for ent in phase_safe_on_raw %}
                    {% set room = ent | regex_replace('^climate\\.climate_room_', '') %}
                    {% if rd[room] is defined %}
                      {% set is_must = rd[room]['must_heat'] | default(false) %}
                      {# Kleiner Halte-Bonus (+0.25) für bereits laufende Heizkreise verhindert unnötiges Umschalten zwischen Räumen #}
                      {% set score = (100000 if is_must else 0) + (0.25 if rd[room]['is_heating'] else 0.0) + (rd[room]['error'] | float(0)) %}
                      {% set room_w = (rd[room]['amps'] | float(0)) * 230.0 %}
                      {% set ns.items = ns.items + [{'entity': ent, 'score': score, 'w': room_w, 'must_heat': is_must}] %}
                    {% endif %}
                  {% endfor %}
                  {% for it in ns.items | sort(attribute='score', reverse=True) %}
                    {% if it.must_heat or (ns.used + (it.w | float(0)) <= (power_budget_w | float(0))) %}
                      {% set ns.used = ns.used + (it.w | float(0)) %}
                      {% set ns.out = ns.out + [it.entity] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.out }}
                to_off: "{{ (planned_on + planned_off) | reject('in', phase_safe_on) | list }}"
                to_heat_changed: "{{ phase_safe_on | reject('is_state', 'heat') | list }}"
                to_off_changed: "{{ to_off | reject('is_state', 'off') | list }}"
                cooldown_minutes: "{{ states('input_number.heating_cooldown_minutes')|int(10) }}"
                to_off_rooms: >-
                  {% set rooms = to_off | map('regex_replace','^climate\\.climate_room_','') | list %}
                  {% set ns = namespace(out=[]) %}
                  {% for r in rooms %}
                    {% if states('climate.climate_room_' ~ r) == 'heat' %}
                      {% set ns.out = ns.out + [r] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.out }}

            # Heat the allowed ones (only those not already in 'heat')
            - if:
                - condition: template
                  value_template: "{{ to_heat_changed | count > 0 }}"
              then:
                - service: climate.set_hvac_mode
                  target: { entity_id: "{{ to_heat_changed }}" }
                  data: { hvac_mode: heat }

            # Off for everybody else (only those not already in 'off')
            - if:
                - condition: template
                  value_template: "{{ to_off_changed | count > 0 }}"
              then:
                - service: climate.set_hvac_mode
                  target: { entity_id: "{{ to_off_changed }}" }
                  data: { hvac_mode: "off" }
            - if:
                - condition: template
                  value_template: "{{ to_off_rooms | count > 0 and cooldown_minutes > 0 }}"
              then:
                - repeat:
                    for_each: "{{ to_off_rooms }}"
                    sequence:
                      - service: input_datetime.set_datetime
                        target:
                          entity_id: "input_datetime.heating_cooldown_until_{{ repeat.item }}"
                        data:
                          date: "{{ (now() + timedelta(minutes=cooldown_minutes)).strftime('%Y-%m-%d') }}"
                          time: "{{ (now() + timedelta(minutes=cooldown_minutes)).strftime('%H:%M:%S') }}"

            # Optional: log how many made it per phase
            - service: logbook.log
              data:
                name: "Heiz-Planer"
                message: >-
                  Phase guard: cap={{ cap }}A |
                  SOC={{ battery_soc | round(1) }}% |
                  PV-gen={{ pv_generation_w | round(0) }}W (net={{ pv_available_for_heating_w | round(0) }}W, rem={{ pv_remaining_after_water_kwh | round(1) }}kWh) |
                  Batt+={{ battery_support_w | round(0) }}W |
                  Budget={{ power_budget_w | round(0) }}W |
                  P1={{ p1_keep|length }} {{ p1_keep }} |
                  P2={{ p2_keep|length }} {{ p2_keep }} |
                  P3={{ p3_keep|length }} {{ p3_keep }} |
                  phase_safe_on={{ phase_safe_on|length }} |
                  planned_on={{ planned_on|length }}
      default:
        # If heating not allowed now: switch everything off
        - variables:
            cooldown_minutes: "{{ states('input_number.heating_cooldown_minutes')|int(10) }}"
            all_rooms: "{{ rooms_json | from_json(default=[]) if rooms_json is string else rooms_json }}"
            rooms_heating_now: >-
              {% set ns = namespace(out=[]) %}
              {% for r in all_rooms %}
                {% if states('climate.climate_room_' ~ r) == 'heat' %}
                  {% set ns.out = ns.out + [r] %}
                {% endif %}
              {% endfor %}
              {{ ns.out }}
            climates_heating_now: >-
              {{ rooms_heating_now | map('regex_replace','^(.*)$','climate.climate_room_\\1') | list }}
        - if:
            - condition: template
              value_template: "{{ climates_heating_now | count > 0 }}"
          then:
            - service: climate.set_hvac_mode
              target: { entity_id: "{{ climates_heating_now }}" }
              data: { hvac_mode: "off" }
        - if:
            - condition: template
              value_template: "{{ cooldown_minutes > 0 and rooms_heating_now | count > 0 }}"
          then:
            - repeat:
                for_each: "{{ rooms_heating_now }}"
                sequence:
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: "input_datetime.heating_cooldown_until_{{ repeat.item }}"
                    data:
                      date: "{{ (now() + timedelta(minutes=cooldown_minutes)).strftime('%Y-%m-%d') }}"
                      time: "{{ (now() + timedelta(minutes=cooldown_minutes)).strftime('%H:%M:%S') }}"
