- id: 'cover_night_mode_start'
  alias: "Rolladen: Nachtmodus Start (30 min nach Sonnenuntergang)"
  mode: single
  triggers:
    - trigger: sun
      event: sunset
      offset: "00:30:00"
    - trigger: time_pattern
      minutes: "/10"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: sun.sun
      state: "below_horizon"
    - condition: template
      value_template: >-
        {% set sunset_ts = as_timestamp(state_attr('sun.sun', 'next_setting')) %}
        {% set rising_ts = as_timestamp(state_attr('sun.sun', 'next_rising')) %}
        {# When below_horizon, next_rising is in the future. Check if 30m elapsed after sunset #}
        {% if sunset_ts is not none and rising_ts is not none and sunset_ts > rising_ts %}
          {# Sunset occurred today (next_setting is tomorrow), check if now >= sunset + 30m #}
          {% set prev_sunset = sunset_ts - 86400 %}
          {{ as_timestamp(now()) >= (prev_sunset + 1800) }}
        {% else %}
          true
        {% endif %}
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.cover_night_mode
    - action: system_log.write
      data:
        logger: automatic_cover_control
        level: info
        message: "[Cover Night Mode] Night mode activated (30 minutes after sunset reached)."

- id: 'cover_night_mode_wakeup'
  alias: "Rolladen: Nachtmodus Aufwachen (Alle Lichter nach Sonnenaufgang + 10 min Verzögerung)"
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - light.licht_bad_virtuell
        - light.licht_buero_fabian_virtuell
        - light.licht_buero_merja_virtuell
        - light.licht_flur_virtuell
        - light.licht_kueche_virtuell
        - light.licht_schlafzimmer_virtuell
        - light.licht_speisekammer_virtuell
        - light.licht_wohnzimmer_virtuell
      to: "on"
    - trigger: state
      entity_id: sun.sun
      to: "above_horizon"
  conditions:
    - condition: state
      entity_id: input_boolean.cover_night_mode
      state: "on"
    - condition: state
      entity_id: sun.sun
      state: "above_horizon"
    - condition: template
      value_template: >-
        {% set lights = [
          'light.licht_bad_virtuell',
          'light.licht_buero_fabian_virtuell',
          'light.licht_buero_merja_virtuell',
          'light.licht_flur_virtuell',
          'light.licht_kueche_virtuell',
          'light.licht_schlafzimmer_virtuell',
          'light.licht_speisekammer_virtuell',
          'light.licht_wohnzimmer_virtuell'
        ] %}
        {% set all_on = (lights | select('is_state', 'on') | list | count) == (lights | count) %}
        {% if all_on %}
          {% set ns = namespace(timestamps=[]) %}
          {% for l in lights %}
            {% set st = states[l] %}
            {% if st is not none and st.last_changed is not none %}
              {% set ns.timestamps = ns.timestamps + [as_timestamp(st.last_changed)] %}
            {% endif %}
          {% endfor %}
          {% if ns.timestamps | count == (lights | count) %}
            {% set min_ts = ns.timestamps | min %}
            {% set max_ts = ns.timestamps | max %}
            {{ (max_ts - min_ts) <= 60 }}
          {% else %}
            false
          {% endif %}
        {% else %}
          false
        {% endif %}
  actions:
    - action: system_log.write
      data:
        logger: automatic_cover_control
        level: info
        message: "[Cover Night Mode] All wake-up lights detected within 1 minute after sunrise. Starting 10-minute wake-up delay."
    - delay: "00:10:00"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.cover_night_mode
    - action: input_datetime.set_datetime
      target:
        entity_id:
          - input_datetime.cover_manual_change_rollade_bad
          - input_datetime.cover_manual_change_rollade_buero_fabian
          - input_datetime.cover_manual_change_rollade_buero_merja
          - input_datetime.cover_manual_change_rollade_hwr
          - input_datetime.cover_manual_change_rollade_kueche_links
          - input_datetime.cover_manual_change_rollade_kueche_rechts
          - input_datetime.cover_manual_change_rollade_schlafzimmer
          - input_datetime.cover_manual_change_rollade_speisekammer
          - input_datetime.cover_manual_change_rollade_wohnzimmer_links
          - input_datetime.cover_manual_change_rollade_wohnzimmer_rechts
      data:
        datetime: "1970-01-01 00:00:00"
    - action: system_log.write
      data:
        logger: automatic_cover_control
        level: info
        message: "[Cover Night Mode] 10-minute wake-up delay completed. Night mode deactivated and manual cooldowns reset."
