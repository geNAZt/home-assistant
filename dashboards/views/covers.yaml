title: Rolladen Steuerung
icon: mdi:window-shutter-cog
path: covers
cards:
  - type: entities
    title: Global Steuerung & Modi
    show_header_toggle: false
    entities:
      - entity: input_select.cover_mode
        name: Rolladen Modus
      - entity: input_boolean.cover_night_mode
        name: Nachtmodus Aktiv
      - entity: input_text.exempt_covers
        name: Ausgenommene Rolläden (Text)
      - entity: input_datetime.cover_last_global_move
        name: Letzte Globale Bewegung

  - type: grid
    title: Rolläden Übersicht
    columns: 2
    square: false
    cards:
      - type: entities
        title: "Rollade Buero Fabian"
        show_header_toggle: false
        entities:
          - entity: cover.rollade_buero_fabian
            name: Position
          - entity: input_boolean.auto_cover_rollade_buero_fabian
            name: Automatik Aktiv
          - entity: input_number.cover_min_open_rollade_buero_fabian
            name: Mindestöffnung (%)
          - entity: input_datetime.cover_manual_change_rollade_buero_fabian
            name: Manuelle Änderung
          - entity: sensor.solar_expected_gain_rollade_buero_fabian
            name: Erwartete Solarleistung
