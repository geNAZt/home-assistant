title: Licht Steuerung
icon: mdi:lightbulb-group
path: lights
cards:
  - type: entities
    title: "Übersicht: Alle Räume"
    show_header_toggle: false
    state_color: true
    entities:
      - entity: light.wohnzimmer_lights
        name: "Wohnzimmer"
        secondary_info: last-changed
      - entity: light.buero_merja_lights
        name: "Buero Merja"
        secondary_info: last-changed
      - entity: light.buero_fabian_lights
        name: "Buero Fabian"
        secondary_info: last-changed
      - entity: light.flur_lights
        name: "Flur"
        secondary_info: last-changed
      - entity: light.kueche_lights
        name: "Kueche"
        secondary_info: last-changed
      - entity: light.speisekammer_lights
        name: "Speisekammer"
        secondary_info: last-changed
      - entity: light.schlafzimmer_lights
        name: "Schlafzimmer"
        secondary_info: last-changed
      - entity: light.bad_lights
        name: "Bad"
        secondary_info: last-changed

  - type: history-graph
    title: "Tageslicht vs. Gesamthelligkeit (Lux)"
    hours_to_show: 12
    refresh_interval: 30
    entities:
      - entity: sensor.lux_wohnzimmer_daylight
        name: "Wohnzimmer (Tageslicht)"
      - entity: sensor.lux_wohnzimmer
        name: "Wohnzimmer (Sensor)"
      - entity: sensor.lux_buero_merja_daylight
        name: "Buero Merja (Tageslicht)"
      - entity: sensor.lux_buero_merja
        name: "Buero Merja (Sensor)"
      - entity: sensor.lux_buero_fabian_daylight
        name: "Buero Fabian (Tageslicht)"
      - entity: sensor.lux_buero_fabian
        name: "Buero Fabian (Sensor)"
      - entity: sensor.lux_flur_daylight
        name: "Flur (Tageslicht)"
      - entity: sensor.lux_flur
        name: "Flur (Sensor)"
      - entity: sensor.lux_kueche_daylight
        name: "Kueche (Tageslicht)"
      - entity: sensor.lux_kueche
        name: "Kueche (Sensor)"
      - entity: sensor.lux_speisekammer_daylight
        name: "Speisekammer (Tageslicht)"
      - entity: sensor.lux_speisekammer
        name: "Speisekammer (Sensor)"
      - entity: sensor.lux_schlafzimmer_daylight
        name: "Schlafzimmer (Tageslicht)"
      - entity: sensor.lux_schlafzimmer
        name: "Schlafzimmer (Sensor)"
      - entity: sensor.lux_bad_daylight
        name: "Bad (Tageslicht)"
      - entity: sensor.lux_bad
        name: "Bad (Sensor)"

  - type: entities
    title: "Wohnzimmer"
    show_header_toggle: false
    state_color: true
    entities:
      - entity: light.wohnzimmer_lights
        name: Lichtgruppe
      - entity: binary_sensor.presence_wohnzimmer
        name: Präsenz
      - entity: sensor.lux_wohnzimmer_daylight
        name: "Tageslicht (75/100 lx)"
      - entity: sensor.lux_wohnzimmer
        name: "Sensor Ist-Wert (Offset: 51 lx)"
      - entity: input_boolean.auto_light_wohnzimmer
        name: Automatik Aktiv
      - entity: input_boolean.force_on_wohnzimmer
        name: Dauer-Ein (Force On)
      - entity: input_number.wohnzimmer_brightness
        name: Gespeicherte Helligkeit
      - entity: input_number.wohnzimmer_color_temp
        name: Farbtemperatur (K)
      - entity: light.light_1_wohnzimmer
        name: "Lampe 1"
      - entity: light.light_2_wohnzimmer
        name: "Lampe 2"
  - type: entities
    title: "Buero Merja"
    show_header_toggle: false
    state_color: true
    entities:
      - entity: light.buero_merja_lights
