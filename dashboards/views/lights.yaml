      - entity: sensor.lux_buero_fabian
        name: "Sensor Ist-Wert (Offset: 41 lx)"
      - entity: input_boolean.auto_light_buero_fabian
        name: Automatik Aktiv
      - entity: input_boolean.force_on_buero_fabian
        name: Dauer-Ein (Force On)
      - entity: input_number.buero_fabian_brightness
        name: Gespeicherte Helligkeit
      - entity: input_number.buero_fabian_color_temp
        name: Farbtemperatur (K)
      - entity: light.light_1_buero_fabian
        name: "Lampe 1"
