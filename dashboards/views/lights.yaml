      - entity: input_number.flur_brightness
        name: Gespeicherte Helligkeit
      - entity: input_number.flur_color_temp
        name: Farbtemperatur (K)
      - entity: light.light_1_flur
        name: "Lampe 1"
      - entity: light.light_2_flur
        name: "Lampe 2"
      - entity: light.light_3_flur
        name: "Lampe 3"
      - entity: light.light_4_flur
