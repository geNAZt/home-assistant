      - entity: sensor.lux_buero_merja
        name: "Sensor Ist-Wert (Offset: 54 lx)"
      - entity: input_boolean.auto_light_buero_merja
        name: Automatik Aktiv
      - entity: input_boolean.force_on_buero_merja
        name: Dauer-Ein (Force On)
      - entity: input_number.buero_merja_brightness
        name: Gespeicherte Helligkeit
      - entity: input_number.buero_merja_color_temp
        name: Farbtemperatur (K)
      - entity: light.light_1_buero_merja
        name: "Lampe 1"
      - entity: light.light_2_buero_merja
        name: "Lampe 2"
