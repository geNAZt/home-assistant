triggers:
- trigger: time_pattern
  minutes: "/5"
- trigger: state
  entity_id:
    - input_boolean.cover_night_mode
    - sensor.cover_wakeup_recent
sensor:
- name: "Cover Wakeup Hour Max 3d"
  unique_id: cover_wakeup_hour_max_3d
  unit_of_measurement: 'h'
  icon: mdi:weather-sunset-up
  state: >
    {% set raw = state_attr('sensor.cover_wakeup_recent', 'off_timestamps') %}
    {% set ts_list = raw | from_json(default=[]) if raw is string else (raw if raw is iterable else []) %}
    {% set by_day = namespace(first_off={}) %}
    {% for ts_val in (ts_list | map('float', 0) | sort) %}
      {% if ts_val > 0 %}
        {% set d_str = ts_val | timestamp_custom('%Y-%m-%d', true) %}
        {% set h_dec = (ts_val | timestamp_custom('%H', true) | int) + ((ts_val | timestamp_custom('%M', true) | int) / 60.0) + ((ts_val | timestamp_custom('%S', true) | int) / 3600.0) %}
        {# Nur echte Aufsteh-Events zwischen 05:00 und 16:00 Lokalzeit zählen; frühestes 'off' pro Kalendertag gewinnt #}
        {% if 5.0 <= h_dec <= 16.0 and d_str not in by_day.first_off %}
          {% set by_day.first_off = by_day.first_off | combine({d_str: (h_dec | round(2))}) %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {% set sorted_days = by_day.first_off.keys() | list | sort %}
    {% set last3_days = sorted_days[-3:] if (sorted_days | count) > 0 else [] %}
    {% set ns = namespace(vals=[]) %}
    {% for d in last3_days %}
      {% set ns.vals = ns.vals + [by_day.first_off[d] | float(11.5)] %}
    {% endfor %}
    {# Falls heute noch geschlafen wird und es bereits später ist als das 3-Tage-Max, zieht die Live-Uhrzeit das Max nach oben #}
    {% set now_h = now().hour + (now().minute / 60.0) %}
    {% set base_max = (ns.vals | max) if (ns.vals | count) > 0 else 11.5 %}
    {% if is_state('input_boolean.cover_night_mode', 'on') and is_state('sun.sun', 'above_horizon') and 5.0 <= now_h <= 16.0 %}
      {{ [base_max, (now_h + 0.17)] | max | round(2) }}
    {% else %}
      {{ base_max | round(2) }}
    {% endif %}
  attributes:
    wakeup_time_formatted: >
      {% set h_val = states('sensor.cover_wakeup_hour_max_3d') | float(11.5) %}
      {% set hh = h_val | int %}
      {% set mm = ((h_val - hh) * 60.0) | round(0) | int %}
      {% if mm == 60 %}
        {{ '%02d:00' | format(hh + 1) }}
      {% else %}
        {{ '%02d:%02d' | format(hh, mm) }}
      {% endif %}
    daily_wakeups_last_3d: >
      {% set raw = state_attr('sensor.cover_wakeup_recent', 'off_timestamps') %}
      {% set ts_list = raw | from_json(default=[]) if raw is string else (raw if raw is iterable else []) %}
      {% set by_day = namespace(first_off={}) %}
      {% for ts_val in (ts_list | map('float', 0) | sort) %}
        {% if ts_val > 0 %}
          {% set d_str = ts_val | timestamp_custom('%Y-%m-%d', true) %}
          {% set h_dec = (ts_val | timestamp_custom('%H', true) | int) + ((ts_val | timestamp_custom('%M', true) | int) / 60.0) %}
          {% if 5.0 <= h_dec <= 16.0 and d_str not in by_day.first_off %}
            {% set hh = h_dec | int %}
            {% set mm = ((h_dec - hh) * 60.0) | round(0) | int %}
            {% set by_day.first_off = by_day.first_off | combine({d_str: ('%02d:%02d' | format(hh, mm))}) %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% set sorted_days = by_day.first_off.keys() | list | sort %}
      {% set out = namespace(d={}) %}
      {% for k in sorted_days[-3:] %}
        {% set out.d = out.d | combine({k: by_day.first_off[k]}) %}
      {% endfor %}
      {{ out.d }}

- name: "Solar Gains Forecast"
  unique_id: solar_gains_forecast
  unit_of_measurement: 'kWh'
  device_class: energy
  icon: mdi:sun-wireless
  state: >
    {% set pv_preds = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
    {% set pv_preds = pv_preds | from_json(default={}) if pv_preds is string else pv_preds %}
    {% set t0 = as_timestamp(now()) %}
    {% set t1 = t0 + 24 * 3600 %}
    {% set today_str = now().strftime('%Y-%m-%d') %}
    {% set now_h = now().hour + (now().minute / 60.0) %}
    {% set rad2deg = 57.2957795 %}
    {% set deg2rad = 0.0174532925 %}
    {% set lat = 52.355 * deg2rad %}
    {% set lon_offset_h = (9.386 * 4.0) / 60.0 %}
    {% set cloud = [ [(states('sensor.barsinghausen_hohenb_bewolkungsgrad') | float(50)) / 100.0, 0.0] | max, 1.0] | min %}
    {% set is_vacation = is_state('binary_sensor.vacation_mode', 'on') %}
    {% set is_night_now = is_state('input_boolean.cover_night_mode', 'on') %}
    {% set sun_up_now = is_state('sun.sun', 'above_horizon') %}
    {% set wakeup_max_3d_h = states('sensor.cover_wakeup_hour_max_3d') | float(11.5) %}
    {% set ns = namespace(solar_gain_kwh=0.0) %}

    {% if pv_preds is mapping %}
      {% for ts_str, pv_kwh in pv_preds.items() %}
        {% set ts = as_timestamp(ts_str) %}
        {% if ts is number and t0 <= ts < t1 and (pv_kwh | float(0)) > 0 %}
          {% set pv_val = pv_kwh | float(0) %}
          {# DST-sichere UTC-Stundenmitte direkt aus UNIX-Timestamp (unabhängig von MEZ/MESZ) #}
          {% set dt_utc = (ts + 1800) | timestamp_custom('%j', false) | int %}
          {% set fc_date = ts | timestamp_custom('%Y-%m-%d', true) %}
          {% set bucket_start_h = (ts | timestamp_custom('%H', true) | int) + ((ts | timestamp_custom('%M', true) | int) / 60.0) %}
          {% set bucket_end_h = bucket_start_h + 1.0 %}
          {% set decl = (23.45 * sin((360.0 / 365.0) * (dt_utc - 81) * deg2rad)) * deg2rad %}
          {% set hour_utc = ((ts + 1800) % 86400) / 3600.0 %}
          {% set sol_time = hour_utc + lon_offset_h %}
          {% set ha = ((sol_time - 12.0) * 15.0) * deg2rad %}
          {% set sin_ele = sin(lat) * sin(decl) + cos(lat) * cos(decl) * cos(ha) %}
          {% set sin_ele_clamped = [ [sin_ele, -1.0] | max, 1.0 ] | min %}
          {% set ele = asin(sin_ele_clamped) %}

          {% if ele > 0 %}
            {% set cos_ele = cos(ele) %}
            {% set cos_azi = (sin(decl) - sin(lat) * sin_ele_clamped) / ([cos(lat) * cos_ele, 0.001] | max) %}
            {% set cos_azi_clamped = [ [cos_azi, -1.0] | max, 1.0 ] | min %}
            {% set azi = (acos(cos_azi_clamped) * rad2deg) %}
            {% set azi = (360.0 - azi) if ha > 0 else azi %}

            {# Mehrseitiges Walmdach (12.865 kWp AC) -> äquivalente horizontale Globalstrahlung GHI #}
            {% set ghi_clear_max = 1080.0 * ([sin_ele_clamped, 0.0] | max ** 1.15) %}
            {% set ghi = [((pv_val / 12.865) * 1000.0) / 0.88, ghi_clear_max] | min %}
            {% set clearness = (ghi / ghi_clear_max) if ghi_clear_max > 10 else 0.3 %}
            {% set hour_cloud = [ [1.0 - clearness, cloud * 0.5] | max, 1.0] | min %}
            {% set h_gain = namespace(w=0.0) %}

            {# Öffnungsanteil der 5 Schlaf-Rolläden anhand des echten 3-Tage-Max der Aufstehzeit (bzw. 1.0 falls heute schon wach) #}
            {% if is_vacation or (fc_date == today_str and (not is_night_now) and sun_up_now) %}
              {% set sleep_group_open_factor = 1.0 %}
            {% elif fc_date == today_str and is_night_now and sun_up_now %}
              {% set eff_wake_h = [wakeup_max_3d_h, now_h + 0.17] | max %}
              {% set sleep_group_open_factor = [ [bucket_end_h - eff_wake_h, 0.0] | max, 1.0 ] | min %}
            {% else %}
              {% set sleep_group_open_factor = [ [bucket_end_h - wakeup_max_3d_h, 0.0] | max, 1.0 ] | min %}
            {% endif %}

            [[% set azi_map = {'south': 180, 'east': 90, 'west': 270, 'north': 0} %]]
            [[% for room in rooms %]]
              [[% for window in room.windows %]]
                [[% set target_azi = azi_map[window.direction] %]]
                [[% set w_area = (window.area.height * window.area.width) | round(4) %]]
                [[% set open_sunrise = 'true' if window.open_at_sunrise else 'false' %]]
                [[% set base_s_factor = 0.15 %]]
                [[% if window.shading %]]
                  [[% for shade in window.shading %]]
                    [[% if shade.factor %]] [[% set base_s_factor = shade.factor %]] [[% endif %]]
                  [[% endfor %]]
                [[% endif %]]
                {% set win_open_factor = 1.0 if [[ open_sunrise ]] else sleep_group_open_factor %}
                {% if win_open_factor > 0 %}
                  {% set s_factor = [[ base_s_factor ]] + (1.0 - [[ base_s_factor ]]) * hour_cloud %}
                  {% set dhi = ghi * s_factor %}
                  {% set dni = [(ghi * (1.0 - s_factor)) / ([sin_ele_clamped, 0.08] | max), 950.0] | min %}
                  {% set g_diff = [[ window.g ]] * 0.87 %}
                  {% set rel_azi = ((azi - [[ target_azi ]] + 180) % 360 - 180) %}
                  {% set diffuse_factor = 1.0 %}
                  {% set direct_w_m2 = 0.0 %}

                  {% if (rel_azi | abs) < 90 %}
                    {% set cos_f = ((azi - [[ target_azi ]]) * deg2rad) | cos | abs %}
                    {% set cos_aoi = cos_ele * cos_f %}
                    {% set term = 1.0 - cos_aoi %}
                    {% set g_dir = [[ window.g ]] * (1.0 - term * term * term) %}
                    {% set tan_prof = tan(ele) / ([cos_f, 0.05] | max) %}
                    {% set df_bottom = 1.0 %}
                    {% set df_top = 1.0 %}
                    {% set df_side = 1.0 %}

                    [[% if window.shading %]]
                    [[% for shade in window.shading %]]
                      [[% if shade.direction == 'bottom' %]]
                        {% set shadow_h = [[ shade.height ]] - ([[ shade.distance ]] * tan_prof) %}
                        {% set win_top = [[ window.position.bottom + window.area.height ]] %}
                        {% set win_bottom = [[ window.position.bottom ]] %}
                        {% set sun_h = [0, win_top - [win_bottom, shadow_h]|max]|max %}
                        {% set df_bottom = [df_bottom, sun_h / [[ window.area.height ]] ] | min %}
                      [[% elif shade.direction == 'top' %]]
                        {% set shadow_h = [[ shade.height ]] - ([[ shade.distance ]] * tan_prof) %}
                        {% set win_top = [[ window.position.bottom + window.area.height ]] %}
                        {% set win_bottom = [[ window.position.bottom ]] %}
                        {% set sun_h = [0, [shadow_h, win_top]|min - win_bottom]|max %}
                        {% set cur_df_top = sun_h / [[ window.area.height ]] %}
                        {% set df_top = [df_top, cur_df_top] | min %}
                        {% set diffuse_factor = [diffuse_factor, 0.3 + 0.7 * cur_df_top] | min %}
                      [[% elif shade.direction == 'left' %]]
                        {% if rel_azi < 0 %}
                          {% set shadow_w = [[ shade.distance ]] * ((-rel_azi * deg2rad) | tan) %}
                          {% set df_side = [df_side, [0, 1 - (shadow_w / [[ window.area.width ]])] | max] | min %}
                        {% endif %}
                      [[% elif shade.direction == 'right' %]]
                        {% if rel_azi > 0 %}
                          {% set shadow_w = [[ shade.distance ]] * ((rel_azi * deg2rad) | tan) %}
                          {% set df_side = [df_side, [0, 1 - (shadow_w / [[ window.area.width ]])] | max] | min %}
                        {% endif %}
                      [[% endif %]]
                    [[% endfor %]]
                    [[% endif %]]

                    {% set sun_part = [0.0, df_top + df_bottom - 1.0] | max * df_side %}
                    {% set direct_w_m2 = dni * cos_aoi * sun_part * g_dir %}
                  {% endif %}

                  {% set diffuse_w_m2 = 0.5 * dhi * g_diff * diffuse_factor %}
                  {% set ground_w_m2 = 0.10 * ghi * g_diff * diffuse_factor %}
                  {% set h_gain.w = h_gain.w + ([[ w_area ]] * win_open_factor * (direct_w_m2 + diffuse_w_m2 + ground_w_m2)) %}
                {% endif %}
              [[% endfor %]]
            [[% endfor %]]

            {% set ns.solar_gain_kwh = ns.solar_gain_kwh + (h_gain.w / 1000.0) %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ ns.solar_gain_kwh | round(3) }}
  attributes:
    sleep_covers_wakeup_max_3d: >
      {{ state_attr('sensor.cover_wakeup_hour_max_3d', 'wakeup_time_formatted') | default('11:30') }}
    solar_gain_next_24h_kwh: >
      {{ states('sensor.solar_gains_forecast') | float(0) }}
    solar_gain_ratio_next_24h: >
      {% set pv_preds = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
      {% set pv_preds = pv_preds | from_json(default={}) if pv_preds is string else pv_preds %}
      {% set t0 = as_timestamp(now()) %}
      {% set t1 = t0 + 24 * 3600 %}
      {% set ns = namespace(pv_sum=0.0) %}
      {% if pv_preds is mapping %}
        {% for ts_str, pv_kwh in pv_preds.items() %}
          {% set ts = as_timestamp(ts_str) %}
          {% if ts is number and t0 <= ts < t1 %}
            {% set ns.pv_sum = ns.pv_sum + (pv_kwh | float(0)) %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {% set gain = states('sensor.solar_gains_forecast') | float(0) %}
      {{ ((gain / ns.pv_sum) | round(3)) if ns.pv_sum > 0 else 0.08 }}
    pv_next_24h_kwh: >
      {% set pv_preds = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
      {% set pv_preds = pv_preds | from_json(default={}) if pv_preds is string else pv_preds %}
      {% set t0 = as_timestamp(now()) %}
      {% set t1 = t0 + 24 * 3600 %}
      {% set ns = namespace(pv_sum=0.0) %}
      {% if pv_preds is mapping %}
        {% for ts_str, pv_kwh in pv_preds.items() %}
          {% set ts = as_timestamp(ts_str) %}
          {% if ts is number and t0 <= ts < t1 %}
            {% set ns.pv_sum = ns.pv_sum + (pv_kwh | float(0)) %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.pv_sum | round(3) }}
