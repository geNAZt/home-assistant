sensor:
- name: "Solar Gain [[ room | capitalize ]]"
  unique_id: solar_gain_[[ room ]]
  unit_of_measurement: 'W'
  device_class: power
  state_class: measurement
  state: >
    {% set rad_poa = states('input_number.solar_irradiance') | float(0) %}
    {% set dwd_ghi = states('sensor.barsinghausen_hohenb_sonneneinstrahlung') | float(-1) %}
    {% set t_out = states('sensor.outside_temperature') | float(10) %}
    {% set ele = state_attr('sun.sun', 'elevation') | float(0) %}
    {% set azi = state_attr('sun.sun', 'azimuth') | float(0) %}
    {% set cloud = [ [(states('sensor.barsinghausen_hohenb_bewolkungsgrad') | float(50)) / 100.0, 0.0] | max, 1.0] | min %}
    {% set ns = namespace(total=0.0) %}

    {% if ele > 0 %}
      {% set deg2rad = 0.0174532925 %}
      {% set sin_ele = (ele * deg2rad) | sin %}
      {% set cos_ele = (ele * deg2rad) | cos %}
      {# Dach-POA (Peak-Modul ~25° Neigung + Zelltemperatur-Effekt) sauber auf horizontale Globalstrahlung (GHI) umrechnen #}
      {% set t_cell = t_out + 0.025 * rad_poa %}
      {% set temp_corr = [ [1.0 + 0.0035 * (25.0 - t_cell), 0.85] | max, 1.15] | min %}
      {% set sin_poa = (([ele + 25.0, 88.0] | min) * deg2rad) | sin %}
      {% set s_cloud = 0.15 + 0.85 * cloud %}
      {% set poa_to_ghi = (1.0 - s_cloud) * ([sin_ele, 0.05] | max / [sin_poa, 0.15] | max) + s_cloud * 0.95 %}
      {% set ghi_clear_max = 1080.0 * ([sin_ele, 0.0] | max ** 1.15) %}
      {% if rad_poa > 0 %}
        {% set ghi = [(rad_poa / temp_corr) * poa_to_ghi, ghi_clear_max] | min %}
      {% elif dwd_ghi >= 0 %}
        {% set ghi = [dwd_ghi, ghi_clear_max] | min %}
      {% else %}
        {% set ghi = 0.0 %}
      {% endif %}

      [[% set azi_map = {'south': 180, 'east': 90, 'west': 270, 'north': 0} %]]
      [[% for window in windows %]]
      [[% set w_area = (window.area.height * window.area.width) | round(4) %]]
      [[% set target_azi = azi_map[window.direction] %]]
      [[% set base_s_factor = 0.15 %]]
      [[% if window.shading %]]
        [[% for shade in window.shading %]]
          [[% if shade.factor %]] [[% set base_s_factor = shade.factor %]] [[% endif %]]
        [[% endfor %]]
      [[% endif %]]

      {% set pos = [ [state_attr('[[ window.cover ]]', 'current_position') | float(100) / 100.0, 0.0] | max, 1.0] | min %}
      {% set s_factor = [[ base_s_factor ]] + (1.0 - [[ base_s_factor ]]) * cloud %}
      {% set dhi = ghi * s_factor %}
      {% set dni = [(ghi * (1.0 - s_factor)) / ([sin_ele, 0.08] | max), 950.0] | min %}
      {% set g_diff = [[ window.g ]] * 0.87 %}
      {% set rel_azi = ((azi - [[ target_azi ]] + 180) % 360 - 180) %}
      {% set diffuse_factor = 1.0 %}
      {% set direct_w_m2 = 0.0 %}

      {% if (rel_azi | abs) < 90 %}
        {% set cos_factor = ((azi - [[ target_azi ]]) * deg2rad) | cos | abs %}
        {% set cos_aoi = cos_ele * cos_factor %}
        {% set term = 1.0 - cos_aoi %}
        {% set g_dir = [[ window.g ]] * (1.0 - term * term * term) %}
        {% set df_bottom = 1.0 %}
        {% set df_top = 1.0 %}
        {% set df_side = 1.0 %}
        {% set tan_prof = ((ele * deg2rad) | tan) / ([cos_factor, 0.05] | max) %}
        [[% if window.shading %]]
        [[% for shade in window.shading %]]
          [[% if shade.direction == 'bottom' %]]
            {% set shadow_h = [[ shade.height ]] - ([[ shade.distance ]] * tan_prof) %}
            {% set win_top = [[ window.position.bottom + window.area.height ]] %}
            {% set win_bottom = [[ window.position.bottom ]] %}
            {% set sun_h = [0, win_top - [win_bottom, shadow_h]|max]|max %}
            {% set df_bottom = [df_bottom, sun_h / [[ window.area.height ]] ] | min %}
          [[% elif shade.direction == 'top' %]]
            {% set shadow_h = [[ shade.height ]] - ([[ shade.distance ]] * tan_prof) %}
            {% set win_top = [[ window.position.bottom + window.area.height ]] %}
            {% set win_bottom = [[ window.position.bottom ]] %}
            {% set sun_h = [0, [shadow_h, win_top]|min - win_bottom]|max %}
            {% set cur_df_top = sun_h / [[ window.area.height ]] %}
            {% set df_top = [df_top, cur_df_top] | min %}
            {% set diffuse_factor = [diffuse_factor, 0.3 + 0.7 * cur_df_top] | min %}
          [[% elif shade.direction == 'left' %]]
            {% if rel_azi < 0 %}
              {% set shadow_w = [[ shade.distance ]] * ((-rel_azi * deg2rad) | tan) %}
              {% set df_side = [df_side, [0, 1 - (shadow_w / [[ window.area.width ]])] | max] | min %}
            {% endif %}
          [[% elif shade.direction == 'right' %]]
            {% if rel_azi > 0 %}
              {% set shadow_w = [[ shade.distance ]] * ((rel_azi * deg2rad) | tan) %}
              {% set df_side = [df_side, [0, 1 - (shadow_w / [[ window.area.width ]])] | max] | min %}
            {% endif %}
          [[% endif %]]
        [[% endfor %]]
        [[% endif %]]

        {% set sun_part = [0, [pos, df_top]|min + df_bottom - 1]|max * df_side %}
        {% set direct_w_m2 = dni * cos_aoi * sun_part * g_dir %}
      {% endif %}

      {% set diffuse_w_m2 = 0.5 * dhi * pos * g_diff * diffuse_factor %}
      {% set ground_w_m2 = 0.10 * ghi * pos * g_diff * diffuse_factor %}
      {% set ns.total = ns.total + ([[ w_area ]] * (direct_w_m2 + diffuse_w_m2 + ground_w_m2)) %}
      [[% endfor %]]
    {% endif %}
    {{ ns.total | round(0) }}

[[% for window in windows %]]
[[% set w_area = (window.area.height * window.area.width) | round(4) %]]
[[% set azi_map = {'south': 180, 'east': 90, 'west': 270, 'north': 0} %]]
[[% set target_azi = azi_map[window.direction] %]]
[[% set cov_id = window.cover.split('.')[1] %]]
[[% set base_s_factor = 0.15 %]]
[[% if window.shading %]]
[[% for shade in window.shading %]]
[[% if shade.factor %]][[% set base_s_factor = shade.factor %]][[% endif %]]
[[% endfor %]]
[[% endif %]]
- name: "Solar Gain [[ cov_id | replace('_', ' ') | title ]]"
  unique_id: solar_gain_[[ cov_id ]]
  unit_of_measurement: 'W'
  device_class: power
  state_class: measurement
  state: >
    {% set rad_poa = states('input_number.solar_irradiance') | float(0) %}
    {% set dwd_ghi = states('sensor.barsinghausen_hohenb_sonneneinstrahlung') | float(-1) %}
    {% set t_out = states('sensor.outside_temperature') | float(10) %}
