      {% set temp_corr = [ [1.0 + 0.0035 * (25.0 - t_cell), 0.85] | max, 1.15] | min %}
      {% set sin_poa = (([ele + 25.0, 88.0] | min) * deg2rad) | sin %}
      {% set s_cloud = 0.15 + 0.85 * cloud %}
      {% set poa_to_ghi = (1.0 - s_cloud) * ([sin_ele, 0.05] | max / [sin_poa, 0.15] | max) + s_cloud * 0.95 %}
      {% set ghi_clear_max = 1080.0 * ([sin_ele, 0.0] | max ** 1.15) %}
      {% if rad_poa > 0 %}
        {% set ghi = [(rad_poa / temp_corr) * poa_to_ghi, ghi_clear_max] | min %}
      {% elif dwd_ghi >= 0 %}
        {% set ghi = [dwd_ghi, ghi_clear_max] | min %}
