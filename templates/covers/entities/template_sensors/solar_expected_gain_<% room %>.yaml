      {% set g_dir = [[ window.g ]] * g_modifier %}
      {% set g_diff = [[ window.g ]] * 0.87 %}
      
      {# Bewölkungsabhängiger Diffusanteil #}
      {% set s_factor = [[ base_s_factor ]] + (1.0 - [[ base_s_factor ]]) * cloud %}
      
      {% set direct_factor = 1.0 %}
      [[% if window.shading %]]
