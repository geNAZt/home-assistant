            {% set direct_factor = [direct_factor, [0, 1 - (shadow_w / [[ window.area.width ]])] | max] | min %}
          {% endif %}
        [[% elif shade.direction == 'right' %]]
          {% if rel_azi > 0 %}
            {% set shadow_w = [[ shade.distance ]] * ((rel_azi * 0.0174532925) | tan) %}
            {% set direct_factor = [direct_factor, [0, 1 - (shadow_w / [[ window.area.width ]])] | max] | min %}
          {% endif %}
        [[% endif %]]
      [[% endfor %]]
      [[% endif %]]

      {% set sun_part = [pos, direct_factor]|min %}
      
      {# Gesamtleistung inkl. Direkt-, Diffus- und Bodenreflexionsanteil #}
      {% set direct_part_gain = sun_part * (1.0 - s_factor) * g_dir %}
      {% set diffuse_part_gain = pos * s_factor * g_diff %}
      {% set ground_ref_gain = 0.10 * pos * g_diff %}
      
      {% set total_gain_factor = cos_factor * (direct_part_gain + diffuse_part_gain) + ground_ref_gain %}
      {% set ns.total = ns.total + ([[ w_area ]] * rad * total_gain_factor) %}
    {% endif %}

    {{ ns.total | round(0) }}
[[% endfor %]]