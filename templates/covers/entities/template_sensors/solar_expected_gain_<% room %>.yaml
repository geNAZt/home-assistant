sensor:
- name: "Solar Expected Gain [[ room | capitalize ]]"
  unique_id: solar_expected_gain_[[ room ]]
  unit_of_measurement: 'W'
  device_class: power
  state_class: measurement
  state: >
    {% set rad = states('sensor.barsinghausen_hohenb_sonneneinstrahlung') | float(0) %}
    {% set ele = state_attr('sun.sun', 'elevation') | float(0) %}
    {% set azi = state_attr('sun.sun', 'azimuth') | float(0) %}
    {% set cloud = (states('sensor.barsinghausen_hohenb_bewolkungsgrad') | float(0)) / 100 %}
    {% set ns = namespace(total=0) %}

    [[% for window in windows %]]
    [[% set w_area = (window.area.height * window.area.width) | round(4) %]]
    [[% set azi_map = {'south': 180, 'east': 90, 'west': 270, 'north': 0} %]]
    [[% set target_azi = azi_map[window.direction] %]]
    
    [[% set base_s_factor = 0.15 %]]
    [[% if window.shading %]]
      [[% for shade in window.shading %]]
        [[% if shade.factor %]] [[% set base_s_factor = shade.factor %]] [[% endif %]]
      [[% endfor %]]
    [[% endif %]]
      
    {% if ele > 0 and ((azi - [[ target_azi ]] + 180) % 360 - 180) | abs < 90 %}
      {% set pos = 1.0 %}
      
      {# Manuelle Umrechnung von Grad in Bogenmaß: Grad * (Pi / 180) #}
      {% set cos_factor = ((azi - [[ target_azi ]]) * 0.0174532925) | cos | abs %}
      {% set rel_azi = ((azi - [[ target_azi ]] + 180) % 360 - 180) %}
      
      {# Glazingeigenschaften mit Winkelabhängigkeit (Karlsson & Roos Modell für Dreifachverglasung) #}
      {% set cos_aoi = ((ele * 0.0174532925) | cos) * cos_factor %}
      {% set term = 1.0 - cos_aoi %}
      {% set g_modifier = 1.0 - term * term * term %}
      {% set g_dir = [[ window.g ]] * g_modifier %}
      {% set g_diff = [[ window.g ]] * 0.87 %}
      
      {# Bewölkungsabhängiger Diffusanteil #}
      {% set s_factor = [[ base_s_factor ]] + (1.0 - [[ base_s_factor ]]) * cloud %}
      
      {% set direct_factor = 1.0 %}
      [[% if window.shading %]]
      [[% for shade in window.shading %]]
        [[% if shade.direction == 'bottom' %]]
          {# Hier berechnen wir die kontinuierliche Verschattung von unten #}
          {% set shadow_h = [[ shade.height ]] - ([[ shade.distance ]] * ((ele * 0.0174532925) | tan)) %}
          {% set win_top = [[ window.position.bottom + window.area.height ]] %}
          {% set win_bottom = [[ window.position.bottom ]] %}
          {% set sun_h = [0, win_top - [win_bottom, shadow_h]|max]|max %}
          {% set direct_factor = [direct_factor, sun_h / [[ window.area.height ]]] | min %}
        [[% elif shade.direction == 'top' %]]
          {# Hier nutzen wir ebenfalls die manuelle Umrechnung und den tan-Filter #}
          {% set shadow_h = [[ shade.height ]] - ([[ shade.distance ]] * ((ele * 0.0174532925) | tan)) %}
          {% set win_top = [[ window.position.bottom + window.area.height ]] %}
          {% set win_bottom = [[ window.position.bottom ]] %}
          {% set sun_h = [0, [shadow_h, win_top]|min - win_bottom]|max %}
          {% set direct_factor = [direct_factor, sun_h / [[ window.area.height ]]] | min %}
        [[% elif shade.direction == 'left' %]]
          {% if rel_azi < 0 %}
            {% set shadow_w = [[ shade.distance ]] * ((-rel_azi * 0.0174532925) | tan) %}
            {% set direct_factor = [direct_factor, [0, 1 - (shadow_w / [[ window.area.width ]])] | max] | min %}
          {% endif %}
        [[% elif shade.direction == 'right' %]]
          {% if rel_azi > 0 %}
            {% set shadow_w = [[ shade.distance ]] * ((rel_azi * 0.0174532925) | tan) %}
            {% set direct_factor = [direct_factor, [0, 1 - (shadow_w / [[ window.area.width ]])] | max] | min %}
          {% endif %}
        [[% endif %]]
      [[% endfor %]]
      [[% endif %]]

      {% set sun_part = [pos, direct_factor]|min %}
      
      {# Gesamtleistung inkl. Direkt-, Diffus- und Bodenreflexionsanteil #}
      {% set direct_part_gain = sun_part * (1.0 - s_factor) * g_dir %}
      {% set diffuse_part_gain = pos * s_factor * g_diff %}
      {% set ground_ref_gain = 0.10 * pos * g_diff %}
      
      {% set total_gain_factor = cos_factor * (direct_part_gain + diffuse_part_gain) + ground_ref_gain %}
      {% set ns.total = ns.total + ([[ w_area ]] * rad * total_gain_factor) %}
    {% endif %}

    [[% endfor %]]
    {{ ns.total | round(0) }}

[[% for window in windows %]]
[[% set w_area = (window.area.height * window.area.width) | round(4) %]]
[[% set azi_map = {'south': 180, 'east': 90, 'west': 270, 'north': 0} %]]
[[% set target_azi = azi_map[window.direction] %]]
[[% set cov_id = window.cover.split('.')[1] %]]
[[% set base_s_factor = 0.15 %]]
[[% if window.shading %]]
  [[% for shade in window.shading %]]
    [[% if shade.factor %]] [[% set base_s_factor = shade.factor %]] [[% endif %]]
  [[% endfor %]]
[[% endif %]]
- name: "Solar Expected Gain [[ cov_id | replace('_', ' ') | title ]]"
