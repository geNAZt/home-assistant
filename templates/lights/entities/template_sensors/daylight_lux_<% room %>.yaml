sensor:
- name: "Lux [[ room | replace('_', ' ') | title ]] Daylight"
  unique_id: lux_[[room]]_daylight
  unit_of_measurement: "lx"
  device_class: illuminance
  state_class: measurement
  state: >-
    {% set raw_lux = states('sensor.lux_[[room]]') %}
    {% if raw_lux in ['unknown', 'unavailable', 'None', ''] or raw_lux is none %}
      unknown
    {% else %}
      {% set raw_float = raw_lux | float(0) %}
      {% set is_light_on = is_state('light.[[room]]_lights', 'on') %}
      {% set lamp_offset = [[ light_lux_offset | default(40) ]] | float %}
      {% if is_light_on %}
        {% set brightness = state_attr('light.[[room]]_lights', 'brightness') %}
        {% set ratio = (brightness | float(255) / 255.0) if brightness is not none else 1.0 %}
        {% set artificial_lux = lamp_offset * ratio %}
        {{ [0.0, (raw_float - artificial_lux)] | max | round(1) }}
      {% else %}
        {{ raw_float | round(1) }}
      {% endif %}
    {% endif %}
  availability: >-
    {{ states('sensor.lux_[[room]]') not in ['unknown', 'unavailable', 'None', ''] }}
