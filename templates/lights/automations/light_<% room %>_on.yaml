- alias: [[room]] licht automatisch AN
  id: auto_light_[[room]]_on
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.presence_[[room]]
      to: "on"
    - platform: numeric_state
      entity_id: sensor.lux_[[room]]
      below: [[ waterLow | default(140) ]]           # waterLowLux
      for: "00:00:05"
    - platform: state
      entity_id: input_boolean.auto_light_[[room]]
      to: "on"

  condition:
    # Automatik muss an sein
    - condition: state
      entity_id: input_boolean.auto_light_[[room]]
      state: "on"

    # Präsenz notwendig
    - condition: state
      entity_id: binary_sensor.presence_[[room]]
      state: "on"

    # Lux muss UNTER effektivem waterLow Threshold sein (250 Lux wenn Cover Daylight Protection aktiv ist, sonst normal waterLow)
    - condition: template
      value_template: >-
        {% set base_water_low = [[ waterLow | default(140) ]] %}
        {% set prot_entities = states.input_boolean | selectattr('entity_id', 'search', 'cover_daylight_protection_.*' ~ '[[ room ]]') | selectattr('state', 'eq', 'on') | list %}
        {% set is_daylight_prot = prot_entities | length > 0 %}
        {% set effective_water_low = 250 if is_daylight_prot else base_water_low %}
        {{ (states('sensor.lux_[[room]]') | float(0)) < effective_water_low }}

    # Licht nur einschalten, wenn es wirklich aus ist
    - condition: state
      entity_id: light.[[room]]_lights
      state: "off"

    # ForceOn darf nicht aktiv sein
    - condition: state
      entity_id: input_boolean.force_on_[[room]]
      state: "off"

  action:
    - variables:
        saved_brightness: "{{ states('input_number.[[room]]_brightness') | int(0) }}"
        brightness: >
          {{ 255 if saved_brightness == 0 else ([saved_brightness, 255] | min) }}
        color_temp: "{{ states('input_number.[[room]]_color_temp') | int(370) }}"
    - service: light.turn_on
      target:
        entity_id: light.[[room]]_lights
      data:
        brightness: "{{ brightness }}"
        color_temp_kelvin: "{{ color_temp }}"
