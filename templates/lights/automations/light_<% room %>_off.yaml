- alias: [[room]] licht automatisch AUS
  id: auto_light_[[room]]_off
  mode: restart
  trigger:
    # Präsenz weg
    - platform: state
      entity_id: binary_sensor.presence_[[room]]
      to: "off"
      id: presence_off
  
    # Zu hell geworden (reines Tageslicht reicht wieder aus)
    - platform: numeric_state
      entity_id: sensor.lux_[[room]]_daylight
      above: [[ waterHigh | default(100) ]]       # waterHighLux
      for: "00:00:10"
      id: too_bright

    # Regelmäßige Prüfung, falls der Schwellenwert ohne Flankenübergang überschritten bleibt
    - platform: time_pattern
      minutes: "/2"
      id: too_bright
  
  condition:
    # Automatik muss an sein
    - condition: state
      entity_id: input_boolean.auto_light_[[room]]
      state: "on"
  
    # ForceOn darf nicht aktiv sein
    - condition: state
      entity_id: input_boolean.force_on_[[room]]
      state: "off"
  
  action:
    - choose:
        # Fall 1: Präsenz weg -> immer aus
        - conditions:
            - condition: trigger
              id: presence_off
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.[[room]]_lights
  
        # Fall 2: Zu hell, aber nur wenn jemand da und Licht wirklich an
        - conditions:
            - condition: trigger
              id: too_bright
            - condition: state
              entity_id: binary_sensor.presence_[[room]]
              state: "on"
            - condition: state
              entity_id: light.[[room]]_lights
              state: "on"
            - condition: template
              value_template: >-
                {% set base_water_high = [[ waterHigh | default(100) ]] %}
                [[% if room == 'flur' %]]
                {% set prot_entities = states.input_boolean | selectattr('entity_id', 'search', 'cover_daylight_protection_.*(flur|hwr)') | selectattr('state', 'eq', 'on') | list %}
                [[% else %]]
                {% set prot_entities = states.input_boolean | selectattr('entity_id', 'search', 'cover_daylight_protection_.*' ~ '[[ room ]]') | selectattr('state', 'eq', 'on') | list %}
                [[% endif %]]
                {% set is_daylight_prot = prot_entities | length > 0 %}
                {% set effective_water_high = 275 if is_daylight_prot else base_water_high %}
                {{ (states('sensor.lux_[[room]]_daylight') | float(0)) >= effective_water_high }}
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.[[room]]_lights
