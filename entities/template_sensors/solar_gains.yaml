triggers:
- trigger: time_pattern
  minutes: "/1"  # Evaluates and updates exactly once per minute
sensor:
  # --- SUMMEN-SENSOR (Korrigiert) ---
  - name: "Solar Gains"
    unique_id: solar_gains
    unit_of_measurement: 'W'
    device_class: power
    state_class: measurement
    state: >
      {% set room_sensors = [
        'sensor.solar_gain_bad',
        'sensor.solar_gain_buero_fabian',
        'sensor.solar_gain_buero_merja',
        'sensor.solar_gain_hwr',
        'sensor.solar_gain_kueche',
        'sensor.solar_gain_schlafzimmer',
        'sensor.solar_gain_speisekammer',
        'sensor.solar_gain_wohnzimmer'
      ] %}
      {% set gains = room_sensors | map('states') | map('float', 0) | sum %}
      {{ gains | round(0) }}

