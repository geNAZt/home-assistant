trigger:
  - platform: time_pattern
    seconds: "/30"
sensor:
  - name: "Heating Energy Debt Tracker"
    unique_id: heating_energy_debt_tracker
    unit_of_measurement: 'Wh'
    device_class: energy
    state: >
      {% set c_wh_k = states('input_number.building_heat_capacity') | float(13.28) * 1000 %}
      {% set t_in = states('sensor.inside_temp_mean_now') | float(none) %}
      {% set weights = {
        'wohnzimmer': 11.9,
        'kueche': 19.5,
        'flur': 29.0,
        'schlafzimmer': 9.1,
        'buero_fabian': 6.6,
        'buero_merja': 13.9,
        'bad': 4.9,
        'speisekammer': 5.1
      } %}
      {% set ns = namespace(w_sum=0.0, w_total=0.0) %}
      {% for room, w in weights.items() %}
        {% set val = states('input_number.heating_base_' ~ room) | float(none) %}
        {% if val is not none %}
          {% set ns.w_sum = ns.w_sum + (val * w) %}
          {% set ns.w_total = ns.w_total + w %}
        {% endif %}
      {% endfor %}
      {% set t_sp = (ns.w_sum / ns.w_total) if ns.w_total > 0 else none %}

      {% if t_in is not none and t_sp is not none %}
        {% if (t_in - t_sp) | abs <= 0.05 %}
          0.0
        {% else %}
          {{ ((t_in - t_sp) * c_wh_k) | round(2) }}
        {% endif %}
      {% else %}
        0.0
      {% endif %}
    attributes:
      current_net_w: "{{ states('sensor.heating_net_balance') }}"
      expected_temp_change_deg_per_h: >
        {% set net_w = states('sensor.heating_net_balance') | float(0) %}
        {% set c_wh_k = states('input_number.building_heat_capacity') | float(13.28) * 1000 %}
        {{ (net_w / c_wh_k) | round(4) if c_wh_k > 0 else 0.0 }}
      estimated_bridge_autonomy_hours: >
        {% set losses_w = (states('sensor.h_kw_per_k_effective') | float(0) * 1000 * states('sensor.deltaT') | float(0)) %}
        {% set stored_wh = states('sensor.heating_energy_debt_tracker') | float(0) %}
        {{ (stored_wh / losses_w) | round(1) if losses_w > 0 and stored_wh > 0 else 0.0 }}
      building_heat_capacity_kwh_k: "{{ states('input_number.building_heat_capacity') }}"
      mean_setpoint: >
        {% set weights = {
          'wohnzimmer': 11.9,
          'kueche': 19.5,
          'flur': 29.0,
          'schlafzimmer': 9.1,
          'buero_fabian': 6.6,
          'buero_merja': 13.9,
          'bad': 4.9,
          'speisekammer': 5.1
        } %}
        {% set ns = namespace(w_sum=0.0, w_total=0.0) %}
        {% for room, w in weights.items() %}
          {% set val = states('input_number.heating_base_' ~ room) | float(none) %}
          {% if val is not none %}
            {% set ns.w_sum = ns.w_sum + (val * w) %}
            {% set ns.w_total = ns.w_total + w %}
          {% endif %}
        {% endfor %}
        {{ (ns.w_sum / ns.w_total) | round(2) if ns.w_total > 0 else 0 }}
      mean_inside_temp: "{{ states('sensor.inside_temp_mean_now') }}"
      status: >
        {% set net = states('sensor.heating_net_balance') | float(0) %}
        {% if net > 50 %}
          Konto wird geladen (Heizung/Sonne > Verlust)
        {% elif net < -50 %}
          Konto sinkt (Verlust > Gewinne)
        {% else %}
          Energetisches Gleichgewicht
        {% endif %}
