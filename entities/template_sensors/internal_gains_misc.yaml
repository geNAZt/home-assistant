sensor:
- name: "Internal Gains Misc"
  unique_id: internal_gains_misc
  unit_of_measurement: 'W'
  device_class: power
  state_class: measurement
  state: >
    {% set total_load = states('sensor.solar_house_consumption_w') | float(0) %}

    {# Energie die bereits über dedizierte internal_gains_* Sensoren (inkl. internal_gains_lights) bilanziert wurde #}
    {% set gain_consumes = states.sensor
              | selectattr('entity_id', 'match', 'sensor.internal_gains_') | expand
              | selectattr('attributes.consumes', 'defined') | map(attribute='attributes.consumes')
              | map('float', 0) | list | sum %}

    {# Heizung & Außenverbraucher separat abziehen #}
    {% set ir_heating_w = states('sensor.heating_power') | float(0) %}
    {% set outside_kitchen_w = states('sensor.kuche_aussen_power') | float(0) %}

    {# Kochendwasser-Boiler: Nachheizspitzen (>45 W) gehen überwiegend als heißes Zapfwasser/Abfluss raus (~75% Abzug),
       während der ~40 W Bereitschaftsverlust zu 100% in der Küche verbleibt #}
    {% set boiler_w = states('sensor.boiler_trinkwasser_leistung') | float(0) %}
    {% set boiler_water_drain_w = [boiler_w - 45.0, 0.0] | max * 0.75 %}

    {# IT/Netzwerk inkl. 6800XT LLM-Server + dauerhaft aktiver KNX-Bus/Aktoren sind zu 100% trockene, sensible Ohmsche Abwärme im Haus #}
    {% set network_w = [states('sensor.network_power') | float(0), 0.0] | max %}
    {% set knx_w = [states('sensor.knx_leistung') | float(0), 0.0] | max %}
    {% set ohmic_fixed_w = network_w + knx_w %}

    {% set raw_remaining = [total_load - gain_consumes - ir_heating_w - outside_kitchen_w - boiler_water_drain_w, 0.0] | max %}
    {% set ohmic_in_rem = [ohmic_fixed_w, raw_remaining] | min %}
    {% set other_diffuse = [raw_remaining - ohmic_in_rem, 0.0] | max %}

    {# Übriger Haushaltsrest (Kochen/Wasserdampf, Außenlicht, Warmwasser-Kleingeräte): 70% sensibler Raumwärmeanteil #}
    {{ (ohmic_in_rem + (other_diffuse * 0.70)) | round(1) }}
  attributes:
    network_100pct_w: "{{ [states('sensor.network_power') | float(0), 0.0] | max | round(1) }}"
    knx_100pct_w: "{{ [states('sensor.knx_leistung') | float(0), 0.0] | max | round(1) }}"
    bill: >
      {% set total = states('sensor.solar_house_consumption_w') | float(0) %}
      {% set gains = states.sensor
              | selectattr('entity_id', 'match', 'sensor.internal_gains_')
              | selectattr('attributes.consumes', 'defined')
              | list %}
      {% set gain_sum = gains | map(attribute='attributes.consumes') | map('float', 0) | sum %}
      {% set ir_w = states('sensor.heating_power') | float(0) %}
      {% set out_w = states('sensor.kuche_aussen_power') | float(0) %}
      {% set boiler_drain = [states('sensor.boiler_trinkwasser_leistung') | float(0) - 45.0, 0.0] | max * 0.75 %}
      {% set net_w = [states('sensor.network_power') | float(0), 0.0] | max %}
      {% set knx_w = [states('sensor.knx_leistung') | float(0), 0.0] | max %}
      {% set raw_rem = [total - gain_sum - ir_w - out_w - boiler_drain, 0.0] | max %}
      {% set ohmic_in = [net_w + knx_w, raw_rem] | min %}
      {% set other_rem = [raw_rem - ohmic_in, 0.0] | max %}

      Total House: {{ total | round(1) }} W
      ---
      {% for gain in gains %}
      {{ gain.name }}: -{{ gain.attributes.consumes }} W
      {% endfor %}
      IR-Heating: -{{ ir_w | round(1) }} W
      Küche-Außen: -{{ out_w | round(1) }} W
      Boiler-Zapfwasser: -{{ boiler_drain | round(1) }} W
      ---
      Network/LLM + KNX (100%): {{ ohmic_in | round(1) }} W ({{ net_w | round(1) }} W + {{ knx_w | round(1) }} W)
      Haushaltsrest (70% von {{ other_rem | round(1) }} W): {{ (other_rem * 0.70) | round(1) }} W
      Result Misc: {{ (ohmic_in + other_rem * 0.70) | round(1) }} W
