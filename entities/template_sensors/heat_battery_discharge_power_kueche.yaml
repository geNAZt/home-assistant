triggers:
- trigger: time_pattern
  minutes: "/1"
sensor:
- name: "Heat Battery Discharge Power kueche"
  unique_id: heat_battery_discharge_power_kueche
  unit_of_measurement: "W"
  device_class: power
  state_class: measurement
  state: >
    {% set h_an = is_state('switch.heating_kueche', 'on') %}
    {% set sw_obj = states.switch['heating_kueche'] if states.switch['heating_kueche'] is defined else none %}
    {% set minutes_since_off = ((now() - sw_obj.last_changed).total_seconds() / 60.0) if (sw_obj is not none and sw_obj.last_changed is not none) else 999.0 %}

    {% set t_boden = states('sensor.floor_temperature_kueche_mean') | float(states('sensor.security_temperature_kueche_max') | float(0)) %}
    {% set t_luft = states('sensor.temperature_kueche_mean') | float(0) %}
    {% set area = 26.52 %}
    {# Laminat (R_B ≈ 0.092 m²K/W inkl. Trittschall/Überdeckung) + Wärmeübergang nach oben (R_si = 0.093 m²K/W, alpha = 10.8 W/m²K) => U = 1 / 0.185 = 5.4 W/(m²K) #}
    {% set ubergang_koeff = 5.4 %}

    {# Während aktivem Laden (Heizmatte an) oder 10-Minuten-Fühlerentspannung keine Netto-Entladung ausweisen #}
    {% if not h_an and minutes_since_off > 10 and t_boden > 0 and t_luft > 0 %}
      {% set delta_t = t_boden - t_luft %}
      {{ [0, (delta_t * area * ubergang_koeff)] | max | round(0) }}
    {% else %}
      0
    {% endif %}
