sensor:
- name: "Heating Preheat Offset Dynamic Uncapped"
  unit_of_measurement: "K"
  availability: >
    {% set rooms = states.input_number
        | selectattr('entity_id', 'match', 'input_number.heating_base_')
        | map(attribute='state') | list %}
    {{ states('sensor.H_kW_per_K_effective') | is_number
       and states('input_number.building_heat_capacity') | is_number
       and (rooms | count > 0)
       and (rooms | select('is_number') | list | count == rooms | count) }}
  state: >
    {% set h_eff = states('sensor.H_kW_per_K_effective') | float(0.08) %}
    {% set c_real = states('input_number.building_heat_capacity') | float(13.28) %}
    {% set rooms = states.input_number
                | selectattr('entity_id', 'match', 'input_number.heating_base_')
                | map(attribute='state') | map('float') | list %}
    {% set t_sp_mean = (rooms | sum / rooms | count) if rooms | count > 0 else 21.0 %}
    {% set t_out_fc = states('input_number.outside_temp_forecast_24h_c') | float(states('sensor.outside_temperature') | float(0)) %}
    {% set delta_t = [t_sp_mean - t_out_fc, 0] | max %}
    {% set hours_to_bridge = 19 %}
    {% set total_energy_loss = h_eff * delta_t * hours_to_bridge %}
    
    {# Prefer next-day PV forecast if available, fallback to 24h moving average #}
    {% set pv_budget = state_attr('sensor.pv_priority_next_day_budget', 'pv_next_24h_kwh') | float(none) %}
    {% if pv_budget is not none and pv_budget > 0 %}
      {% set solar_gains_kwh = pv_budget * 0.40 %}
    {% else %}
      {% set solar_gains_kwh = (states('sensor.solar_gains_average') | float(0) * hours_to_bridge) / 1000 %}
    {% endif %}
    
    {% set internal_gains_kwh = (states('sensor.internal_gains_average') | float(0) * hours_to_bridge) / 1000 %}
    {% set total_gains_kwh = solar_gains_kwh + internal_gains_kwh %}
    {% set needed_offset = (total_energy_loss - total_gains_kwh) / c_real %}
    {{ needed_offset | round(1) }}
  attributes:
    forecast_outside_temp: "{{ states('input_number.outside_temp_forecast_24h_c') }}"
    forecast_loss_kwh: "{{ (states('sensor.H_kW_per_K_effective') | float(0.08) * [((states.input_number | selectattr('entity_id', 'match', 'input_number.heating_base_') | map(attribute='state') | map('float') | list | sum / 8) - (states('input_number.outside_temp_forecast_24h_c') | float(0))), 0] | max * 19) | round(2) }}"
    forecast_gains_kwh: "{{ (((states('sensor.solar_gains_average') | float(0)) + (states('sensor.internal_gains_average') | float(0))) * 19 / 1000) | round(2) }}"
- name: "Heating Preheat Offset Dynamic"
  unit_of_measurement: "K"
  availability: >
    {{ states('sensor.heating_preheat_offset_dynamic_uncapped') | is_number
       and states('input_number.heating_max_offset_k') | is_number }}
  state: >
    {% set uncapped = states('sensor.heating_preheat_offset_dynamic_uncapped') | float %}
    {% set max_offset = states('input_number.heating_max_offset_k') | float %}
    {% if uncapped > max_offset %}
      {{ max_offset }}
    {% elif uncapped < 0 %}
      0
    {% else %}
      {{ uncapped }}
    {% endif %}
