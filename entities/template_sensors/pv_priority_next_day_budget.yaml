trigger:
  - platform: time_pattern
    minutes: "/5"
sensor:
  - name: "PV Priority Next Day Budget"
    unique_id: pv_priority_next_day_budget
    unit_of_measurement: "kWh"
    icon: mdi:chart-timeline-variant
    state: >
      {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
      {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
      {% set t0 = as_timestamp(now()) %}
      {% set t1 = t0 + (24 * 3600) %}
      {% set ns = namespace(total=0.0) %}
      {% if pv_predictions is mapping %}
        {% for ts_str, val in pv_predictions.items() %}
          {% set ts = as_timestamp(ts_str) %}
          {% if ts is number and t0 <= ts < t1 %}
            {% set ns.total = ns.total + (val | float(0)) %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.total | round(3) }}
    attributes:
      pv_next_24h_kwh: >
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t1 = t0 + (24 * 3600) %}
        {% set ns = namespace(total=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t1 %}
              {% set ns.total = ns.total + (val | float(0)) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.total | round(3) }}
      pv_until_18h_kwh: >
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set ns = namespace(total=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t18 %}
              {% set ns.total = ns.total + (val | float(0)) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.total | round(3) }}
      pv_surplus_until_18h_kwh: >
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set base_load_kw = 0.45 %}
        {% set ns = namespace(total=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t18 %}
              {% set excess = (val | float(0)) - base_load_kw %}
              {% if excess > 0 %}
                {% set ns.total = ns.total + excess %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.total | round(3) }}
      pv_compressor_hours_until_18h: >
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set base_load_kw = 0.45 %}
        {% set pump_kw = 0.39 %}
        {% set ns = namespace(hours=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t18 %}
              {% set excess = (val | float(0)) - base_load_kw %}
              {% if excess >= pump_kw %}
                {% set ns.hours = ns.hours + 1.0 %}
              {% elif excess > 0.15 %}
                {% set ns.hours = ns.hours + (excess / pump_kw) %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.hours | round(2) }}
      water_stage1_target_kwh: >
        {% set t_out = states('input_number.outside_temp_forecast_24h_c') | float(states('sensor.outside_temperature') | float(12)) %}
        {% set t_clamped = [[-5.0, t_out] | max, 25.0] | min %}
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set ns = namespace(pv_18h=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t18 %}
              {% set ns.pv_18h = ns.pv_18h + (val | float(0)) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {# Hipped roof + thermosiphon intake: attic stays ~8K warmer than outside even at night/dusk (15°C at 19:40 when outside is 7°C), plus solar boost on sunny days #}
        {% set roof_solar_bonus_kwh = [[ns.pv_18h / 20.0, 0.0] | max, 1.0] | min * 0.25 %}
        {{ (4.30 - 0.02 * t_clamped - roof_solar_bonus_kwh) | round(2) }}
      water_stage1_done_today_kwh: >
        {{ (states('sensor.water_heating_pump_daily') | float(0) / 1000.0) | round(3) }}
      water_stage1_remaining_kwh: >
        {% set t_out = states('input_number.outside_temp_forecast_24h_c') | float(states('sensor.outside_temperature') | float(12)) %}
        {% set t_clamped = [[-5.0, t_out] | max, 25.0] | min %}
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set ns = namespace(pv_18h=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t18 %}
              {% set ns.pv_18h = ns.pv_18h + (val | float(0)) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set roof_solar_bonus_kwh = [[ns.pv_18h / 20.0, 0.0] | max, 1.0] | min * 0.25 %}
        {% set target = 4.30 - 0.02 * t_clamped - roof_solar_bonus_kwh %}
        {% set done = (states('sensor.water_heating_pump_daily') | float(0) / 1000.0) %}
        {{ [target - done, 0] | max | round(3) }}
      heating_need_next_day_kwh: >
        {% set c = states('input_number.building_heat_capacity') | float(0) %}
        {% set weights = {'wohnzimmer': 11.9, 'kueche': 19.5, 'flur': 29.0, 'schlafzimmer': 9.1, 'buero_fabian': 6.6, 'buero_merja': 13.9, 'bad': 4.9, 'speisekammer': 5.1} %}
        {% set wns = namespace(w_sum=0.0, w_total=0.0) %}
        {% for room, w in weights.items() %}
          {% set val = states('input_number.heating_base_' ~ room) | float(none) %}
          {% if val is not none %}
            {% set wns.w_sum = wns.w_sum + (val * w) %}
            {% set wns.w_total = wns.w_total + w %}
          {% endif %}
        {% endfor %}
        {% set setpoint_mean = (wns.w_sum / wns.w_total) if wns.w_total > 0 else 0 %}
        {% set inside_now = states('sensor.inside_temp_mean_now') | float(0) %}
        {% set missing_delta_k = [setpoint_mean - inside_now, 0] | max %}
        {% set off = states('sensor.heating_preheat_offset_24h_max') | float(0) %}
        {{ [c * (off + missing_delta_k), 0] | max | round(3) }}
      allocated_to_water_stage1_kwh: >
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t1 = t0 + (24 * 3600) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set pv = namespace(total=0.0, pv_18h=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t1 %}
              {% set pv.total = pv.total + (val | float(0)) %}
            {% endif %}
            {% if ts is number and t0 <= ts < t18 %}
              {% set pv.pv_18h = pv.pv_18h + (val | float(0)) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set t_out = states('input_number.outside_temp_forecast_24h_c') | float(states('sensor.outside_temperature') | float(12)) %}
        {% set t_clamped = [[-5.0, t_out] | max, 25.0] | min %}
        {% set roof_solar_bonus_kwh = [[pv.pv_18h / 20.0, 0.0] | max, 1.0] | min * 0.25 %}
        {% set target = 4.30 - 0.02 * t_clamped - roof_solar_bonus_kwh %}
        {% set stage1_remaining = [target - ((states('sensor.water_heating_pump_daily') | float(0)) / 1000.0), 0] | max %}
        {% set pv_total = pv.total | float(0) %}
        {{ [pv_total, stage1_remaining] | min | round(3) }}
      pv_after_water_stage1_kwh: >
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t1 = t0 + (24 * 3600) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set pv = namespace(total=0.0, pv_18h=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t1 %}
              {% set pv.total = pv.total + (val | float(0)) %}
            {% endif %}
            {% if ts is number and t0 <= ts < t18 %}
              {% set pv.pv_18h = pv.pv_18h + (val | float(0)) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set t_out = states('input_number.outside_temp_forecast_24h_c') | float(states('sensor.outside_temperature') | float(12)) %}
        {% set t_clamped = [[-5.0, t_out] | max, 25.0] | min %}
        {% set roof_solar_bonus_kwh = [[pv.pv_18h / 20.0, 0.0] | max, 1.0] | min * 0.25 %}
        {% set target = 4.30 - 0.02 * t_clamped - roof_solar_bonus_kwh %}
        {% set stage1_remaining = [target - ((states('sensor.water_heating_pump_daily') | float(0)) / 1000.0), 0] | max %}
        {% set alloc_stage1 = [pv.total | float(0), stage1_remaining] | min %}
        {% set pv_total = pv.total | float(0) %}
        {{ [pv_total - alloc_stage1, 0] | max | round(3) }}
      allocated_to_heating_kwh: >
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t1 = t0 + (24 * 3600) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set pv = namespace(total=0.0, pv_18h=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t1 %}
              {% set pv.total = pv.total + (val | float(0)) %}
            {% endif %}
            {% if ts is number and t0 <= ts < t18 %}
              {% set pv.pv_18h = pv.pv_18h + (val | float(0)) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set t_out = states('input_number.outside_temp_forecast_24h_c') | float(states('sensor.outside_temperature') | float(12)) %}
        {% set t_clamped = [[-5.0, t_out] | max, 25.0] | min %}
        {% set roof_solar_bonus_kwh = [[pv.pv_18h / 20.0, 0.0] | max, 1.0] | min * 0.25 %}
        {% set target = 4.30 - 0.02 * t_clamped - roof_solar_bonus_kwh %}
        {% set stage1_remaining = [target - ((states('sensor.water_heating_pump_daily') | float(0)) / 1000.0), 0] | max %}
        {% set pv_after_stage1 = [pv.total | float(0) - ([pv.total | float(0), stage1_remaining] | min), 0] | max %}
        {% set c = states('input_number.building_heat_capacity') | float(0) %}
        {% set weights = {'wohnzimmer': 11.9, 'kueche': 19.5, 'flur': 29.0, 'schlafzimmer': 9.1, 'buero_fabian': 6.6, 'buero_merja': 13.9, 'bad': 4.9, 'speisekammer': 5.1} %}
        {% set wns = namespace(w_sum=0.0, w_total=0.0) %}
        {% for room, w in weights.items() %}
          {% set val = states('input_number.heating_base_' ~ room) | float(none) %}
          {% if val is not none %}
            {% set wns.w_sum = wns.w_sum + (val * w) %}
            {% set wns.w_total = wns.w_total + w %}
          {% endif %}
        {% endfor %}
        {% set setpoint_mean = (wns.w_sum / wns.w_total) if wns.w_total > 0 else 0 %}
        {% set inside_now = states('sensor.inside_temp_mean_now') | float(0) %}
        {% set missing_delta_k = [setpoint_mean - inside_now, 0] | max %}
        {% set off = states('sensor.heating_preheat_offset_24h_max') | float(0) %}
        {% set heating_need = [c * (off + missing_delta_k), 0] | max %}
        {{ [pv_after_stage1, heating_need] | min | round(3) }}
      heating_uncovered_kwh: >
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t1 = t0 + (24 * 3600) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set pv = namespace(total=0.0, pv_18h=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t1 %}
              {% set pv.total = pv.total + (val | float(0)) %}
            {% endif %}
            {% if ts is number and t0 <= ts < t18 %}
              {% set pv.pv_18h = pv.pv_18h + (val | float(0)) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set t_out = states('input_number.outside_temp_forecast_24h_c') | float(states('sensor.outside_temperature') | float(12)) %}
        {% set t_clamped = [[-5.0, t_out] | max, 25.0] | min %}
        {% set roof_solar_bonus_kwh = [[pv.pv_18h / 20.0, 0.0] | max, 1.0] | min * 0.25 %}
        {% set target = 4.30 - 0.02 * t_clamped - roof_solar_bonus_kwh %}
        {% set stage1_remaining = [target - ((states('sensor.water_heating_pump_daily') | float(0)) / 1000.0), 0] | max %}
        {% set pv_after_stage1 = [pv.total | float(0) - ([pv.total | float(0), stage1_remaining] | min), 0] | max %}
        {% set c = states('input_number.building_heat_capacity') | float(0) %}
        {% set weights = {'wohnzimmer': 11.9, 'kueche': 19.5, 'flur': 29.0, 'schlafzimmer': 9.1, 'buero_fabian': 6.6, 'buero_merja': 13.9, 'bad': 4.9, 'speisekammer': 5.1} %}
        {% set wns = namespace(w_sum=0.0, w_total=0.0) %}
        {% for room, w in weights.items() %}
          {% set val = states('input_number.heating_base_' ~ room) | float(none) %}
          {% if val is not none %}
            {% set wns.w_sum = wns.w_sum + (val * w) %}
            {% set wns.w_total = wns.w_total + w %}
          {% endif %}
        {% endfor %}
        {% set setpoint_mean = (wns.w_sum / wns.w_total) if wns.w_total > 0 else 0 %}
        {% set inside_now = states('sensor.inside_temp_mean_now') | float(0) %}
        {% set missing_delta_k = [setpoint_mean - inside_now, 0] | max %}
        {% set off = states('sensor.heating_preheat_offset_24h_max') | float(0) %}
        {% set heating_need = [c * (off + missing_delta_k), 0] | max %}
        {% set heating_alloc = [pv_after_stage1, heating_need] | min %}
        {{ [heating_need - heating_alloc, 0] | max | round(3) }}
      remaining_after_heating_kwh: >
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t1 = t0 + (24 * 3600) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set pv = namespace(total=0.0, pv_18h=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t1 %}
              {% set pv.total = pv.total + (val | float(0)) %}
            {% endif %}
            {% if ts is number and t0 <= ts < t18 %}
              {% set pv.pv_18h = pv.pv_18h + (val | float(0)) %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set t_out = states('input_number.outside_temp_forecast_24h_c') | float(states('sensor.outside_temperature') | float(12)) %}
        {% set t_clamped = [[-5.0, t_out] | max, 25.0] | min %}
        {% set roof_solar_bonus_kwh = [[pv.pv_18h / 20.0, 0.0] | max, 1.0] | min * 0.25 %}
        {% set target = 4.30 - 0.02 * t_clamped - roof_solar_bonus_kwh %}
        {% set stage1_remaining = [target - ((states('sensor.water_heating_pump_daily') | float(0)) / 1000.0), 0] | max %}
        {% set pv_after_stage1 = [pv.total | float(0) - ([pv.total | float(0), stage1_remaining] | min), 0] | max %}
        {% set c = states('input_number.building_heat_capacity') | float(0) %}
        {% set weights = {'wohnzimmer': 11.9, 'kueche': 19.5, 'flur': 29.0, 'schlafzimmer': 9.1, 'buero_fabian': 6.6, 'buero_merja': 13.9, 'bad': 4.9, 'speisekammer': 5.1} %}
        {% set wns = namespace(w_sum=0.0, w_total=0.0) %}
        {% for room, w in weights.items() %}
          {% set val = states('input_number.heating_base_' ~ room) | float(none) %}
          {% if val is not none %}
            {% set wns.w_sum = wns.w_sum + (val * w) %}
            {% set wns.w_total = wns.w_total + w %}
          {% endif %}
        {% endfor %}
        {% set setpoint_mean = (wns.w_sum / wns.w_total) if wns.w_total > 0 else 0 %}
        {% set inside_now = states('sensor.inside_temp_mean_now') | float(0) %}
        {% set missing_delta_k = [setpoint_mean - inside_now, 0] | max %}
        {% set off = states('sensor.heating_preheat_offset_24h_max') | float(0) %}
        {% set heating_need = [c * (off + missing_delta_k), 0] | max %}
        {% set heating_alloc = [pv_after_stage1, heating_need] | min %}
        {{ [pv_after_stage1 - heating_alloc, 0] | max | round(3) }}
      battery_min_soc_pct: 15
      battery_stage2_target_soc_pct: 90
      battery_soc_pct: >
        {{ states('sensor.pv_battery1_state_of_charge') | float(0) | round(2) }}
      battery_capacity_kwh: >
        {{ (states('sensor.pv_battery1_size_max') | float(0) / 1000.0) | round(3) }}
      battery_needed_before_stage2_kwh: >
        {% set cap = (states('sensor.pv_battery1_size_max') | float(0) / 1000.0) %}
        {% set soc = states('sensor.pv_battery1_state_of_charge') | float(0) %}
        {% set target = 90.0 %}
        {% set missing_pct = [target - soc, 0] | max %}
        {{ (cap * missing_pct / 100.0) | round(3) }}
      allocated_to_battery_before_stage2_kwh: >
        {% set pv_predictions_raw = state_attr('sensor.solar_prediction_kwh', 'predictions') %}
        {% set pv_predictions = pv_predictions_raw | from_json(default={}) if pv_predictions_raw is string else pv_predictions_raw %}
        {% set t0 = as_timestamp(now()) %}
        {% set t1 = t0 + (24 * 3600) %}
        {% set t18_today = as_timestamp(now().replace(hour=18, minute=0, second=0, microsecond=0)) %}
        {% set t18 = t18_today if t0 < t18_today else (t18_today + 86400) %}
        {% set pv = namespace(total=0.0, pv_18h=0.0) %}
        {% if pv_predictions is mapping %}
          {% for ts_str, val in pv_predictions.items() %}
            {% set ts = as_timestamp(ts_str) %}
            {% if ts is number and t0 <= ts < t1 %}
              {% set pv.total = pv.total + (val | float(0)) %}
            {% endif %}
            {% if ts is number and t0 <= ts < t18 %}
