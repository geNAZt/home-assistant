sensor:
- name: "Heating Power schlafzimmer"
  unique_id: heating_power_schlafzimmer
  unit_of_measurement: "W"
  device_class: power
  state_class: measurement
  state: >
    {% if is_state('switch.heating_schlafzimmer', 'on') %}
      {% set voltage = states('sensor.pv_m1_ac_voltage_an') | float(230) %}
      {% set raw_ma = states('sensor.current_l1_schlafzimmer_current') %}
      {% if raw_ma not in ['unknown', 'unavailable', 'none', 'None', ''] %}
        {% set current = (raw_ma | float(0)) / 1000.0 %}
      {% else %}
        {% set current = states('input_number.heater_schlafzimmer_rated_a') | float(0) %}
      {% endif %}
      {{ (current * voltage) | round(0) }}
    {% else %}
      0
    {% endif %}