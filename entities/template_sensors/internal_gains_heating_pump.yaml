sensor:
- name: "Internal Gains Heating Pump"
  unique_id: internal_gains_heating_pump
  unit_of_measurement: 'W'
  device_class: power
  state_class: measurement
  state: >
    {% set p = states('sensor.water_heating_pump_power') | float(0) %}
    {# Vaillant aroSTOR VWL BM 270/5 im HWR:
       Kompressorleistung geht in das 60°C Brauchwasser (nicht zusätzlich in den Raum!).
       Netto-Raumbeitrag = Speicher-Stillstandsverlust (~35 W) minus kalte Luftkanäle im Betrieb (~20 W) * HWR-Kopplung #}
    {% if is_state('binary_sensor.vacation_mode_water_heater', 'on') %}
      5.0
    {% elif p > 30 %}
      10.0
    {% else %}
      22.0
    {% endif %}
  attributes:
    consumes: >
      {{ states('sensor.water_heating_pump_power') | float(0) | round(1) }}
