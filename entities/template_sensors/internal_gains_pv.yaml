sensor:
- name: "Internal Gains PV"
  unique_id: internal_gains_pv
  unit_of_measurement: 'W'
  device_class: power
  state_class: measurement
  state: >
    {% set ac_pwr = states('sensor.pv_ac_power') | float(0) %}
    {% set bat_pwr = states('sensor.pv_battery1_power') | float(0) %}
    {% set throughput = ac_pwr | abs %}

    {# 1. Wechselrichter-Abwärme im HWR (~2.2% Durchsatzverlust; Nacht-Standby ohne Akku ist bereits in solar_grid_to_house_w) #}
    {% if ac_pwr < 0 and (bat_pwr | abs) <= 5 %}
      {% set wr_loss = 0.0 %}
    {% elif throughput > 15 %}
      {% set wr_loss = (throughput * 0.022) + 8.0 %}
    {% else %}
      {% set wr_loss = 4.0 %}
    {% endif %}

    {# 2. BYD-Batterieturm chemische + DC/DC-Verlustwärme (~3%) #}
    {% set bat_loss = (bat_pwr | abs) * 0.03 %}

    {# 3. Thermische Kopplung HWR -> Wohnbereich (~0.65) #}
    {{ ((wr_loss + bat_loss) * 0.65) | round(1) }}
