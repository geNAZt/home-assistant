sensor:
- name: "Solar Gain Wohnzimmer"
  unique_id: solar_gain_wohnzimmer
  unit_of_measurement: 'W'
  device_class: power
  state_class: measurement
  state: >
    {% set rad = states('sensor.barsinghausen_hohenb_sonneneinstrahlung') | float(0) %}
    {% set ele = state_attr('sun.sun', 'elevation') | float(0) %}
    {% set azi = state_attr('sun.sun', 'azimuth') | float(0) %}
    {% set cloud = (states('sensor.barsinghausen_hohenb_bewolkungsgrad') | float(0)) / 100 %}
    {% set ns = namespace(total=0) %}


      
    {% if ele > 0 and ((azi - 180 + 180) % 360 - 180) | abs < 90 %}
      {% set pos = (state_attr('cover.rollade_wohnzimmer_links', 'current_position') | float(100) / 100) %}
      
      {# Manuelle Umrechnung: Grad * 0.0174532925 #}
      {% set cos_factor = ((azi - 180) * 0.0174532925) | cos | abs %}
      {% set rel_azi = ((azi - 180 + 180) % 360 - 180) %}
      
      {# Glazingeigenschaften mit Winkelabhängigkeit (Karlsson & Roos Modell für Dreifachverglasung) #}
      {% set cos_aoi = ((ele * 0.0174532925) | cos) * cos_factor %}
      {% set term = 1.0 - cos_aoi %}
      {% set g_modifier = 1.0 - term * term * term %}
      {% set g_dir = 0.53 * g_modifier %}
      {% set g_diff = 0.53 * 0.87 %}
      
      {# Bewölkungsabhängiger Diffusanteil #}
      {% set s_factor = 0.15 + (1.0 - 0.15) * cloud %}
      
      {% set direct_factor = 1.0 %}
      {% set diffuse_factor = 1.0 %}
      {% set tan_prof = ((ele * 0.0174532925) | tan) / ([cos_factor, 0.05] | max) %}
          {# Continuous shading from bottom #}
          {% set shadow_h = 5.0 - (7.2 * tan_prof) %}
          {% set win_top = 1.98 %}
          {% set win_bottom = 0.0 %}
          {% set sun_h = [0, win_top - [win_bottom, shadow_h]|max]|max %}
          {% set direct_factor = [direct_factor, sun_h / 1.98] | min %}
          {# Continuous overhang shading from top (e.g. Vordach / roof) #}
          {% set shadow_h = 2.9 - (3.0 * tan_prof) %}
          {% set win_top = 1.98 %}
          {% set win_bottom = 0.0 %}
          {% set sun_h = [0, [shadow_h, win_top]|min - win_bottom]|max %}
          {% set df_top = sun_h / 1.98 %}
          {% set direct_factor = [direct_factor, df_top] | min %}
          {% set diffuse_factor = [diffuse_factor, 0.3 + 0.7 * df_top] | min %}
          {% if rel_azi < 0 %}
            {% set shadow_w = 4.0 * ((-rel_azi * 0.0174532925) | tan) %}
            {% set direct_factor = [direct_factor, [0, 1 - (shadow_w / 1.4)] | max] | min %}
          {% endif %}

      {% set sun_part = [pos, direct_factor]|min %}
      
      {# Gesamtleistung inkl. Direkt-, Diffus- und Bodenreflexionsanteil #}
      {% set direct_part_gain = sun_part * (1.0 - s_factor) * g_dir %}
      {% set diffuse_part_gain = pos * s_factor * g_diff * diffuse_factor %}
      {% set ground_ref_gain = 0.10 * pos * g_diff * diffuse_factor %}
      
      {% set total_gain_factor = cos_factor * (direct_part_gain + diffuse_part_gain) + ground_ref_gain %}
      {% set ns.total = ns.total + (2.772 * rad * total_gain_factor) %}
    {% endif %}


      
    {% if ele > 0 and ((azi - 180 + 180) % 360 - 180) | abs < 90 %}
      {% set pos = (state_attr('cover.rollade_wohnzimmer_rechts', 'current_position') | float(100) / 100) %}
      
      {# Manuelle Umrechnung: Grad * 0.0174532925 #}
      {% set cos_factor = ((azi - 180) * 0.0174532925) | cos | abs %}
      {% set rel_azi = ((azi - 180 + 180) % 360 - 180) %}
      
      {# Glazingeigenschaften mit Winkelabhängigkeit (Karlsson & Roos Modell für Dreifachverglasung) #}
      {% set cos_aoi = ((ele * 0.0174532925) | cos) * cos_factor %}
      {% set term = 1.0 - cos_aoi %}
      {% set g_modifier = 1.0 - term * term * term %}
      {% set g_dir = 0.53 * g_modifier %}
      {% set g_diff = 0.53 * 0.87 %}
      
      {# Bewölkungsabhängiger Diffusanteil #}
      {% set s_factor = 0.15 + (1.0 - 0.15) * cloud %}
      
      {% set direct_factor = 1.0 %}
      {% set diffuse_factor = 1.0 %}
      {% set tan_prof = ((ele * 0.0174532925) | tan) / ([cos_factor, 0.05] | max) %}
          {# Continuous shading from bottom #}
          {% set shadow_h = 5.0 - (7.5 * tan_prof) %}
          {% set win_top = 1.98 %}
          {% set win_bottom = 0.0 %}
          {% set sun_h = [0, win_top - [win_bottom, shadow_h]|max]|max %}
          {% set direct_factor = [direct_factor, sun_h / 1.98] | min %}
          {# Continuous overhang shading from top (e.g. Vordach / roof) #}
          {% set shadow_h = 2.9 - (3.5 * tan_prof) %}
          {% set win_top = 1.98 %}
          {% set win_bottom = 0.0 %}
          {% set sun_h = [0, [shadow_h, win_top]|min - win_bottom]|max %}
          {% set df_top = sun_h / 1.98 %}
          {% set direct_factor = [direct_factor, df_top] | min %}
          {% set diffuse_factor = [diffuse_factor, 0.3 + 0.7 * df_top] | min %}

      {% set sun_part = [pos, direct_factor]|min %}
      
      {# Gesamtleistung inkl. Direkt-, Diffus- und Bodenreflexionsanteil #}
      {% set direct_part_gain = sun_part * (1.0 - s_factor) * g_dir %}
      {% set diffuse_part_gain = pos * s_factor * g_diff * diffuse_factor %}
      {% set ground_ref_gain = 0.10 * pos * g_diff * diffuse_factor %}
      
      {% set total_gain_factor = cos_factor * (direct_part_gain + diffuse_part_gain) + ground_ref_gain %}
      {% set ns.total = ns.total + (2.772 * rad * total_gain_factor) %}
    {% endif %}

    {{ ns.total | round(0) }}

