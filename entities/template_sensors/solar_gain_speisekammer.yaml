sensor:
- name: "Solar Gain Speisekammer"
  unique_id: solar_gain_speisekammer
  unit_of_measurement: 'W'
  device_class: power
  state_class: measurement
  state: >
    {% set rad_poa = states('input_number.solar_irradiance') | float(0) %}
    {% set dwd_ghi = states('sensor.barsinghausen_hohenb_sonneneinstrahlung') | float(-1) %}
    {% set t_out = states('sensor.outside_temperature') | float(10) %}
    {% set ele = state_attr('sun.sun', 'elevation') | float(0) %}
    {% set azi = state_attr('sun.sun', 'azimuth') | float(0) %}
    {% set cloud = [ [(states('sensor.barsinghausen_hohenb_bewolkungsgrad') | float(50)) / 100.0, 0.0] | max, 1.0] | min %}
    {% set ns = namespace(total=0.0) %}

    {% if ele > 0 %}
      {% set deg2rad = 0.0174532925 %}
      {% set sin_ele = (ele * deg2rad) | sin %}
      {% set cos_ele = (ele * deg2rad) | cos %}
      {# Dach-POA (Peak-Modul ~25° Neigung + Zelltemperatur-Effekt) sauber auf horizontale Globalstrahlung (GHI) umrechnen #}
      {% set t_cell = t_out + 0.025 * rad_poa %}
      {% set temp_corr = [ [1.0 + 0.0035 * (25.0 - t_cell), 0.85] | max, 1.15] | min %}
      {% set sin_poa = (([ele + 25.0, 88.0] | min) * deg2rad) | sin %}
      {% set s_cloud = 0.15 + 0.85 * cloud %}
      {% set poa_to_ghi = (1.0 - s_cloud) * ([sin_ele, 0.05] | max / [sin_poa, 0.15] | max) + s_cloud * 0.95 %}
      {% set ghi_clear_max = 1080.0 * ([sin_ele, 0.0] | max ** 1.15) %}
      {% if rad_poa > 0 %}
        {% set ghi = [(rad_poa / temp_corr) * poa_to_ghi, ghi_clear_max] | min %}
      {% elif dwd_ghi >= 0 %}
        {% set ghi = [dwd_ghi, ghi_clear_max] | min %}
      {% else %}
        {% set ghi = 0.0 %}
      {% endif %}


      {% set raw_pos = state_attr('cover.rollade_speisekammer', 'current_position') %}
      {% set pos_pct = (0.0 if is_state('cover.rollade_speisekammer', 'closed') else 100.0) if (raw_pos is none or raw_pos == '') else (raw_pos | float(100)) %}
      {% set pos = [ [pos_pct / 100.0, 0.0] | max, 1.0] | min %}
      {% set s_factor = 0.15 + (1.0 - 0.15) * cloud %}
      {% set dhi = ghi * s_factor %}
      {% set dni = [(ghi * (1.0 - s_factor)) / ([sin_ele, 0.08] | max), 950.0] | min %}
      {% set g_diff = 0.53 * 0.87 %}
      {% set rel_azi = ((azi - 90 + 180) % 360 - 180) %}
      {% set diffuse_factor = 1.0 %}
      {% set direct_w_m2 = 0.0 %}

      {% if (rel_azi | abs) < 90 %}
        {% set cos_factor = ((azi - 90) * deg2rad) | cos | abs %}
        {% set cos_aoi = cos_ele * cos_factor %}
        {% set term = 1.0 - cos_aoi %}
        {% set g_dir = 0.53 * (1.0 - term * term * term) %}
        {% set df_bottom = 1.0 %}
        {% set df_top = 1.0 %}
        {% set df_side = 1.0 %}
        {% set tan_prof = ((ele * deg2rad) | tan) / ([cos_factor, 0.05] | max) %}

        {% set sun_part = [0, [pos, df_top]|min + df_bottom - 1]|max * df_side %}
        {% set direct_w_m2 = dni * cos_aoi * sun_part * g_dir %}
      {% endif %}

      {% set diffuse_w_m2 = 0.5 * dhi * pos * g_diff * diffuse_factor %}
      {% set ground_w_m2 = 0.10 * ghi * pos * g_diff * diffuse_factor %}
      {% set ns.total = ns.total + (0.24 * (direct_w_m2 + diffuse_w_m2 + ground_w_m2)) %}
    {% endif %}
    {{ ns.total | round(0) }}

