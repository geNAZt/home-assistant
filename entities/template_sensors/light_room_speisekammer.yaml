light:
- name: "Licht speisekammer (virtuell)"
  unique_id: room_speisekammer
  # state: on/off anhand des Auto-Boolean
  state: >-
    {% if is_state('input_boolean.auto_light_speisekammer', 'on') %}
      on
    {% else %}
      off
    {% endif %}
  # Helligkeit vom Helper holen
  level: "{{ states('input_number.speisekammer_brightness') | int(0) }}"
  # Einschalten der "Automatik"
  turn_on:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.auto_light_speisekammer
  # Ausschalten: Automatik OFF + echte Lampen aus
  turn_off:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.auto_light_speisekammer
    - action: light.turn_off
      target:
        entity_id: light.speisekammer_lights
  # Slider -> Helligkeits-Helper schreiben (+ aktive Lampen live aktualisieren)
  set_level:
    - action: input_number.set_value
      target:
        entity_id: input_number.speisekammer_brightness
      data:
        value: "{{ brightness }}"
    - if:
        - condition: state
          entity_id: light.speisekammer_lights
          state: "on"
      then:
        - action: light.turn_on
          target:
            entity_id: light.speisekammer_lights
          data:
            brightness: "{{ brightness }}"
  # Farbtemperatur-Slider -> Helper schreiben (+ aktive Lampen live aktualisieren)
  set_temperature:
    - action: input_number.set_value
      target:
        entity_id: input_number.speisekammer_color_temp
      data:
        value: "{{ color_temp_kelvin }}"
    - if:
        - condition: state
          entity_id: light.speisekammer_lights
          state: "on"
      then:
        - action: light.turn_on
          target:
            entity_id: light.speisekammer_lights
          data:
            color_temp_kelvin: "{{ color_temp_kelvin }}"