sensor:
- name: "Heating Power buero_merja"
  unique_id: heating_power_buero_merja
  unit_of_measurement: "W"
  device_class: power
  state_class: measurement
  state: >
    {% if is_state('switch.heating_buero_merja', 'on') %}
      {% set voltage = states('sensor.pv_m1_ac_voltage_cn') | float(230) %}

      {% set current = states('input_number.heater_buero_merja_rated_a') | float(0) %}
      {{ current * voltage | round(0) }}
    {% else %}
      0
    {% endif %}
    