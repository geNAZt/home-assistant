sensor:
- name: "Internal Gains Trockner"
  unique_id: internal_gains_trockner
  unit_of_measurement: 'W'
  device_class: power
  state_class: measurement
  state: >
    {% set p = states('sensor.shellyplus2pm_485519a264d8_switch_0_power') | float(0) %}
    {# Wärmepumpentrockner im HWR: ~70% sensible Wärme im Gebäude, ~30% warmes Kondensat & Restfeuchte #}
    {% if p > 10 %}
      {{ (p * 0.70) | round(1) }}
    {% else %}
      0.0
    {% endif %}
  attributes:
    consumes: >
      {{ states('sensor.shellyplus2pm_485519a264d8_switch_0_power') | float(0) | round(1) }}
