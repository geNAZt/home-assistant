sensor:
- name: "Internal Gains Waschmaschine"
  unique_id: internal_gains_waschmaschine
  unit_of_measurement: 'W'
  device_class: power
  state_class: measurement
  state: >
    {% set p = states('sensor.shellyplus2pm_485519a264d8_switch_1_power') | float(0) %}
    {# ~20% Motor-/Gehäuseabwärme im Raum, ~80% Heizstabenergie geht mit der warmen Lauge ins Abwasser #}
    {% if p > 10 %}
      {{ (p * 0.20) | round(1) }}
    {% else %}
      0.0
    {% endif %}
  attributes:
    consumes: >
      {{ states('sensor.shellyplus2pm_485519a264d8_switch_1_power') | float(0) | round(1) }}
