sensor:
- name: "Heating Power kueche"
  unique_id: heating_power_kueche
  unit_of_measurement: "W"
  device_class: power
  state_class: measurement
  state: >
    {% if is_state('switch.heating_kueche', 'on') %}
      {% set voltage = states('sensor.pv_m1_ac_voltage_an') | float(230) %}

      {% set current = states('input_number.heater_kueche_rated_a') | float(0) %}
      {{ current * voltage | round(0) }}
    {% else %}
      0
    {% endif %}
    